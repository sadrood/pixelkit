<!DOCTYPE html>

<title>人生之书 · 互动小说（玩法加厚版 v2）</title>
<style>
:root{
  --paper:#f7f4ed; --paper2:#fffdf8; --ink:#2c2620; --ink2:#6b6055; --line:#e2dbcd;
  --lamp:#c0703a; --lamp2:#e8a56b; --gold:#b8912f; --dim:#c9c1b2;
  --ok:#4a7c59; --bad:#a4503f; --card:#fffdf8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Songti SC","SimSun","Noto Serif CJK SC",Georgia,serif;
  font-size:17px; line-height:1.95; letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 80px;display:grid;grid-template-columns:1fr 268px;gap:28px}
/* 手机/窄屏：单列 + 把灯谱提到最前并吸顶——不然读一章要先滚到底才看得到灯 */
@media (max-width:880px){
  .wrap{grid-template-columns:1fr;gap:16px;display:flex;flex-direction:column}
  aside{order:-1;position:sticky;top:0;z-index:8;background:var(--paper);padding:8px 0 6px;
    border-bottom:1px solid var(--line);max-height:40vh;overflow:auto}
  aside .panel{margin-bottom:8px}
  aside .lamps{grid-template-columns:repeat(9,1fr);gap:4px}
}

/* header */
header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fffdf8,#f7f4ed)}
.hd{max-width:1080px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-size:20px;letter-spacing:.16em;font-weight:600}
.logo small{display:block;font-size:11px;letter-spacing:.22em;color:var(--ink2);font-weight:400;margin-top:2px}
.hd .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--paper2);color:var(--ink);
  padding:6px 13px;border-radius:3px;font-size:13px;letter-spacing:.06em;transition:.15s}
.btn:hover{border-color:var(--lamp);color:var(--lamp)}
.btn.pri{background:var(--lamp);border-color:var(--lamp);color:#fff}
.btn.pri:hover{background:#a55c2c;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* main */
main{padding-top:34px}
.chap-tag{font-size:12px;letter-spacing:.3em;color:var(--lamp);margin-bottom:6px}
h2{font-size:24px;margin:0 0 4px;letter-spacing:.06em;font-weight:600}
.age{font-size:12px;color:var(--ink2);letter-spacing:.1em;margin-bottom:22px}
p{margin:0 0 17px;text-indent:2em}
p.ann{text-indent:0;color:var(--ink2);font-size:14.5px;border-left:2px solid var(--line);padding-left:12px}
.fade{animation:fi .5s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.center{text-align:center;color:var(--ink2);font-size:15px;text-indent:0}

/* choices */
.choices{margin-top:30px;border-top:1px dashed var(--line);padding-top:24px}
.ch{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:4px;padding:14px 16px;margin-bottom:11px;display:block;transition:.16s;position:relative}
.ch:hover{border-color:var(--lamp2);background:#fffaf2;transform:translateX(3px)}
.ch .k{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;
  border:1px solid var(--lamp);color:var(--lamp);border-radius:50%;font-size:11px;margin-right:9px;vertical-align:2px}
.ch .t{font-size:16px;line-height:1.6}
.ch.locked{opacity:.5;cursor:not-allowed;background:#f1ede4;border-style:dashed}
.ch.locked:hover{transform:none;border-color:var(--line);background:#f1ede4}
.ch .lk{display:block;font-size:12.5px;color:var(--bad);margin-top:6px;margin-left:29px;line-height:1.6}
.ch .peek{display:block;font-size:12.5px;color:var(--lamp);margin-top:6px;margin-left:29px;line-height:1.6}
.echobar{margin-top:8px;font-size:13px;color:var(--ink2)}
.echobar-hint{cursor:help;border-bottom:1px dotted var(--line)}
.echobar-hint em{font-style:normal;display:inline-block;width:14px;height:14px;line-height:13px;text-align:center;
  border:1px solid var(--line);border-radius:50%;font-size:10px;color:var(--ink2);vertical-align:1px}
.ann.echo-hint{opacity:.9}

/* side */
aside{padding-top:34px}
.panel{background:var(--paper2);border:1px solid var(--line);border-radius:4px;padding:14px 15px;margin-bottom:14px}
.panel h3{margin:0 0 11px;font-size:12px;letter-spacing:.24em;color:var(--ink2);font-weight:600}
.lamps{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.lp{aspect-ratio:1;border:1px solid var(--line);border-radius:3px;display:flex;align-items:center;
  justify-content:center;font-size:13px;color:var(--dim);background:#f4f0e7;position:relative;transition:.3s}
.lp.on{color:#fff;background:var(--lamp);border-color:var(--lamp);box-shadow:0 0 8px rgba(192,112,58,.35)}
.lp.on2{background:#a95c26;border-color:#a95c26}
.lp.off{color:var(--bad);border-color:#e6cfc9;background:#faf1ee;text-decoration:line-through}
.lp em{position:absolute;right:1px;bottom:0;font-size:9px;font-style:normal;opacity:.9}
.att{margin-bottom:9px}
.att .row{display:flex;align-items:center;gap:8px;font-size:13px}
.att .nm{width:34px;color:var(--ink2);font-size:12.5px}
.bar{flex:1;height:6px;background:#ece7dc;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lamp2),var(--lamp));transition:.4s}
.att .vl{width:16px;text-align:right;font-size:12px;color:var(--ink2)}
.stat{font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;padding:2px 0}
.stat b{color:var(--ink);font-weight:600}
.flags{font-size:12.5px;color:var(--ink2);line-height:1.85}
.flags span{display:inline-block;background:#f0ebe0;border-radius:2px;padding:1px 6px;margin:0 4px 4px 0}

/* start screen */
.start{max-width:920px;margin:56px auto;padding:0 20px;text-align:center}
.start h1{font-size:36px;letter-spacing:.3em;margin:0 0 6px;font-weight:600}
.start .sub{color:var(--ink2);font-size:14px;letter-spacing:.14em;margin-bottom:34px}
/* 世界线卡片：两列网格，并带上跨周目的灯谱/结局进度 */
.wl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;text-align:left;align-items:start}
@media (max-width:760px){.wl-grid{grid-template-columns:1fr}}
.wl{display:flex;flex-direction:column;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper2);
  border-radius:8px;padding:18px 20px;margin-bottom:0;transition:.16s}
.wl:hover{border-color:var(--lamp);transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.07)}
.wl-hd{display:flex;align-items:center;gap:8px}
.wl-hd b{font-size:18px;letter-spacing:.08em}
.wl-badge{flex:none;font-size:10.5px;letter-spacing:.1em;color:var(--lamp);
  border:1px solid color-mix(in srgb,var(--lamp) 45%,transparent);border-radius:999px;padding:1px 8px}
.wl .d{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.7}
.wl-prog{display:flex;align-items:center;gap:10px;margin-top:12px}
.wl-bar{flex:1;height:4px;border-radius:2px;background:#ece7dc;overflow:hidden}
.wl-bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--lamp2),var(--lamp))}
.wl-num{flex:none;font-size:11px;color:var(--ink2);letter-spacing:.04em;white-space:nowrap}
.wl .m{font-size:11.5px;color:var(--lamp);margin-top:10px;letter-spacing:.06em;opacity:.85}

/* modal */
.mask{position:fixed;inset:0;background:rgba(38,32,26,.5);display:flex;align-items:center;
  justify-content:center;padding:24px;z-index:50;animation:fi .2s both}
.modal{background:var(--paper2);border:1px solid var(--line);border-radius:6px;max-width:660px;
  width:100%;max-height:82vh;overflow:auto;padding:26px 28px}
.modal h3{margin:0 0 4px;font-size:19px;letter-spacing:.1em}
.modal .ms{color:var(--ink2);font-size:13px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.gc{border:1px solid var(--line);border-radius:3px;padding:9px 6px;text-align:center;font-size:13px;background:#f7f3ea}
.gc.on{border-color:var(--lamp);color:var(--lamp);background:#fff8f0}
.gc small{display:block;font-size:10px;color:var(--ink2);margin-top:2px}
.ach{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ach .ic{width:26px;text-align:center;color:var(--dim);font-size:15px}
.ach.got .ic{color:var(--gold)}
.ach .an{font-weight:600}
.ach .ad{font-size:12.5px;color:var(--ink2)}
.ach:not(.got){opacity:.5}

/* ending */
.endtitle{font-size:28px;letter-spacing:.22em;text-align:center;margin:10px 0 4px}
.endtag{text-align:center;color:var(--lamp);font-size:12px;letter-spacing:.3em;margin-bottom:26px}
.epi{border:1px solid var(--line);background:#fffaf2;border-radius:4px;padding:16px 18px;margin:26px 0;font-size:15.5px}
.epi .lb{font-size:11.5px;letter-spacing:.24em;color:var(--ink2);margin-bottom:8px}
/* AI 流式输出：未出字时是带秒数的呼吸提示，出字后逐字替换为正文 */
.aiphase{white-space:pre-wrap;word-break:break-word}
.aiphase p{margin:0;white-space:pre-wrap;word-break:break-word}
.aiwait{font-size:12.5px;color:var(--ink2);letter-spacing:.06em;animation:aibreathe 1.5s ease-in-out infinite}
@keyframes aibreathe{0%,100%{opacity:.5}50%{opacity:1}}
.epi.lit{border-left:3px solid var(--lamp);background:#fdf6ec}
.lp.on3{background:#7d3f12;border-color:#7d3f12;box-shadow:0 0 10px rgba(125,63,18,.5)}
.lampflash{position:fixed;right:18px;top:18px;z-index:60;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.lampflash .lf{background:rgba(192,112,58,.95);color:#fff;font-size:12.5px;letter-spacing:.08em;padding:6px 11px;border-radius:3px;box-shadow:0 2px 10px rgba(0,0,0,.18);animation:lfin .32s ease-out}
@keyframes lfin{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
.ann.hint{opacity:.9}
.delta{font-size:12px;color:var(--ink2);letter-spacing:.05em;margin:10px 0 2px;padding-left:9px;border-left:2px solid var(--line)}
.wl.resume{grid-column:1/-1;border-color:var(--lamp);background:#fff8ef}
.recap{font-size:13.5px;color:var(--ink2);line-height:2}
.recap b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(44,38,32,.93);
  color:#fff;padding:9px 18px;border-radius:3px;font-size:13.5px;z-index:99;animation:fi .25s both}

/* ============================================================
   阅读节奏 —— 把「换页」做成有先后的入场，而不是整块闪出来
   注意：入场动画统一用 animation-fill-mode: backwards。
   用 both 会把最终帧一直锁住，.ch 的 hover transform 就再也生效不了。
   ============================================================ */

/* 章节抬头：章节号 → 标题 → 岁数，依次落位 */
main > .chap-tag{animation:fi .42s ease backwards}
main > h2{animation:fi .5s ease backwards;animation-delay:70ms}
main > .age{animation:fi .5s ease backwards;animation-delay:130ms}

/* 选项逐条推入（延迟接在段落之后） */
.choices > .ch{animation:chIn .34s cubic-bezier(.2,.8,.3,1) backwards}
.choices > .ch:nth-child(1){animation-delay:200ms}
.choices > .ch:nth-child(2){animation-delay:255ms}
.choices > .ch:nth-child(3){animation-delay:310ms}
.choices > .ch:nth-child(4){animation-delay:365ms}
.choices > .ch:nth-child(5){animation-delay:420ms}
.choices > .ch:nth-child(6){animation-delay:475ms}
@keyframes chIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* 结算页的按钮 */
.choices > .btn{animation:fi .4s ease backwards;animation-delay:200ms}

/* 结局揭晓：标题从「散开」收拢到位，读起来像落款盖章 */
main > .endtitle{animation:endIn .62s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:150ms}
main > .endtag{animation:fi .5s ease backwards;animation-delay:280ms}
main > .epi{animation:fi .55s ease backwards;animation-delay:400ms}
main > .recap{animation:fi .55s ease backwards;animation-delay:480ms}
@keyframes endIn{
  from{opacity:0;transform:translateY(10px) scale(.94);letter-spacing:.5em}
  to{opacity:1;transform:none;letter-spacing:.22em}
}

/* 灯谱：满级的灯常亮呼吸（奖励感，不是噪音；普通灯不做动画避免每章重播） */
.lamps .lp.on3{animation:lampGlow 2.8s ease-in-out infinite}
@keyframes lampGlow{
  0%,100%{box-shadow:0 0 10px rgba(125,63,18,.45)}
  50%{box-shadow:0 0 18px rgba(125,63,18,.85)}
}

/* 新点亮的灯「落格」一下：只对刚点亮的那一批生效靠 JS 打标，这里给通用过渡 */
.lamps .lp{will-change:transform}

/* —— 图鉴 —— */
.cx-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.cx-cell{border:1px solid var(--line);border-radius:4px;padding:9px 10px;background:#f7f3ea}
.cx-k{font-size:11px;color:var(--ink2);letter-spacing:.14em}
.cx-v{margin-top:2px;display:flex;align-items:baseline;gap:2px}
.cx-v b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.cx-v span{font-size:12px;color:var(--ink2)}
.cx-cell .cx-bar{height:3px;margin-top:7px}
.cx-bar{height:4px;border-radius:2px;background:#ece7dc;overflow:hidden}
.cx-bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--lamp2),var(--lamp));transition:width .5s}
.cx-line{border-top:1px dashed var(--line);padding-top:14px;margin-bottom:16px}
.cx-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
.cx-hd b{font-size:14px;letter-spacing:.1em}
.cx-hd span{font-size:11.5px;color:var(--ink2)}
.cx-ends .gc,.cx-lamps .gc{font-size:11.5px;padding:7px 4px}
.cx-lamps{margin-bottom:8px}
@media (max-width:560px){.cx-sum{grid-template-columns:repeat(2,1fr)}}

/* 开卷：只在序章挂 .open-book，纸面轻轻抬起（每章都用就腻了） */
.wrap.open-book main{animation:bookOpen .72s cubic-bezier(.2,.8,.3,1) both;transform-origin:top center}
@keyframes bookOpen{
  from{opacity:0;transform:perspective(1000px) rotateX(7deg) translateY(16px)}
  to{opacity:1;transform:none}
}

/* 灯亮的那一刻——最该有仪式感的一帧：左侧灯线先「划开」，整块再从左边推入 */
main > .epi.lit{animation:litIn .55s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:380ms}
main > .epi.lit + .epi.lit{animation-delay:480ms}
main > .epi.lit + .epi.lit + .epi.lit{animation-delay:580ms}
@keyframes litIn{
  from{opacity:0;transform:translateX(-12px);border-left-width:0}
  to{opacity:1;transform:none;border-left-width:3px}
}

/* 序章 / 结算里的说明块与按钮，接在段落之后 */
.choices > .epi{animation:fi .5s ease backwards;animation-delay:140ms}
.choices > .btn.pri{animation:fi .45s ease backwards;animation-delay:280ms}
.choices > .btn:not(.pri){animation:fi .45s ease backwards;animation-delay:340ms}

/* 尊重系统的「减少动效」偏好 */
@media (prefers-reduced-motion:reduce){
  main > .chap-tag,main > h2,main > .age,main > .endtitle,main > .endtag,
  main > .epi,main > .recap,.choices > .ch,.choices > .btn,.choices > .epi,
  main > .epi.lit,.wrap.open-book main,.lamps .lp.on3{animation:none!important}
  .cx-bar i{transition:none}
}
/* ===== v2.4 玩法层：灯火道标 / 前尘 / 这一生 ===== */
.beacon-panel{border:1px solid var(--line);background:var(--paper2);border-radius:10px;padding:14px 16px;margin:0 0 18px}
.beacon-panel .lb{font-size:11.5px;letter-spacing:.3em;color:var(--lamp);margin-bottom:8px}
.bp-hint{font-size:12.5px;color:var(--ink2);line-height:1.85;margin:0 0 12px}
.bp-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.bp-lamp{position:relative;border:1px solid var(--line);background:var(--paper);color:var(--ink2);
  border-radius:8px;padding:8px 0;font-size:15px;line-height:1;transition:.15s}
.bp-lamp:hover{border-color:var(--lamp2);color:var(--ink)}
.bp-lamp.on{border-color:var(--lamp);background:#fff4e8;color:var(--lamp);font-weight:600;
  box-shadow:0 2px 10px rgba(192,112,58,.18)}
.bp-lamp.got{border-color:var(--gold)}
.bp-lamp.got:after{content:'';position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;
  background:var(--gold)}
.bp-lamp i{position:absolute;bottom:1px;right:4px;font-style:normal;font-size:9.5px;color:var(--gold)}
.bp-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  margin-top:12px;font-size:12.5px;color:var(--ink2)}
.bp-stat{color:var(--ink2);font-size:11.5px;letter-spacing:.04em}
.btn.sm{padding:3px 10px;font-size:12px}
.beacon-note{font-size:13px;color:var(--ink2);border-left:2px solid var(--lamp2);
  padding:6px 0 6px 10px;margin:12px 0;line-height:1.85}
.beacon-note b{color:var(--lamp);letter-spacing:.08em}
.beacon-note.dark{border-left-color:var(--bad)}
.beacon-note.dim{border-left-color:var(--line);color:var(--ink2)}
.beacon-res{border:1px solid var(--lamp2);background:#fffaf3;border-radius:10px;padding:14px 16px;margin:14px 0}
.beacon-res b{font-size:11.5px;letter-spacing:.3em;color:var(--lamp);display:block;margin-bottom:6px}
.beacon-res span{font-size:17px;letter-spacing:.14em;margin-right:10px}
.beacon-res i{font-style:normal;font-size:12.5px;color:var(--lamp);border:1px solid var(--lamp2);
  border-radius:20px;padding:1px 9px}
.beacon-res p{font-size:13.5px;color:var(--ink2);margin:10px 0 0;line-height:1.85}
.beacon-res .bsay{font-size:11.5px;color:var(--ink2);margin-top:8px}
.beacon-res.half{border-color:var(--gold);background:#fffdf2}
.beacon-res.half b,.beacon-res.half i{color:var(--gold);border-color:var(--gold)}
.beacon-res.miss{border-color:var(--line);background:#fbfaf7}
.beacon-res.miss b,.beacon-res.miss i{color:var(--dim);border-color:var(--line)}
.lifeline{border-top:1px solid var(--line);margin:26px 0 0;padding-top:16px}
.lifeline .lb{font-size:11.5px;letter-spacing:.3em;color:var(--lamp);margin-bottom:10px}
.ll-row{display:grid;grid-template-columns:64px 22px 1fr auto;gap:12px;align-items:baseline;
  padding:7px 0;border-bottom:1px dashed #efe9dd;font-size:13.5px;line-height:1.8}
.ll-age{color:var(--ink2);font-size:12px;letter-spacing:.04em;text-align:right}
.ll-k{color:var(--lamp);font-weight:600;text-align:center}
.ll-t{color:var(--ink)}
.ll-lamp{color:var(--gold);font-size:11.5px;letter-spacing:.06em;white-space:nowrap}
@media (max-width:880px){
  .bp-grid{grid-template-columns:repeat(6,1fr)}
  .ll-row{grid-template-columns:52px 20px 1fr;gap:8px}
  .ll-lamp{grid-column:3;justify-self:start;margin-top:2px}
}
.lp .lk{font-style:normal;font-size:10px;color:var(--bad);margin-left:2px}
.lp .tr{font-style:normal;font-size:10px;color:var(--gold);margin-left:2px}
.lp .cp{font-style:normal;font-size:10px;color:var(--ink2);margin-left:2px}
.evtag{display:inline-block;margin-left:8px;font-size:10.5px;letter-spacing:.16em;color:var(--lamp);
  border:1px solid var(--lamp2);border-radius:10px;padding:0 7px;vertical-align:1px}
.epi.evtagged{border-left:3px solid var(--lamp);background:#fffaf3}
.capnote{font-size:12.5px;color:var(--ink2);border-left:2px solid var(--line);padding:5px 0 5px 10px;margin:8px 0}

<script>
/* ============================================================
   人生之书 · 玩法加厚版 v2
   引擎：五维属性 + 18灯谱 + 随机人生事件 + 抉择锁 + 成就图鉴 + 二周目回响
   ============================================================ */

/* ---------- 存档（跨局：图鉴 / 成就 / 回响） ---------- */
var META_KEY='renshzh_v2_meta';
var META={codex:{lamps:{},endings:{},events:{}},ach:{},echoes:0,runs:0,lastEpitaph:''};
try{var _m=localStorage.getItem(META_KEY);if(_m)META=Object.assign(META,JSON.parse(_m));}catch(e){}
function saveMeta(){try{localStorage.setItem(META_KEY,JSON.stringify(META));}catch(e){}}

/* ---------- 结局分桶（按灯谱序号，跨世界线通用） ----------
   序号：0念 1担 2守 3孝 4欠 5融 | 6路 7踮 8远 9滚 10追 11桥 | 12藏 13痴 14诚 15暖 16归 17传 */
var BUCKETS=[
 {id:'chuan',   ix:[17,5]},
 {id:'zhideng', ix:[2,3,1]},
 {id:'yuanxing',ix:[6,7,8]},
 {id:'guntang', ix:[9,10]},
 {id:'shoudeng',ix:[15,14,11]},
 {id:'quejiao', ix:[4,12]},
 {id:'dengxue', ix:[0,13,16]}
];
function pickBucket(ctx,w){
  var best=BUCKETS[6],bs=-1,bm=w.lamps[0];
  for(var i=0;i<BUCKETS.length;i++){
    var b=BUCKETS[i],s=0,mx=-9,mk=w.lamps[b.ix[0]];
    for(var j=0;j<b.ix.length;j++){
      var k=w.lamps[b.ix[j]],v=ctx.lamps[k]||0;
      s+=v; if(v>mx){mx=v;mk=k;}
      if(v>=2)s+=1.5;
    }
    if(s>bs){bs=s;best=b;bm=mk;}
  }
  return {id:best.id,main:bm};
}

/* ---------- v2.4 玩法层①：灯火道标 · 命格偏置 ----------
   灯只由「人工写的 fx」点亮，AI 不参与——所以"想点某盏灯"必须靠玩家的选择，
   道标能帮的只有两件事：① 出身与天赋往那盏灯的方向偏一手（不做保底）；
   ② 开局在序章注明这局的暗灯是哪盏。命中与否仍旧看你怎么选。 */
var LAMP_AFFINITY=[
  {a:['men']},        /* 0 念 */ {a:['vit','soc']},   /* 1 担 */ {a:['men','vit']},   /* 2 守 */
  {a:['soc','men']},  /* 3 孝 */ {a:['coin','men']},  /* 4 欠 */ {a:['soc','arc']},   /* 5 融 */
  {a:['vit','arc']},  /* 6 路 */ {a:['men','vit']},   /* 7 踮 */ {a:['arc','soc']},   /* 8 远 */
  {a:['vit','men']},  /* 9 滚 */ {a:['arc','coin']},  /* 10 追 */{a:['soc','men']},   /* 11 桥 */
  {a:['coin','men']}, /* 12 藏 */{a:['men','arc']},   /* 13 痴 */{a:['soc','arc']},   /* 14 诚 */
  {a:['soc','men']},  /* 15 暖 */{a:['men','coin']},  /* 16 归 */{a:['arc','soc']},   /* 17 传 */
];
/* 注意：每条世界线的 18 盏灯各有各的字（origin 是「念担守…」，cyber 是「频载驻…」），
   所以界面上显示的灯名一律用 lampName() 从世界线自己的 lamps 里取，
   下面这套只用于「跨世界线通用的语义词」（前尘缺口、旧账卡这类跨线叙述）。 */
var BEACON_WORDS=['念','担','守','孝','欠','融','路','踮','远','滚','追','桥','藏','痴','诚','暖','归','传'];
/* 序号 → 某条世界线上这盏灯真正的名字。
   两种取值环境都要照顾到：
     · 生成页：世界线是按需加载的，首屏（选道标那一刻）W 还是空的，所以走 LAMP_SET 查表；
     · 原型单文件：没有 LAMP_SET，直接读已注册的世界线数据。
   传 wk 或不传（默认当前世界线）都可以。 */
var LAMP_SET=(function(){
  try{ if(typeof LINE_META!=='undefined'&&LINE_META)return LINE_META; }catch(e){}
  return null;
})();
/* 世界线的"轻量元数据"视图。
   生成页里世界线是按需加载的：首屏 WORLDLINES 是空的，只有 LINE_META 可用，
   所以开始界面（含道标选择器）的循环与灯名一律走 metaOf()；原型单文件则走已注册的 WORLDLINES。 */
function metaOf(wk){
  if(LAMP_SET&&wk&&LAMP_SET[wk])return LAMP_SET[wk];
  if(typeof WORLDLINES!=='undefined'&&WORLDLINES[wk])return WORLDLINES[wk];
  return null;
}
function metaKeys(){
  if(LAMP_SET)return Object.keys(LAMP_SET);
  return (typeof WORLDLINES!=='undefined')?Object.keys(WORLDLINES):[];
}
function lampName(ix,wk){
  var key=wk||(typeof W!=='undefined'&&W&&W.key?W.key:'');
  if(LAMP_SET&&key&&LAMP_SET[key]&&LAMP_SET[key].lamps&&LAMP_SET[key].lamps[ix]!=null)
    return LAMP_SET[key].lamps[ix];
  var w=(typeof WORLDLINES!=='undefined'&&key)?WORLDLINES[key]:null;
  if(w&&w.lamps&&w.lamps[ix]!=null)return w.lamps[ix];
  if(typeof W!=='undefined'&&W&&W.lamps&&W.lamps[ix]!=null)return W.lamps[ix];
  return BEACON_WORDS[ix]||'?';
}
/* 灯的语义词：缺口那句"你始终没能点着【X】"要跨世界线读得通，用通用词而不是各线自己的字 */
function lampWord(ix){ return BEACON_WORDS[ix]||'?'; }

/* ---------- v2.4 玩法层⑥：寿数（年龄第一次有了后果） ----------
   设计稿：docs/人生之书/年龄维度-设计稿.md（阈值按实测定，不是拍的）
   为什么挂在「累计寿数偏移」而不是体魄：实测减体魄 20 处、加体魄只有 19 处且多集中在第 3 章，
   拿体魄当生死闸时乱点策略 15.14% 暴毙——那等于随机杀人。累计偏移可复现、可解释、玩家看得见。 */
var YEARS_SELF=2;       /* 抉择明写的 years 字段优先 */
var YEARS_CAP=6;        /* 偏移上限：不能让"养生流"活到一百三 */
var AGE_WHITE=74;       /* 未及白首：没走到该走到的岁数 */
var AGE_DRY=83;         /* 灯尽油枯：活过了本该活的岁数（定 81 时乱点命中 25%，太密；83 在 p90 之上） */
var AGE_NOMINAL=78;     /* 第十二章名义年龄，用来在结局页显示"本该活到" */
var AGE_EARLY_FROM=40;  /* 从这一章起才可能早夭：少年不算 */
var AGE_EARLY_TO=55;    /* 早夭上限：过了这个岁数就不是"没熬过去"，而是"没活到白首"（给白首段留出 56~74） */
var AGE_EARLY_SHIFT=-5; /* 早夭阈值：偏移跌到这儿就活不到终章（定 -6 时实测不可达，-4 时又吃掉了白首段） */
/* 默认折算：没写 years 的抉择，加体魄 +2、减体魄 -1，其余 0。
   寿命必须是"少数选择累积出来的结果"——大多数抉择不动它。 */
function yearsForChoice(ch){
  if(!ch)return 0;
  if(ch.years)return ch.years;
  var a=(ch.fx&&ch.fx.attrs)||{};
  if(a.vit>0)return YEARS_SELF;
  if(a.vit<0)return -1;
  return 0;
}
function applyYears(y){ if(!y)return; S.lifeShift=(S.lifeShift||0)+y; if(S.lifeShift>YEARS_CAP)S.lifeShift=YEARS_CAP;
  if(S.delta)S.delta.yrs=(S.delta.yrs||0)+y; }
/* 进入第 i 章时的岁数 = 该章名义年龄 + 累计偏移。第 0 章不加偏移（幼年不该被后半程的选择影响） */
function chapterAge(i){ var c=(W&&W.chapters)?W.chapters[i]:null; return (c?c.age:0)+((i>0)?(S.lifeShift||0):0); }
/* 结局页要读：本局实际寿数（没走到终章就是当场那个岁数） */
function finalAge(){ return S.endAge!=null?S.endAge:(S.age||0); }
/* 灯与灯是有对位的：点着一盏，常常意味着另一盏没被点着。
   所以道标只针对「点亮」，绝不削弱任何稀有结局的阈值——独照、金灯无芯那些照旧靠选择打出来。 */
function beaconNameIx(ix){ return lampName(ix); }
/* 第 0 章渲染序章时用：本局暗着的目标灯是哪盏（只做提示，不加任何数值） */
function beaconDarkNote(){
  if(!S||!S.beacon||!S.beacon.length||!W||!W.lamps)return '';
  var miss=[];
  for(var i=0;i<S.beacon.length;i++){var ix=S.beacon[i];if((S.lamps[W.lamps[ix]]||0)<=0)miss.push(lampName(ix));}
  return miss.length?miss.join('、'):'';
}
/* 命格偏置：把出身与天赋各多抽几次，挑一组与该灯相性最好的（仍然随机，只是偏一手） */
function rollBiasedStart(w,targetIx){
  var pool=w.families||FAMILIES,pool2=w.talents||TALENTS;
  var aff=LAMP_AFFINITY[targetIx]||{a:[]};
  function score(f,t){
    var s=0;
    for(var i=0;i<aff.a.length;i++){
      var k=aff.a[i];
      s+=((f&&f.fx&&f.fx[k])||0)*2+((t&&t.fx&&t.fx[k])||0);
    }
    return s;
  }
  var bf=null,bt=null,bs=-1;
  for(var n=0;n<6;n++){
    var f=pick(pool),t=pick(pool2),s=score(f,t);
    if(s>bs){bs=s;bf=f;bt=t;}
    if(bs>=3)break;                       /* 已经够贴了就不再抽，避免变成"指定出身" */
  }
  return {family:bf,talent:bt,score:bs};
}

/* 道标的跨局状态：选中的只是"这局往哪盏灯使劲"，不锁抽签、不改任何判定 */
var pendingBeacon=null;
function beaconToggle(wk,ix){
  var want=(pendingBeacon&&pendingBeacon[0]===wk&&pendingBeacon[1]===ix)?null:[wk,ix];
  pendingBeacon=want; META.beacon=want; saveMeta(); render();
}
function beaconClear(){ pendingBeacon=null; META.beacon=null; saveMeta(); render(); }
function beaconStat(wk,ix){
  var by=(META.beaconStats&&META.beaconStats.byLamp)||{};
  return by[wk+'#'+ix]||0;   /* 这条世界线上，这盏灯被"立过道标且点着"的次数 */
}

/* ---------- v2.5 玩法层⑤：回头账（中局反转） ----------
   前十一章攒下的 flags 过去只是结算时的描述，现在它会在第七章兑现一次：
   这一段人生回过头来找你，**换掉后半程的走法**（给一盏灯 + 改三四个属性），
   而不是只给一点数值。这样"结局"不再只在最后一章才被决定。
   约束：一局只兑现一张；文案跨世界线通用（不用各线的专有名词），灯按名称给，五线都能用。 */
var CALLBACKS=[
  {id:'cb_parent', pri:1, need:function(S){return S.flags.no_goodbye&&!S.flags.father_alive;},
   n:'回 头 账',
   text:'父亲走的那年，你没有赶上。这件事你后来很少提，但它一直在。',
   t:'第七年，你在旧物里翻出一张没寄出去的信纸，抬头是你的名字。你按上面的地址找过去，那户人家早搬走了，邻居说他临终前念叨过一个"没回来"的孩子。',
   fx:{lamps:{'归':1},attrs:{men:-1}}},
  {id:'cb_fired', pri:2, need:function(S){return !!S.flags.fired;},
   n:'回 头 账',
   text:'被裁那阵子你以为自己完了。后来才知道，那是这辈子里少有的、可以重新选一次的窗口。',
   t:'第七年，旧厂的老同事找上门，说新东家缺个懂行的，问你要不要回去。你想起当年那张写着你名字的名单被挪到最后一栏，最后只说了一句：我考虑两天。',
   fx:{lamps:{'路':1},attrs:{arc:1,vit:-1}}},
  {id:'cb_ill', pri:2, need:function(S){return !!S.flags.sick;},
   n:'回 头 账',
   text:'那场病之后，你才第一次认真想"还能活多久"这件事。',
   t:'第七年，体检单上又出现一行让你停顿的字。你去复查，等结果的那两个小时，你把这几十年从头到尾过了一遍——发现真正记住的没几件事。',
   fx:{lamps:{'念':1},attrs:{vit:-1,men:1}}},
  {id:'cb_home', pri:2, need:function(S){return !!S.flags.back_home;},
   n:'回 头 账',
   text:'你回过一次老家。那次之后你总觉得自己还会再回去，可你没有。',
   t:'第七年，老屋那条巷子要拆了。你赶回去，在门口站了很久，最后只从墙上揭下半张旧年画。你把它卷起来带回城里，夹在一本书里。',
   fx:{lamps:{'守':1},attrs:{men:1}}},
  {id:'cb_south', pri:2, need:function(S){return !!S.flags.south;},
   n:'回 头 账',
   text:'你往南走过。走得越远，越发现有些东西是带不走的。',
   t:'第七年，南边那间租屋的房东托人捎话，说房子要卖了，问你还回不回去看一眼。你算了算路费，最后没去，只让人把你留下的那口箱子寄了过来。',
   fx:{lamps:{'远':1},attrs:{soc:-1,arc:1}}},
  {id:'cb_job', pri:2, need:function(S){return !!S.flags.quit_job;},
   n:'回 头 账',
   text:'辞掉的那份工，你后来想过很多次：如果当时忍一忍，会不会不一样。',
   t:'第七年，你在街上碰到当年替你办离职的那位。他说现在那边换了人，问你要不要回去。你说不用了——说完你自己也愣了一下，原来这句话你早就想好了。',
   fx:{lamps:{'追':1},attrs:{coin:-1,men:1}}},
  {id:'cb_tech', pri:2, need:function(S){return !!S.flags.tech;},
   n:'回 头 账',
   text:'你学的那门手艺，最初只是为了有口饭吃。',
   t:'第七年，有人出高价请你去做一件"不一定成"的活，条件是把你以前的路全放下。你把手上的活赶完，才回他：那就试试。',
   fx:{lamps:{'传':1},attrs:{arc:1,coin:-1}}},
  {id:'cb_married', pri:2, need:function(S){return !!S.flags.married;},
   n:'回 头 账',
   text:'成家那天你以为日子从此有了锚。后来才知道，锚也会被浪扯着走。',
   t:'第七年，家里为一件小事吵了很久。夜里你起来喝水，看见桌上留着一碗给你温着的饭，忽然就不想争了。你把碗端起来，站着吃完了。',
   fx:{lamps:{'暖':1},attrs:{soc:1,men:1}}}
];
function callbackFor(){
  if(!S.flags)return null;
  var cands=CALLBACKS.filter(function(c){try{return c.need(S);}catch(e){return false;}});
  if(!cands.length)return null;
  cands.sort(function(a,b){return a.pri-b.pri;});
  return cands[0];
}

/* ---------- v2.5 玩法层④：灯的对立（选择第一次有了真正的"舍"） ----------
   18 盏灯按序号跨线通用，所以对立对按序号声明即可，五条线自动共用同一套语义。
   规则：一对里只要有一盏点到了二档，另一盏就**封顶在一档**——不是掉级，是点不上去。
   硬约束：对立对必须跨"结局桶"（BUCKETS）。同桶互斥会把某条结局线的等级和压死，
   让那个结局变成打不出来的死结局——所以每对都跨桶，且不改任何阈值。
   为什么需要它：没有对立时，点着【远】不妨碍点着【孝】，中段十个抉择的信息量很低
   （反正每个选项都能点一盏灯）。有了舍，才谈得上"这一生你选了哪一边"。 */
var LAMP_FOES=[
  [6,2],    /* 路 ↔ 守：走出去的人，守不住那间屋 */
  [8,3],    /* 远 ↔ 孝：离得越远，尽孝越难 */
  [9,14]    /* 滚 ↔ 诚：活得滚烫的人，往往不肯说实话 */
];
function lampPairIdx(ix){
  for(var i=0;i<LAMP_FOES.length;i++){
    if(LAMP_FOES[i][0]===ix)return LAMP_FOES[i][1];
    if(LAMP_FOES[i][1]===ix)return LAMP_FOES[i][0];
  }
  return -1;
}
/* 某一刻起，哪些灯被压住了（用于侧栏显示与提示） */
function lampCaps(){
  var out=[];
  (W&&W.lamps?W.lamps:[]).forEach(function(k,ix){
    var foe=lampPairIdx(ix);
    if(foe<0)return;
    var fk=W.lamps[foe];
    if(fk&&(S.lamps[fk]||0)>=2)out.push({k:k,ix:ix,by:fk});
  });
  return out;
}
function lampCapped(k){
  var c=lampCaps();
  for(var i=0;i<c.length;i++)if(c[i].k===k)return c[i];
  return null;
}

var ACHS=[
  {id:'first',n:'初灯',d:'点亮你人生中的第一盏灯'},
  {id:'goodbye',n:'不欠告别',d:'陪父亲走完最后一程，且一生未点亮【欠】'},
  {id:'comeback',n:'逆风翻盘',d:'被裁之后，才学反而涨到 7 以上'},
  {id:'south',n:'一路向南',d:'【路】累计点亮 3 次'},
  {id:'shoulder',n:'踩着肩膀的人',d:'【踮】累计点亮 2 次'},
  {id:'remember',n:'还有人记得你',d:'【桥】累计点亮 2 次'},
  {id:'twelve',n:'万灯皆明',d:'一局之中点亮 12 盏以上的灯'},
  {id:'tough',n:'九死未悔',d:'韧度达到 3（三次灯灭而不弃）'},
  {id:'gold',n:'金灯无芯',d:'走到《金灯无芯》结局'},
  {id:'clear',n:'与世界两清',d:'【归】满级且【欠】为 0'},
  {id:'full',n:'灯谱大成',d:'图鉴集齐全部 18 盏灯'},
  {id:'samsara',n:'轮回者',d:'累计通关 3 次'},
  {id:'beacon18',n:'一灯到底',d:'对全部 18 盏灯都立过道标、并且都点着了'}
];
function grant(id){
  if(META.ach[id])return;
  META.ach[id]=1;saveMeta();
  var a=ACHS.filter(function(x){return x.id===id})[0];
  if(a)toast('成就达成 · '+a.n);
}
function toast(t){
  var d=document.createElement('div');d.className='toast';d.textContent=t;
  document.body.appendChild(d);setTimeout(function(){d.remove()},2600);
}

/* ---------- 当前局自动存档（关掉页面也不丢这一生） ---------- */
var SAVE_KEY='renshzh_v2_save';
function saveGame(){
  try{
    if(!S)return;
    if(S.phase!=='end')localStorage.setItem(SAVE_KEY,JSON.stringify({v:2,wl:S.wl,S:S}));
    else localStorage.removeItem(SAVE_KEY);
  }catch(e){}
}
function loadGame(){
  try{var d=JSON.parse(localStorage.getItem(SAVE_KEY));if(!d||!d.S||!WORLDLINES[d.wl])return null;return d;}catch(e){return null}
}
function dropSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function resume(){
  var d=loadGame();if(!d)return;
  W=WORLDLINES[d.wl];S=d.S;
  S.pending=S.pending||[];S.lit=S.lit||{};S.seen=S.seen||{};S.peeked=S.peeked||{};
  render();
}

/* ---------- 点灯即时反馈：右上角浮出「灯 · 念 +」 ---------- */
function flashLamps(list){
  try{
    if(!document.body)return;
    var box=document.getElementById('lampFlash');
    if(!box){box=document.createElement('div');box.id='lampFlash';box.className='lampflash';document.body.appendChild(box);}
    list.forEach(function(txt,i){
      var s=document.createElement('span');s.className='lf';s.textContent='灯 · '+txt;
      box.appendChild(s);
      setTimeout(function(){try{s.remove()}catch(e){}},1400+i*130);
    });
  }catch(e){}
}

function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
/* 模型返回的文本一律转义后再进 DOM（可换行） */
function escML(s){return esc(s).replace(/\n+/g,'<br>')}

 {id:'o17',n:'一场夜雨',when:function(s){return s.age>=18},text:'你加完班出来，撞上一场大雨，躲进路边的小卖部。',
  out:[{t:'老板给你倒了杯热水，你坐到雨停。走出去的时候，你觉得身上轻了点。',fx:{attrs:{men:2}}}]},
 {id:'o18',n:'老家来人',when:function(s){return s.age>=28},text:'一个远房亲戚找到你，说你母亲坟头的草高了。',
  out:[{c:function(s){return s.attrs.coin>=3},t:'你连夜赶回去，把坟修了，又住了一个月。',fx:{attrs:{coin:-1},lamps:{念:1}}},
       {t:'你说等这阵忙完。亲戚点点头走了。你后来一直没回去。',fx:{lamps:{欠:1},attrs:{men:-1}}}]},
 {id:'o19',n:'厂房失火',when:function(s){return s.age>=25},text:'半夜厂区起了火，警报把你从床上叫起来。',
  out:[{c:function(s){return s.attrs.vit>=6},t:'你冲进去抢出了两箱账本，眉毛烧掉一半。厂长后来记了你一辈子。',fx:{attrs:{vit:-1},lamps:{守:1}}},
       {t:'你站在警戒线外看着，火映在脸上。有些东西，你来不及拿。',fx:{lamps:{藏:1}}}]},
 {id:'o20',n:'一句遗言',when:function(s){return s.age>=40},text:'有人转交给你一句旧人临终前的话。',
  out:[{t:'那句话很短，你听懂了。你把家里那盏灯调亮了一档。',fx:{lamps:{暖:1},attrs:{men:1}}}]}
],
chapters:[
 {variants:2,t:'第一章 · 巷子与水井',age:6,
  body:function(s){if(s.v===1)return['你记得家里有一台缝纫机，黑漆掉了好几块，母亲踩起来咯噔咯噔。她夜里替人做衣裳，一件挣两块钱，线头要用牙咬断。','那年粮站门口排长队。祖母让你端着一只搪瓷缸站着，缸里是刚打回来的酱油，晃出来一道，凉在手背上。你不敢动，怕洒了。','母亲说要去南边打工的那晚，她在缝纫机前坐了很久，把你的名字绣在衣领里侧，一针一针，说明年就回来。','第二天她走的时候你还没醒。后来你翻衣领，摸到那两个字，硬邦邦的，像缝进去了一块小石子。你穿着那件衣服过了一整个冬天。'];if(s.v===1)return['你记得家里有一台缝纫机，黑漆掉了好几块，母亲踩起来咯噔咯噔。她夜里替人做衣裳，一件挣两块钱，线头要用牙咬断。','那年粮站门口排长队。祖母让你端着一只搪瓷缸站着，缸里是刚打回来的酱油，晃出来一道，凉在手背上。你不敢动，怕洒了。','母亲说要去南边打工的那晚，她在缝纫机前坐了很久，把你的名字绣在衣领里侧，一针一针，说明年就回来。','第二天她走的时候你还没醒。后来你翻衣领，摸到那两个字，硬邦邦的，像缝进去了一块小石子。你穿着那件衣服过了一整个冬天。'];return ['你的童年，是一整条巷子。',
   '巷口有一口老井，井沿被磨得锃亮。祖母在井边洗衣裳，你在她脚边玩水，水花溅起来落在青石板上，像一群散开的星。她说井里的水照人一生，日头一照，什么都在里头。',
   '父亲在厂里上夜班，你一个月见不到他几回。有一回他难得早归，给你带回一只纸折的青蛙。你不会折，他也不会教，父子俩对着那只青蛙，沉默了一下午。后来青蛙被水浸坏了，你没舍得扔。',
   '然后某天，母亲说要去南边打工。',
   '那是你人生里第一场真正的雪。',
   '祖母在井边替你擦脸：别哭，大人是去挣钱的。井水不会枯，你妈会回来。'];},
  choices:[
   {k:'A',t:'追出去，拉住她的衣角',
    body:['你母亲蹲下来，眼睛红了，说乖，妈很快回来。你在巷口站着，看她走上桥，看她的背影越来越小，直到融进雪里。'],
    fx:{lamps:{念:1},attrs:{men:-1},flags:{chased:1}},hint:'念↑｜心力↓'},
   {k:'B',t:'懂事地挥手，说“妈你放心，我照顾奶奶”',
    body:['你母亲没敢回头。她怕一回头就走不成。那天中午，你独自把井边的一盆衣裳洗了。祖母看见了，没说话，转身进了屋，门帘晃了好一阵。'],
    fx:{lamps:{担:1},attrs:{men:1,vit:-1}},hint:'担↑｜心力↑ 体魄↓'},
   {k:'C',t:'低着头，没哭，也没送',
    body:['你躲进屋里，假装在写作业，其实一个字都没写。那个下午，比一整年都长。'],
    fx:{lamps:{藏:1},attrs:{men:1}},hint:'藏↑｜心力↑'}
  ]},
 {t:'第二章 · 桥下的灯',age:15,variants:2,
  body:function(s){
   if(s.v===1)return[
    '母亲那年没回来。汇款单是托同村的人捎来的，边角被雨沤烂了，数字晕成一团，你祖母对着灯看了半宿，最后按那团墨的轮廓猜出个数。',
    '祖母摔了一跤，在床上躺了四十天。你每天放学先烧水、熬药、把她的腿搬起来换药布。屋里常年一股药味，混着煤球味，你到现在都记得那个味道。',
    '夜里你趴在饭桌上写作业，写到眼睛发涩，抬头能看见窗外的石桥。桥头那盏路灯还是坏的，黑着，谁也没修。',
    '那年冬天你把奖学金单子拿回家，直接塞到祖母枕头底下。她摸着单子上的名字，说：比你爸的字好看。'];
   return[
    '母亲每年回来一次。回来时你的尺寸就大半号，她走时你又瘦回去一些。',
    '祖母的背越来越弯。她教你认字，用井水在青石板上写“人”字：人字两笔，一笔靠你自己，一笔靠别人帮扶。写好了，才立得住。',
    '厂子改制那几年，父亲买断工龄回了家。他不再上夜班，天天坐在门口发呆。有一回你放学回来，看见他在井边，把一支烟点燃、掐灭、再点燃，反反复复。你没敢过去。他抬头看见你，把烟在鞋底按灭，说，回来啦。',
    '去中学要过一座石桥。桥下常年拴着一只旧船，铁环锈得不成样子。桥头路灯坏了大半年，没人修。',
    '那年冬天你把奖学金单子拿回家。父亲看了很久，最后只说：要好好念啊。他把单子折好，塞进贴身口袋。'];
  },
  choices:[
   {k:'A',t:function(s){return s.v===1?'把单子拍在桌上，说你考得上，学费你自己想办法':'“爸，我不念了，我去挣钱”'},
    body:['你父亲摔了手里的碗。碗碎了一地，他红着眼睛吼：谁让你不念的？吼完他又坐下来，像一只泄了气的旧轮胎，说，是爹没本事。'],
    fx:{lamps:{担:1},attrs:{coin:1,arc:-1,men:1},flags:{quit_school:1}},hint:'担↑｜积蓄↑ 才学↓｜锁死：高考线关闭'},
   {k:'B',t:'报考免费的师范 / 技校',
    body:['父亲沉默了很久，说，好，咱家能出人就好。后来你在技校里，每天把手上的茧磨厚一层，见了所有能见的光。'],
    fx:{lamps:{路:1},attrs:{arc:1},flags:{tech:1}},hint:'路↑｜才学↑'},
   {k:'C',t:'赌气说“我要考最好的高中，考不上就不回来了”',
    body:['父亲没说话。半夜你醒来，听见他压着嗓子跟母亲说：把咱家那间老宅抵了吧，孩子有出息是大事。'],
    fx:{lamps:{踮:1},attrs:{arc:1,coin:-1,men:-1}},hint:'踮↑｜才学↑ 积蓄↓ 心力↓'}
  ]},
 {variants:2,t:'第三章 · 十七岁的信',age:17,
  body:function(s){if(s.v===1)return['那年班里传着一台复读机，磁带盒上各人自己贴标签。有人塞给你一盘，没有名字，A 面是英语课文，B 面最后多出十几秒，是{ta}在笑。','你借了耳机，躲在教学楼后墙根，把那十几秒倒回去听了一下午，听到电池发烫。磁带盒里还塞着一张对折的纸条，写着：你要是听见了，就来操场。','你去了操场，在旗杆底下站到下课铃响。那一节{ta}没来，说是家里在办转学的手续，办完就走。','磁带盒你夹进了《现代汉语词典》里，压得平平的。后来词典借给了同学，还回来的时候，那半张标签还在。'];if(s.v===1)return['那年班里传着一台复读机，磁带盒上各人自己贴标签。有人塞给你一盘，没有名字，A 面是英语课文，B 面最后多出十几秒，是{ta}在笑。','你借了耳机，躲在教学楼后墙根，把那十几秒倒回去听了一下午，听到电池发烫。磁带盒里还塞着一张对折的纸条，写着：你要是听见了，就来操场。','你去了操场，在旗杆底下站到下课铃响。那一节{ta}没来，说是家里在办转学的手续，办完就走。','磁带盒你夹进了《现代汉语词典》里，压得平平的。后来词典借给了同学，还回来的时候，那半张标签还在。'];return ['十七岁那年，你的课桌腿下多了一封信。',
   '那个总在课间回头看你的人转学了，走前把它压在课桌下面。你发现它时，人已经走了三天。信很短，字很好看，写着：你总发呆看窗外，到底在看什么？',
   '你没有回信的地址。那封信，你夹进了一本叫《边城》的书里。'];},
  choices:[
   {k:'A',t:function(s){return s.v===1?'没回，把磁带盒夹进词典里':'没回，长久地夹在书页里'},
    body:['后来你搬家，书卖给了收废品的。你站在巷口，看着载着书的三轮车拐过街角。有什么东西跟着那车一起走了，你没去追。'],
    fx:{lamps:{念:1},attrs:{men:-1}},hint:'念↑｜心力↓'},
   {k:'B',t:'追去{ta}的新学校',
    body:['你跑了一下午，找到那所学校，站在门口，人山人海里没有{ta}。你在路灯下站到天黑。后来你们再没见面，但那份“跑过去过”的勇气，陪了你很多年。'],
    fx:{lamps:{滚:1},attrs:{vit:1,soc:1}},hint:'滚↑｜体魄↑ 人情↑'},
   {k:'C',t:function(s){return s.v===1?'录满一盘，寄到{ta}新学校，退了回来':'回了一封，寄到学校，被退了回来'},
    body:['信退回那天，你把它压在枕头下，让那股墨香陪你睡了很多年。'],
    fx:{lamps:{痴:1},attrs:{arc:1}},hint:'痴↑｜才学↑'}
  ]},
 {variants:2,t:'第四章 · 绿皮火车',age:18,
  body:function(s){if(s.flags.quit_school)return['你终究是没走进那间考场。','同班的黑板上写着倒计时，你背着蛇皮袋从校门口路过，没敢抬头。','父亲送你到车站，塞给你两百块，说，实在不行就回来。'];
    if(s.v===1)return['那年夏天，县城东头的绿皮车站一天只停四趟车。站台上有人蹲着抽烟，脚边堆着蛇皮袋和塑料桶，谁都不怎么说话。','你去送人。同班的两个，一个去省城念书，行李是一只帆布包；一个跟表哥南下，肩上扛着被卷。上车前他们都回头看了一眼，谁也没挥手。','回城的班车没了，你顺着铁轨往北走。日头把钢轨晒得发烫，你一格一格踩着枕木，数到三百多就懒得再数。','回到家，你把课本和旧书包收进立柜，柜门合上时木头叫了一声。祖母在灶间问，饿不饿。你说不饿。'];
    if(s.v===1)return['那年夏天，县城东头的绿皮车站一天只停四趟车。站台上有人蹲着抽烟，脚边堆着蛇皮袋和塑料桶，谁都不怎么说话。','你去送人。同班的两个，一个去省城念书，行李是一只帆布包；一个跟表哥南下，肩上扛着被卷。上车前他们都回头看了一眼，谁也没挥手。','回城的班车没了，你顺着铁轨往北走。日头把钢轨晒得发烫，你一格一格踩着枕木，数到三百多就懒得再数。','回到家，你把课本和旧书包收进立柜，柜门合上时木头叫了一声。祖母在灶间问，饿不饿。你说不饿。'];return['高考那年夏天，天极热。','你坐在闷热的考场里，笔尖沙沙地响，像那年井边祖母搓洗衣裳的声音。考完最后一科你走出校门，看见父亲站在树荫下，攥着一瓶汽水，看见你就赶紧递过来：解解暑。','他没有问考得怎么样。他只说，走，回家吃饭。','后来成绩出来了。分数线差了两分。','那一晚父亲抽了很多烟。他走进你房间说：复读，爹供你，咱家砸锅卖铁也供你。'];
  },
  choices:[
   {k:'A',t:'复读一年',cond:function(s){return !s.flags.quit_school},lock:'你早就不在学校了，这条路已经关上',
    body:['你把自己关进没日没夜的题海里。第二年你考上了。放榜那天，父亲把录取通知书翻来覆去看，看得眼睛都湿了，嘴上却说这有啥好看的。'],
    fx:{lamps:{踮:1},attrs:{arc:2,men:-1,coin:-1},years:1},hint:'踮↑｜才学↑↑ 心力↓ 积蓄↓｜耗 1 年'},
   {k:'B',t:'“爸，我走技术路线，早点挣钱”',cond:function(s){return !s.flags.quit_school},lock:'你早就不在学校了，这条路已经关上',
    body:['你背起蛇皮袋，坐上南下的绿皮火车。靠窗的位置，对座大叔吃泡面的味道你记了很多年。窗外是倒退的麦田、丘陵、陌生的城市。车轮压过铁轨接缝，一下，一下。这条路，是你自己踩上去的。'],
    fx:{lamps:{路:1},attrs:{coin:1,arc:1},flags:{south:1}},hint:'路↑｜积蓄↑ 才学↑'},
   {k:'C',t:'去一所学费便宜的外省学校',cond:function(s){return !s.flags.quit_school},lock:'你早就不在学校了，这条路已经关上',
    body:['你挑挑拣拣，最后上了车。车开动那一刻你回头，看见父亲站在月台上，越来越小，像井边一枚晒干了的核桃。你攥紧车票，告诉自己一定要活出个人样。'],
    fx:{lamps:{远:1},attrs:{arc:1,soc:1,coin:-1}},hint:'远↑｜才学↑ 人情↑ 积蓄↓'},
   {k:'A',t:'南下，进厂',cond:function(s){return !!s.flags.quit_school},lock:'你还在念书',
    body:['你跟着同乡上了南下的火车。流水线的声音比学校的下课铃还规律。第一个月你寄回去三百块，附了一张纸条：我挺好的。'],
    fx:{lamps:{路:1},attrs:{coin:1,vit:-1},flags:{south:1}},hint:'路↑｜积蓄↑ 体魄↓'},
   {k:'B',t:'留在县城，跟人学手艺',cond:function(s){return !!s.flags.quit_school},lock:'你还在念书',
    body:['你拜了巷尾的老陈做师傅，学修表。老陈脾气坏，手却稳。三年后你能在米粒大的齿轮上落针。'],
    fx:{lamps:{担:1},attrs:{arc:2}},hint:'担↑｜才学↑↑'},
   {k:'C',t:'白天干活，晚上自考',cond:function(s){return !!s.flags.quit_school},lock:'你还在念书',
    body:['你在工地搬砖，晚上在工棚的灯下看书。蚊子围着灯泡撞，你一手拍蚊子一手翻书。六年后你拿到了那张纸，没人知道它有多重。'],
    fx:{lamps:{踮:1},attrs:{arc:2,vit:-1,men:1},years:1},hint:'踮↑｜才学↑↑ 体魄↓ 心力↑｜耗 1 年'}
  ]},
 {t:'第五章 · 出租屋与第一份工钱',age:22,variants:2,
  body:function(s){
   if(s.v===1)return[
    '第一份工作是在五金厂做质检。车间里永远有股机油味，你戴着手套摸零件的边，一天要摸两千个。',
    '八个人一间宿舍，上下铺，有人打呼，有人半夜听收音机。你把存折压在枕头套里，缝了一道线。',
    '发第一个月工资那天，同宿舍的人拉你去打牌。你去了，输掉半个月的工钱，回来的路上把剩下的钱数了三遍。',
    '你给家里打电话，说我在这儿挺好的，吃得胖。挂了电话，你在马路牙子上坐到路灯灭。'];
   return['大城市不相信眼泪，也不相信毕业证。',
    '你租了城中村一个单间，墙皮斑驳，一张床、一张桌、一扇朝北的窗。窗外那盏路灯每晚准时亮，像是城里唯一愿意陪你的东西。',
    '第一份工作，你站流水线、跑业务、敲代码，一天十二个小时。第一个月工资到账那天，你站在 ATM 前看着那一串数字，第一次觉得自己是个大人了。',
    '你给家里打视频，祖母在画面那头笑：我娃瘦了。你说，没有，胖了。父亲在旁边插了一句：钱自己留着花，别饿着。'];
  },
  choices:[
   {k:'A',t:'分一半寄回家',
    body:['母亲在电话里骂你乱花钱，骂到一半，声音哑了。父亲难得说了句：好孩子。就是这四个字，让你在地铁上把脸转向车窗，很久没转回来。'],
    fx:{lamps:{担:1},attrs:{coin:-1,men:1}},hint:'担↑｜积蓄↓ 心力↑'},
   {k:'B',t:'全留给自己，报夜校 / 买台二手电脑',

   {k:'C',t:'请舍友 / 同事吃了顿饭',

 {variants:2,t:'第六章 · 那支没点着的烟',age:28,
  body:function(s){if(s.v===1)return['父亲第一次来城里看你，是坐了一夜硬座来的。他手里提着一个编织袋，说没什么，就是你妈腌的菜。','你带他去吃面，他嫌贵，最后把碗底的汤都喝净了。地铁里他抓着扶手站得笔直，眼睛盯着线路图上闪过去的灯。','晚上他在你出租屋的床沿坐着，摸出烟盒，抽一支出来在指间转了半宿没点，因为房东在门上贴了纸条，说不许抽烟。第二天一早他就走了，说家里还有事。','被子掀开的地方压着一个信封，里面是两千块钱，票子一张张压得很平。信封里还有一张对折的单子，是县医院的检查报告，日期是上个月。'];
    if(s.v===1)return['父亲第一次来城里看你，是坐了一夜硬座来的。他手里提着一个编织袋，说没什么，就是你妈腌的菜。','你带他去吃面，他嫌贵，最后把碗底的汤都喝净了。地铁里他抓着扶手站得笔直，眼睛盯着线路图上闪过去的灯。','晚上他在你出租屋的床沿坐着，摸出烟盒，抽一支出来在指间转了半宿没点，因为房东在门上贴了纸条，说不许抽烟。第二天一早他就走了，说家里还有事。','被子掀开的地方压着一个信封，里面是两千块钱，票子一张张压得很平。信封里还有一张对折的单子，是县医院的检查报告，日期是上个月。'];return['你恋爱了。{ta}在同城另一家公司上班，笑起来眼睛弯弯的。你们走过这座城市的大街小巷，你把工资的一小半花在带{ta}吃好吃的上面。你觉得人生开始有了光的形状。',
   '后来父亲病了。你回去，看见病床上的他瘦了一大圈，还笑着说小毛病，别担心。',
   '你请假照顾了几天。临走那晚，父亲支开母亲，从枕头下摸出一样东西——你小时候那只纸青蛙旁边，另一样他珍藏的：一张泛黄的照片。年轻的他在厂门口，意气风发，身后是雪。',
   '他说：你爹我这辈子没给你挣下什么，就这一身硬骨头和这颗要强的性子，你拿去吧。'];
  },
  choices:[
   {k:'A',t:'先留下来，把工作安顿好再回',

   {k:'B',t:'赶回去上班，承诺“忙完这阵就回”',

 {variants:2,t:'第七章 · 灵前的灯',age:29,
  body:function(s){if(s.flags.no_goodbye)return['父亲走的那年冬天，小城又下了一场大雪，像极了你出生那年。','你跪在灵前，一晚上没合眼。你想得最多的不是他在井边掐灭的那支烟，而是你最后一次见他时，他说“回来啦”，你说“哎”，然后你就走了。','你连他最后想说什么都不知道。','灯是你亲手点的，油尽了，火才灭。'];
    if(s.v===1)return['灵堂设在老屋堂屋，门板卸下来搭在两条长凳上。八仙桌上一盏油灯，风从门缝里进来，火苗就歪一下。','来的人不少，巷子里的几乎都来了：粮站的老张、厂里退了休的师傅、跟父亲搭过班的两个人。有人拍你的肩，说节哀，说完自己转过身去点烟。','办席那天你站在灶前替祖母尝咸淡。大师傅说缺两瓶酱油，你骑车去粮站边上的小卖部，来回一趟，雪在车辙里积了一层。','回来时天已经黑了，堂屋里那盏灯还亮着，火苗压得很低。你把酱油递给大师傅，转身进去，拿油壶给灯添了一次油。'];
    if(s.v===1)return['灵堂设在老屋堂屋，门板卸下来搭在两条长凳上。八仙桌上一盏油灯，风从门缝里进来，火苗就歪一下。','来的人不少，巷子里的几乎都来了：粮站的老张、厂里退了休的师傅、跟父亲搭过班的两个人。有人拍你的肩，说节哀，说完自己转过身去点烟。','办席那天你站在灶前替祖母尝咸淡。大师傅说缺两瓶酱油，你骑车去粮站边上的小卖部，来回一趟，雪在车辙里积了一层。','回来时天已经黑了，堂屋里那盏灯还亮着，火苗压得很低。你把酱油递给大师傅，转身进去，拿油壶给灯添了一次油。'];return['父亲走的那年冬天，小城又下了一场大雪，像极了你出生那年。','你跪在灵前，一晚上没合眼。你想起他在井边反反复复掐灭的那支烟，想起他把奖学金单子塞进贴身口袋，想起他说人字两笔要立得住。','你到这时候才想通，他这辈子其实只教过你两件事：别怕；好好的。','那盏灯你守到了出殡，没让人熄。'];
  },
  choices:[
   {k:'A',t:'把那支没点过的烟，收进盒子里',
    body:function(s){return s.flags.no_goodbye?['很多年后你打开那个盒子，烟已经潮了。你对着它站了很久，想说爸我挺好的，最后只说了半句。']:['很多年后你打开那个盒子，烟已经潮了。你对着它说：爸，我挺好的。']},
    fx:function(s){return s.flags.no_goodbye?{lamps:{念:1,欠:1},attrs:{men:-1}}:{lamps:{念:1}}},
    hint:'念↑（若未告别：同时欠↑ 心力↓）'},
   {k:'B',t:'把他的照片，摆在新家最高的柜子上',
    body:['每天出门前看一眼。你笑着说，爸，我出门上班了，像他还在的时候。'],
    fx:{lamps:{传:1}},hint:'传↑'},
   {k:'C',t:'既不留烟，也不摆照片',
    body:['你把他记在心里，连同那晚的雪、井边的水、巷口的灯。有些人不需要遗物，因为他已经长成了你。'],
    fx:{lamps:{融:1}},hint:'融↑'}
  ]},
 {variants:2,t:'第八章 · 四十岁的风暴',age:40,
  body:function(s){if(s.v===1)return['四十岁那年春天，厂里开了大会。老板说要搬去内地，愿意跟的签新合同，不愿意的按工龄结钱走人。会议室里没人说话，只听见窗外的空调外机在响。','你算了三个晚上。跟过去是陌生的城市、陌生的宿舍；留下是四十岁重新找活。你那些工龄被算成一串数字写在纸上，不到你半年的房贷。','签完字那天中午，几个老同事在厂门口的小馆子吃了顿饭。菜上齐了没人动筷，话绕来绕去，绕到孩子上学、老人吃药上。','散场后你没坐车，走回去的。路过那家开了十年的早点铺，老板娘正在收摊。她抬头问你，明天还来吃吗。你说来。'];if(s.v===1)return['四十岁那年春天，厂里开了大会。老板说要搬去内地，愿意跟的签新合同，不愿意的按工龄结钱走人。会议室里没人说话，只听见窗外的空调外机在响。','你算了三个晚上。跟过去是陌生的城市、陌生的宿舍；留下是四十岁重新找活。你那些工龄被算成一串数字写在纸上，不到你半年的房贷。','签完字那天中午，几个老同事在厂门口的小馆子吃了顿饭。菜上齐了没人动筷，话绕来绕去，绕到孩子上学、老人吃药上。','散场后你没坐车，走回去的。路过那家开了十年的早点铺，老板娘正在收摊。她抬头问你，明天还来吃吗。你说来。'];return ['四十岁那年，你被裁了。',
   '你没哭也没闹。你在写字楼楼下站了一会儿，看着那栋待了十年的玻璃楼，然后转身走进地铁站。手机里，房贷的短信安静地躺着。',
   '你开始重新投简历。三十五岁是一堵墙，四十岁是另一堵更高的墙。你学会了一个新技能：在 HR 面前把“我快四十了”翻译成“我有二十年的经验”。',
   '{ta}说：要不，我们回老家吧。',
   '你站在窗边，看着城中村那盏陪了你很多年的路灯。它还在亮。'];},
  choices:[
   {k:'A',t:'留下，转型重来',cond:function(s){return s.attrs.arc>=5},lock:'才学不足 5：你的底子撑不起一次转身',
    body:['你报了班，从头学新东西，像二十岁那样重新当学生。无数次想放弃，无数次在深夜擦干眼泪继续。后来你在新赛道站稳了。孩子问你后悔吗，你说，不后悔，人输了牌可以重新洗。'],
    fx:{lamps:{路:1,踮:1},attrs:{arc:2,men:-1,coin:-1},flags:{fired:1}},hint:'路↑ 踮↑｜才学↑↑ 心力↓ 积蓄↓'},
   {k:'B',t:'带着全家回老家',cond:function(s){return s.lamps['念']>=1||s.flags.father_stay},lock:'你早已无根可回（念未亮、也没陪过父亲）',
    body:['那座小城，井还在，桥还在，巷子里的青石板还在。你接手了父亲留下的老屋，修了修住下来，每天沿桥散步，跟老邻居打招呼。你发现人一辈子走遍千山万水，最后想回的还是那口井边。'],
    fx:{lamps:{归:1},attrs:{men:2,coin:-1},flags:{fired:1,back_home:1}},hint:'归↑｜心力↑↑ 积蓄↓'},
   {k:'C',t:'既不甘心留下，也不舍得回去，两头飘着',
    body:['你开始接零散的活，今年这里明年那里。你常年在路上，看过很多个城市的深夜。你偶尔想起那句“好好念，别跟爹一样”，忽然发现你其实一直在追一个“好好的”的定义。'],
    fx:{lamps:{追:1,守:-1},attrs:{soc:-1,coin:1},flags:{fired:1}},hint:'追↑ 守↓｜人情↓ 积蓄↑｜韧度 +1'},
   {k:'D',t:'开始在意身体，少接一点活',
    body:['你把夜里那份活退了，改成早上绕桥走一圈。钱是少挣了，可你头一回觉得，天亮时候的风是有味道的。'],
    fx:{lamps:{暖:1},attrs:{vit:2,coin:-1}},years:2,hint:'暖↑｜体魄↑↑ 积蓄↓｜寿 +2'}
  ]},
 {variants:2,t:'第九章 · 凌晨三点的厨房',age:45,
  body:function(s){if(s.v===1)return['那年夏天城里停水，一天只供两个钟头。你们把闹钟定在半夜三点，锅、桶、洗衣盆在厨房里一字排开，像要过冬。','水龙头响起来的时候你已经醒了。她蹲在旁边守着，把盆往前挪了挪，怕水溅到地上。两个人在厨房里，谁也没说话，听水声一点一点把桶灌满。','桶满了，她把最后半盆水端去冲厕所，回来的时候顺手把你的拖鞋摆正了，鞋尖朝着床。这套房子你们住了七年，你从没注意过这个动作。','第二天你发现，那件旧外套上掉的两颗扣子被缝回去了，线是白的，跟衣服不是一个颜色。你穿着它过了整个秋天。'];if(s.v===1)return['那年夏天城里停水，一天只供两个钟头。你们把闹钟定在半夜三点，锅、桶、洗衣盆在厨房里一字排开，像要过冬。','水龙头响起来的时候你已经醒了。她蹲在旁边守着，把盆往前挪了挪，怕水溅到地上。两个人在厨房里，谁也没说话，听水声一点一点把桶灌满。','桶满了，她把最后半盆水端去冲厕所，回来的时候顺手把你的拖鞋摆正了，鞋尖朝着床。这套房子你们住了七年，你从没注意过这个动作。','第二天你发现，那件旧外套上掉的两颗扣子被缝回去了，线是白的，跟衣服不是一个颜色。你穿着它过了整个秋天。'];return ['孩子住校以后，家里安静得不像住着人。你们各自上班、各自吃饭、各自睡。',
   '话是从哪一年开始变少的，谁都说不清。不是吵，就是没什么可说的了。',
   '有一年冬天，你半夜起来喝水。厨房没开灯，只有窗外路灯斜进来，在碗柜上切出一道白边。',
   '你顺手下了两碗面。她其实也醒着，靠在床头，被子拉到下巴。你没问，把面搁在床头柜上。她没哭。她只是很慢很慢地吃完了，连汤都喝了，然后把空碗递回给你，说，明天我想回我妈那儿住几天。你说，哦。',
   '后来很多事你都记不清了，只记得第二天早上，她那半边被子叠得整整齐齐，像从来没睡过人。'];},
  choices:[
   {k:'A',t:'你主动修',cond:function(s){return s.attrs.men>=4},lock:'心力不足 4：你连自己都撑不住，顾不上别人',
    body:['你不再等她开口。她怕凉，你就把位置让到背风那头；她不爱吃姜，你挑出来，不说。你们没有重新约会，只是某晚她忽然说，你最近话多了。'],
    fx:{lamps:{暖:1},attrs:{soc:1,men:1}},hint:'暖↑｜人情↑ 心力↑'},
   {k:'B',t:'你开了口，坦诚这些年藏着的委屈',cond:function(s){return s.attrs.men>=5||s.lamps['诚']>=1},lock:'心力不足 5：这些话你还是说不出口',
    body:['你把这些年攒着的、连自己提起来都嫌丢人的话，一样一样倒出来：父亲走那天你没哭、失业那年你躲在楼梯间。她听完说，原来那阵子你那么难。这一句，你等了十几年。'],
    fx:{lamps:{诚:1},attrs:{men:1,soc:1}},hint:'诚↑｜心力↑ 人情↑'},
   {k:'C',t:'把面端到对方面前，然后还是没说出口',
    body:['碗递过去，话咽回去。你们又这样过了些年，同桌吃饭，各看各的碗。桌子不大，中间却空着一块，谁也够不着谁。'],
    fx:{lamps:{守:-1},attrs:{men:-1}},hint:'守↓（灯暗一档）｜心力↓'}
  ]},
 {variants:2,t:'第十章 · 母亲的背影',age:52,
  body:function(s){if(s.v===1)return['母亲走丢过一次。那天她出去买酱油，到天黑还没回来。你沿着巷子一家一家问，问到粮站门口，有人说看见一个老太太往桥那边去了。','你在桥头找到她。她抱着一只塑料袋坐在石墩上，袋子里是两瓶酱油、一包盐，还有一盒你小时候爱吃的话梅。她看见你，先笑了，说我找不着回家的路了。','回去的路上她一直牵着你的袖子，走得很慢。她说，你妈记性不好了，你别嫌。你说不嫌。巷子不长，你们走了很久。','那天晚上你把家里的电话号码写在一张纸上，缝进她那件外套的内袋，来回缝了两道，怕掉。'];if(s.v===1)return['母亲走丢过一次。那天她出去买酱油，到天黑还没回来。你沿着巷子一家一家问，问到粮站门口，有人说看见一个老太太往桥那边去了。','你在桥头找到她。她抱着一只塑料袋坐在石墩上，袋子里是两瓶酱油、一包盐，还有一盒你小时候爱吃的话梅。她看见你，先笑了，说我找不着回家的路了。','回去的路上她一直牵着你的袖子，走得很慢。她说，你妈记性不好了，你别嫌。你说不嫌。巷子不长，你们走了很久。','那天晚上你把家里的电话号码写在一张纸上，缝进她那件外套的内袋，来回缝了两道，怕掉。'];return ['母亲老了。她开始常常坐在井边——如今井早枯了，被盖上了石板——一坐就是一下午。',
   '她记性越来越差。有时突然问你：你是谁呀？你笑着答：我是你{子}啊，你连'+'{name}'+'都不认得了？她哦一声，过一会儿又问。',
   '她忘了很多人，却总记得出去给你买爱吃的菜，记得给她的娃留一盏灯。',

function queueLit(k,lv){

/* 时间线里"这一章点了哪些灯"：从 S.lit 的 k@lv@age 标记里反查（兼容旧的 k@lv 两段式） */
function lampsAtChapter(ch){
  if(!S||!S.lit)return [];
  var out=[];
  for(var tag in S.lit){
    var p=String(tag).split('@');
    var age=+p[2];
    if(!isFinite(age))continue;              /* 老存档的 k@lv 没有岁数，跳过不猜 */
    var cw=W&&W.chapters?W.chapters[ch-1]:null;
    if(cw&&age===cw.age&&out.indexOf(p[0])<0)out.push(p[0]);
  }
  return out;
}
function litBlock(){
  if(!S||!S.pending||!S.pending.length)return '';
  var w=W||{},h='';
  S.pending.forEach(function(tag){
    var p=tag.split('@'),k=p[0],lv=+p[1];
    var li=(w.lamps||[]).indexOf(k);
    var t=LAMP_TELL[li]&&LAMP_TELL[li][lv];
    if(!t)return;
    h+='<div class="epi lit"><div class="lb">灯 · '+k+'　'+CN_LV[lv]+'档</div>'+t+'</div>';
  });  S.pending=[];
  return h;
}
function deepLamps(){
  if(!S)return ''; var w=W||{},out=[];
  (w.lamps||[]).forEach(function(k,li){

}

lamps:['频','载','驻','燃','缺','嵌','轨','越','迁','冲','逐','链','隐','执','明','温','源','播'],
names:['林九','沈棂','周默','吴恙','陈屿','苏夜','何砚','姜迟','罗平','顾未'],
prologue:function(s){
  var g=s.gender==='女';
  return [
  '二一四九年冬，灰雪封城第三天。',
  '地下三层的产房其实是间改装过的配电机房。墙上有三道裂缝，拿胶布贴着，胶布也黄了。',
  '登记员左手抱着你，右手在终端上敲：性别、体重、出生时刻、父母节点号。敲完，屏幕弹出一行绿字——节点号已分配，有效期七十八年。',
  '你父亲站在门口，没有进来。他手里捏着一张信用票，跟工友借的，原打算塞给登记员道声辛苦。他没塞出去。登记员头也没抬：不用，签个字就行。',
  '他签了。手抖，不是因为冷。',
  '那张票子他后来一直留着，压在箱子底。你长大以后见过一次，问他这是什么。他说：一张废纸。',
  '你的节点从那一刻开始计时。',
  'p.ann||你的第一个抉择，其实早就替你做好了：你被登记了，你没办法不活。'
  ];
},
birthText:function(s){
  var g=s.gender==='女';
  return '你是'+s.name+'，生为'+(g?'女':'男')+'。'+
    '家境：'+s.family.n+'（'+s.family.d+'）。'+
    '先天：'+s.talent.n+'（'+s.talent.d+'）。';
},
events:[
 {id:'c23',n:'摸黑上楼',when:function(s){return s.age>=6&&s.age<=15},text:'配给站那栋楼跳了闸，灯全灭，楼道里只有人声。祖母在楼下等着，你一个人往七层走。',out:[{c:function(s){return s.attrs.vit>=4},t:'你两级一步往上跑，敲开了七层那扇门。会修东西的老周提着灯下来，把闸箱合上了。整栋楼亮起来的时候，你才发现自己一直在喘。',fx:{attrs:{vit:1},lamps:{冲:1}}},{c:function(s){return s.attrs.arc>=4},t:'你摸到闸箱边上，照着墙上那张接线图把烧断的一路甩开。灯亮的一瞬间，你的手还在抖。',fx:{attrs:{arc:1},lamps:{载:1}}},{t:'你在四层半停住了，蹲在墙角等电。后来是别人把你牵下去的。',fx:{attrs:{men:1},lamps:{隐:1}}}]},
 {id:'c24',n:'没有收件人的留言',when:function(s){return s.age>=8&&s.age<=20},text:'学塾的公用终端里躺着一段留言，收件方那一栏是空的，前面标着退回两个字。',out:[{c:function(s){return s.attrs.arc>=4},t:'你把那段留言读完了，照着落款摸出一个旧节点号，托登记处的老人转了出去。三天后那个号亮了一回。',fx:{attrs:{arc:1},lamps:{越:1}}},{c:function(s){return s.attrs.soc>=4},t:'你挨个问同层的人，问出那是谁写的。你把话带到，对面的人没吭声，只点了一下头。',fx:{attrs:{soc:1},lamps:{链:1}}},{t:'你看了两行就退了出去。后面的人推开你，接着用这台终端。',fx:{attrs:{men:-1},lamps:{缺:1}}}],choices:[{k:'A',t:"你把那段留言读完了，照着落款摸出一个旧节点号，托登记处的老人转了出去。三天后那个号亮了一回。",fx:{"lamps":{"越":1},"attrs":{"arc":1}}},{k:'B',t:"你挨个问同层的人，问出那是谁写的。你把话带到，对面的人没吭声，只点了一下头。",fx:{"lamps":{"链":1},"attrs":{"soc":1}}}]},
 {id:'c25',n:'楼下的配给',when:function(s){return s.age>=8&&s.age<=24},text:'楼下那户老人的义肢坏了，配给站的份额堆在巷口，没人给往上搬。',out:[{c:function(s){return s.attrs.vit>=5},t:'你一趟一趟扛上六层，最后一趟还替他把袋子拆开码好。他塞给你半块压缩粮，你不要，他硬塞。',fx:{attrs:{vit:1,soc:1},lamps:{载:1}}},{c:function(s){return s.attrs.soc>=4},t:'你叫上同层两个半大的孩子一起搬。搬完谁也没走，四个人坐在楼梯口把那半块压缩粮分了。',fx:{attrs:{soc:1},lamps:{链:1}}},{t:'你说自己赶时间，绕开了。第二天那些份额还在巷口堆着，被灰雪打湿了一半。',fx:{attrs:{soc:-1},lamps:{缺:1}}}],choices:[{k:'A',t:"你一趟一趟扛上六层，最后一趟还替他把袋子拆开码好。他塞给你半块压缩粮，你不要，他硬塞。",fx:{"lamps":{"载":1},"attrs":{"vit":1,"soc":1}}},{k:'B',t:"你叫上同层两个半大的孩子一起搬。搬完谁也没走，四个人坐在楼梯口把那半块压缩粮分了。",fx:{"lamps":{"链":1},"attrs":{"soc":1}}}]},
 {id:'c26',n:'接口排异',when:function(s){return s.age>=16&&s.age<=45},text:'你在旧区换上的那条义肢，第七天开始排异，接口一圈红肿，动一下像有细线在里面拉。',out:[{c:function(s){return s.attrs.coin>=4},t:'你划出信用点，去正式维护舱重做了一遍接合面。三天后能握拳了，握得比以前还紧。',fx:{attrs:{coin:-1,vit:1}}},{c:function(s){return s.attrs.men>=5},t:'你什么也没做。夜里疼得睡不着，你就坐在床沿数呼吸。半个月后它自己长住了。',fx:{attrs:{men:1,vit:-1},lamps:{执:1}}},{t:'你去了巷尾找老陈。他把接口拆下来重新打磨了一遍，说这条腿你还能用八年。',fx:{attrs:{arc:1},lamps:{载:1}}}]},
 {id:'c27',n:'闸机前的红字',when:function(s){return s.age>=20&&s.age<=55},text:'上城的闸机那天不认你的节点号，红字滚了三回，后面的人排成一队看着你。',out:[{c:function(s){return s.attrs.soc>=5},t:'你报了个号，闸口那头的值班人下来接你。你从那道门进去，没走闸机。',fx:{attrs:{soc:1},lamps:{越:1}}},{c:function(s){return s.attrs.men>=5},t:'你退到旁边，等所有人走完，再重新刷了一次。这一次过了。你什么也没说。',fx:{attrs:{men:1},lamps:{隐:1}}},{t:'你转身走了，绕到侧门跟着送料的车进去。那天的事你谁也没提。',fx:{attrs:{men:-1},lamps:{逐:1}}}]},
 {id:'c28',n:'封城七天',when:function(s){return s.age>=25&&s.age<=70},text:'灰雪封城，管廊口全落下闸板，配给减到三成。到第七天，同层的人开始互相敲墙。',out:[{c:function(s){return s.attrs.coin>=4},t:'你把存的那点份额分出去一半，换回来两节备用电芯和一句话：以后有事敲墙。',fx:{attrs:{coin:-1,soc:1},lamps:{燃:1}}},{c:function(s){return s.lamps['频']>=1||s.lamps['温']>=1},t:'你自己那一份没动，却把暖气开了一档，让过道那面墙一直是温的。有人靠着那面墙睡了一夜。',fx:{lamps:{温:1},attrs:{men:1}}},{t:'你七天没出舱。闸板抬起来那天，你才知道楼上少了一个人。',fx:{attrs:{vit:-1,men:-1},lamps:{缺:1}}}]},
 {id:'c29',n:'老周的注销仪式',when:function(s){return s.age>=32&&s.age<=72},text:'同线的老周走了。他家里人口少，注销仪式定在配给站后面那块空地上。',out:[{c:function(s){return s.attrs.men>=5},t:'你替他念了登记信息，念到在册年限那一栏的时候停了一下，接着往下念完了。',fx:{attrs:{men:1},lamps:{播:1}}},{c:function(s){return s.lamps['频']>=1},t:'你把他的节点号抄在手背上，回去照着那个号发了一段只有一句话的包，没有收件方。',fx:{lamps:{频:1},attrs:{men:1}}},{t:'你站在人堆后面，等散了场才过去。那块空地上什么标记也没留下。',fx:{lamps:{隐:1},attrs:{men:-1}}}]},
 {id:'c30',n:'第一块工牌',when:function(s){return s.age>=16&&s.age<=30},text:'第一块工牌发下来，薄薄一片铁，正面刻着编号，背面空着。',out:[{c:function(s){return s.attrs.coin>=4},t:'你花了半个月的信用点，请人在背面刻了一行小字：别停在闸口这边。',fx:{attrs:{coin:-1},lamps:{越:1}}},{c:function(s){return s.attrs.arc>=4},t:'你把编号背下来，照着它把整条线的排班规律摸了一遍。第二个月你被调去调度塔下层。',fx:{attrs:{arc:1},lamps:{轨:1}}},{t:'你把它挂在脖子上，一挂很多年，挂到铁片边缘磨得发亮。',fx:{lamps:{驻:1}}}]},

 {id:'c0a',n:'断电的那一夜',when:function(s){return s.age>=6&&s.age<=16},text:'整片下城跳了闸。楼道里全是人声，你摸黑往楼上跑。',
  out:[{c:function(s){return s.attrs.vit>=4},t:'你一口气跑到顶楼，把应急灯拧亮。整栋楼那点光，是你先点的。',fx:{attrs:{vit:1},lamps:{冲:1}}},
       {t:'你扶着扶手一级一级往上挪，数到第七层就停住了。电来了，你才继续走。',fx:{attrs:{men:1},lamps:{隐:1}}}]},
 {id:'c0b',n:'一段旧信号',when:function(s){return s.age>=6&&s.age<=16},text:'你在废料堆里捡到一个还能亮的手持终端，屏幕上一段没有结尾的留言在循环。',
  out:[{c:function(s){return s.attrs.arc>=4},t:'你把它拆开、清灰、接上旧电池，留言终于读完。最后一句是两个名字。',fx:{attrs:{arc:1},lamps:{逐:1}}},
       {t:'你看了一会儿就放下了。后来那东西被人收走，你连留言的开头都记不清了。',fx:{attrs:{men:1},lamps:{频:1}}}]},
 {id:'c1',n:'义体过载',when:function(s){return s.age>=16&&s.age<=45},text:'你那二手义肢在夜班里烧了。',
  out:[{c:function(s){return s.attrs.vit>=6},t:'你硬扛到交班，自己换了散热片。工友说，你这条命比铁还耐造。',fx:{attrs:{men:1}}},
       {t:'你昏在流水线上。维护费从信用点里扣，扣得你那个月吃了二十天合成糊。',fx:{attrs:{vit:-1,coin:-1}}}]},
 {id:'c2',n:'旧舱进水',when:function(s){return s.age>=18},
  out:[{c:function(s){return s.attrs.coin>=3},t:'你把信用点划回下城，托人焊了舱顶。母亲在通话里说，不漏了。',fx:{attrs:{coin:-1},lamps:{频:1}}},
       {t:'你只划得出一半。母亲说，不漏了。你后来调出她舱里的记录，整个冬天的水位都在红线上。',fx:{attrs:{men:-1},lamps:{缺:1}}}]},
 {id:'c3',n:'旧友借信用点',when:function(s){return s.age>=22},
  out:[{c:function(s){return s.attrs.soc>=4},t:'你借了。两年后他翻倍还你，还带来一单黑市委托。',fx:{attrs:{soc:1,coin:1},lamps:{链:1}}},
       {t:'你说最近也紧。对面沉默了一下，说没事。后来他的节点就再没亮过。',fx:{attrs:{soc:-1}}}]},
 {id:'c4',n:'一场神经热',when:function(s){return s.age>=18&&s.age<=55},
  out:[{c:function(s){return s.attrs.vit>=5},t:'烧到三十九度，睡了一天，出了身汗，好了。',fx:{attrs:{vit:1}}},
       {t:'烧了三天。你没报停线，怕扣信用点。病拖成了神经根的旧伤。',fx:{attrs:{vit:-1,men:-1}}}]},
 {id:'c5',n:'一段开源代码',when:function(s){return s.attrs.arc>=4&&s.age>=20},text:'有人在上层频段里念了你的节点号。',
  out:[{t:'你被拉进一个能学到东西的私仓。那一年你像块干海绵。',fx:{attrs:{arc:1}}}]},
 {id:'c6',n:'舱位涨价',when:function(s){return s.age>=22&&s.age<=45},
  out:[{c:function(s){return s.attrs.coin>=4},t:'涨就涨吧，你还住得起。窗外那盏旧指示灯还是每晚准时亮。',fx:{attrs:{coin:-1}}},
       {t:'你搬了。搬到更深的地下三层，窗外没有指示灯，只有一片黑。',fx:{attrs:{coin:-1,men:-1},lamps:{迁:1}}}]},
 {id:'c7',n:'母亲的通话',when:function(s){return s.age>=12},
  out:[{c:function(s){return s.flags.no_goodbye},t:'她问你吃了没。你说吃了。挂了通话你坐了很久，有些包这辈子都发不出去了。',fx:{attrs:{men:-1},lamps:{缺:1}}},
       {t:'她问你吃了没。你说吃了。其实那天你还没吃。',fx:{lamps:{频:1}}}]},
 {id:'c8',n:'同届聚会',when:function(s){return s.age>=32},
  out:[{c:function(s){return s.attrs.soc>=5},t:'去了。当年的人多半换了半身义体，话却比年轻时软。散场有人拍你肩膀：下回你组局。',fx:{attrs:{soc:1},lamps:{链:1}}},
       {t:'你没去。他们在公共频段发的合照里，你一眼找到了那个被系统自动补上的空位。',fx:{lamps:{隐:1}}}]},
 {id:'c9',n:'维护单',when:function(s){return s.age>=40},
  out:[{c:function(s){return s.attrs.coin>=4},t:'有个小结节。你花信用点做了一次深检，虚惊一场。维护师说，少接线。',fx:{attrs:{coin:-1}}},
       {t:'有个小结节。你说等忙完这阵。这一等，就是三年。',fx:{attrs:{vit:-1},flags:{sick:1}}}]},
 {id:'c10',n:'旧井停服',when:function(s){return s.age>=35},text:'旧城区底下那台母服务器，被盖上水泥，正式停服。',
  out:[{c:function(s){return s.lamps['频']>=1},t:'你回去看过一次。铁皮巷还在，井没了。你蹲下来摸那块水泥，像摸一个已经断线的老朋友。',fx:{lamps:{嵌:1}}},
       {t:'你是在公告栏上看到的。哦，停了啊。你说。',fx:{lamps:{隐:1}}}]},
 {id:'c11',n:'工友掉线',when:function(s){return s.age>=22},text:'一个跟你同线的工友，神经接驳时出了故障，人没了。',
  out:[{c:function(s){return s.attrs.men>=5},t:'你去参加了他的节点注销仪式。回来的路上你想，人这辈子到底在忙什么。你想了一路。',fx:{attrs:{men:1},lamps:{频:1}}},
       {t:'你没去。你只在他工位上站了一会儿，第二天照常上线。',fx:{lamps:{隐:1},attrs:{men:-1}}}]},
 {id:'c12',n:'一段废弃代码',when:function(s){return s.age>=20&&s.age<=45},text:'你在旧服务器里翻出一段没人维护的代码，写得很漂亮。',
  out:[{c:function(s){return s.attrs.arc>=5},t:'你花了三个月把它读懂，又重新写了一遍。这套东西后来成了你的饭碗。',fx:{attrs:{arc:2},lamps:{播:1}}},
       {t:'你看了两眼就划过去了。三年后有人在公开仓里发了同样的东西，署了别人的名字。',fx:{attrs:{men:-1}}}]},
 {id:'c13',n:'孩子的评级回执',when:function(s){return s.age>=32&&s.age<=52},text:'孩子的评级回执发到了舱里的终端上，排在后头。',
  out:[{c:function(s){return s.attrs.men>=4},t:'你没骂。你坐下来，一条一条帮他把没跑通的地方过了一遍。那天晚上他很晚才关灯。',fx:{lamps:{温:1},attrs:{men:1}}},
       {t:'你说了一句“怎么又这样”。话出口你就后悔了，可已经收不回来。',fx:{lamps:{缺:1},attrs:{men:-1}}}]},
 {id:'c14',n:'多扣的一笔信用点',when:function(s){return s.age>=22},text:'清算系统退回了一笔多扣的信用点。',
  out:[{c:function(s){return s.attrs.coin>=3},t:'你划出一半，请家里人吃了一顿现做的热菜。母亲一直说太浪费，吃到最后又添了一碗。',fx:{attrs:{coin:1},lamps:{嵌:1}}},
       {t:'你把它存进了备用账户。账户放得很深，你时不时点开看一眼。',fx:{attrs:{coin:2}}}]},
 {id:'c15',n:'旧区改造',when:function(s){return s.age>=35},text:'整片旧城区要拆，通知滚过每一块公共屏。',
  out:[{c:function(s){return s.attrs.coin>=5},t:'你凑齐信用点，在邻近区换了个小舱。搬走那天你回头看了一眼，铁皮巷口的钢板还在。',fx:{attrs:{coin:-2},lamps:{源:1}}},
       {t:'你的信用点没凑够。旧区推平那天你不在城里，是系统通知告诉你的。',fx:{lamps:{缺:1},attrs:{men:-1}}}]},
 {id:'c16',n:'后辈抢位',when:function(s){return s.age>=30},text:'一个你带过的年轻人，抢了你等了很久的调度位。',
  out:[{c:function(s){return s.attrs.men>=5},t:'你没争。你把他叫来，该交代的都交代了。他红着脸走了。',fx:{attrs:{men:1},lamps:{嵌:1}}},
       {t:'你跟他翻了脸，从此再没在同一频段说过话。',fx:{attrs:{soc:-1},lamps:{隐:1}}}]},
 {id:'c17',n:'一场酸雨',when:function(s){return s.age>=18},text:'你下夜班出来，撞上一场酸雨，躲进路边一座无人配给亭。',
  out:[{t:'亭子给你跳出一杯热饮，免费。你坐到雨停。走出去的时候，你觉得身上轻了点。',fx:{attrs:{men:2}}}]},
 {id:'c18',n:'故乡来人',when:function(s){return s.age>=28},text:'一个下城来的老乡找到你，说你母亲的碑该重刻了。',
  out:[{c:function(s){return s.attrs.coin>=3},t:'你连夜赶回去，把碑重刻了，又住了一个月。',fx:{attrs:{coin:-1},lamps:{频:1}}},
       {t:'你说等这阵忙完。老乡点点头走了。你后来一直没回去。',fx:{lamps:{缺:1},attrs:{men:-1}}}]},
 {id:'c19',n:'机房失火',when:function(s){return s.age>=25},text:'半夜机柜短路起火，警报把你从休眠里拽出来。',
  out:[{c:function(s){return s.attrs.vit>=6},t:'你冲进去拔了两组存储，手背烧伤。那批数据后来救了整个组。',fx:{attrs:{vit:-1},lamps:{驻:1}}},
       {t:'你站在警戒线外看着，火映在脸上。有些东西，你来不及拿。',fx:{lamps:{隐:1}}}]},
 {id:'c20',n:'一句遗言',when:function(s){return s.age>=40},text:'系统转交给你一段离线留言，来自一个已经注销的节点。',
  out:[{t:'那句话很短，你听懂了。你把舱里那盏指示灯调亮了一档。',fx:{lamps:{温:1},attrs:{men:1}}}]}
],
chapters:[
 {variants:2,t:'第一章 · 铁皮巷与旧井',age:6,
  body:function(s){if(s.v===1)return['那年入冬，调度塔把上环缺的常驻登记工名额摊到下城，抽签。母亲的名字排在名单最末一行。','她走的前一夜没收拾东西，只在井台边坐着，教你背她节点号的前四位。你背到第三遍她才点头。','清早一队人过闸。搬运车等在巷口，车斗里是统一的铁皮工袋，所有人的东西混在一处。她上车前回头看了你一眼，把后颈那块旧疤正对着你。那是小时候被蒸汽烫的，你摸过。','那天夜里你自己爬上井台，学着祖母的样子看水。水一直流，你一直看到睡着，是祖母把你背回去的。'];return ['你的童年，是一台不关机的旧机器。',
   '铁皮巷口那口井，其实是一台废弃母服务器的散热口。夏天往外吐热气，冬天往外渗冷凝水。下城唯一一处不用刷卡就有东西流出来的地方，所以大家都管它叫井。',
   '祖母在散热口边上洗衣裳。她不看你，看水。她说：机器不认人，水才认人。你看着水，水也看着你。',
   '父亲在上环的夜班线上，一个月见不到几回。有一回他难得早归，带回来一只折纸青蛙。是真的纸，下城稀缺物。你没见过纸，捧在手里捧了一下午，捧出了汗，纸就软了。你把它搁在通风口上晾，第二天被风卷走了。',
   '你没哭。你只是后来每次路过那个通风口，都要停一下。',
   '然后某天，母亲说要去上环打工。',
   '她走的时候，散热口还在往外渗水，滴在钢板上，一下，又一下。',
   '祖母替你擦脸：别哭，大人是去挣信用点的。机器不停，你妈会回来。'];},
  choices:[
   {k:'A',t:'追着搬运车跑到闸口，被安保拦下',
    body:['你跟着那辆搬运车跑过两条巷子，在闸口被安保的杆子拦下。你母亲从车厢里探出半个身子，朝你喊了句什么，被风盖住了。你站在原地，看她那个点被灰雪一点点吃掉。'],
    fx:{lamps:{频:1},attrs:{men:-1},flags:{chased:1}},hint:'频↑｜意志↓'},
   {k:'B',t:'把当月的配给券整叠塞进她包里',
    body:['你把攒了两个月的配给券整叠塞进她包里。你母亲背对着你，肩膀动了一下，没有转身。她走到巷口拐角才停了一秒，你数着的，就一秒。',
     '那天下午你把散热口边那盆衣裳洗了。水是冰的，你洗到手指发白。祖母搬了张矮凳坐在旁边看，一直看到你洗完，一个字没说。'],
    fx:{lamps:{载:1},attrs:{men:1,vit:-1}},hint:'载↑｜意志↑ 机体↓'},
   {k:'C',t:'没送，转身回屋，把话咽回去',
    body:['你回了屋。终端是亮的，课程界面停在第一页，你盯着那一页盯到天黑，一个字没进去。',
     '后来你记得那天的声音：散热口的滴水声，隔着铁皮，一下一下，数得清。'],
    fx:{lamps:{隐:1},attrs:{men:1}},hint:'隐↑｜意志↑'}
  ]},
 {variants:2,t:'第二章 · 天桥下的灯',age:15,
  body:function(s){if(s.v===1)return['母亲这一年没回来。上环的访客权限按季度批，排到你的时候名额刚好用完，通知只有一行冷字：顺延至下一期。','祖母的手开始抖，拿不稳笔。她改教你认钢板上刻的字：舱号、管压、检修日期，还有一行谁也不会去看的安全规程。她说，认得字，别人才骗不了你。','父亲那班夜线并成了远程调度，人不用到场，工位也就撤了。他白天蹲在配给站替人过磅，一袋合成粮提起来掂两下就报数，准得吓人。他不再跟你提从前的事。','那年冬天你带回家的不是一张纸，是一条回执：评级、可选学塾、扣减额度，全在同一屏上，划一下就没有了。父亲让你把那一屏念给他听，念了两遍。他说：往上城去，别停在闸口这边。'];return ['母亲一年只回一次，访客权限只批三天。她回来那几天总说你又长高了，走的时候又说你瘦了；下次再见，门框上那道刻痕已经矮了你一头。',
   '祖母的背越来越弯，走两步要扶一下管壁。她教你认字，用冷凝水在钢板上写“人”字：人字两笔，一笔靠你自己，一笔靠别人帮扶。水没干的时候，那两笔得立着。',
   '轨道厂换过两轮调度系统之后，父亲的工位撤了。他不再上夜班，白天坐在舱门口，看运货的磁轨一趟趟过去。有一回你放学回来，看见他在井台边，把一支合成烟点着、掐灭、再点着，反反复复。你没敢过去。他抬头看见你，把那半支合成烟塞回口袋，说，回来啦。',
   '去学塾要过一座天桥。桥下常年停着一艘报废的货运梭，拴索锈得不成样子。桥头那盏旧指示灯坏了大半年，没人修。',
   '那年冬天你把评级单拿回家。父亲对着那张纸看了很久，最后只说：往上城去，别停在闸口这边。他把纸折成四折，塞进贴身口袋，隔一阵就掏出来摸一摸。'];},
  choices:[
   {k:'A',t:'“爸，我不念了，我去上环接夜班”',
    body:['你父亲摔了手里的碗。合成瓷碎了一地，他红着眼睛吼：谁让你不念的？吼完他坐回凳子上，像一段泄了压的旧管线，说，是爹没本事。'],
    fx:{lamps:{载:1},attrs:{coin:1,arc:-1,men:1},flags:{quit_school:1}},hint:'载↑｜币↑ 术↓｜锁死：升学线关闭'},
   {k:'B',t:'去配给制职训营，学修义体',
    body:['父亲沉默了很久，说，好，咱家能出人就好。职训营在旧区第三层，你每天拧四百个接点，手心的茧一层压一层，指甲缝里全是洗不掉的金属灰。'],
    fx:{lamps:{轨:1},attrs:{arc:1},flags:{tech:1}},hint:'轨↑｜术↑'},
   {k:'C',t:'赌气说“我要考进上城，考不上就不回来”',
    body:['父亲没说话。半夜你醒来，听见他压着嗓子跟母亲算账：旧舱抵出去能换多少，还差多少。'],
    fx:{lamps:{越:1},attrs:{arc:1,coin:-1,men:-1}},hint:'越↑｜术↑ 币↓ 意志↓'}
  ]},
 {variants:2,t:'第三章 · 十七岁的私信',age:17,
  body:function(s){if(s.v===1)return['十七岁那年，学塾的公用频段里多了一段没有署名的语音包，挂在最底下那一栏，谁点开都不会显示已读。','那个总在课间回头看你的人，被上环提前调走了。不是转学，是入册。你把它翻出来的时候，对方的节点号已经注销三天。语音只有六秒，最后一个字被灰雪的静电吃掉了：你总盯着窗外那片灰，到底在看什么？','你没有可以投递的地址。你把它压进一本叫《边城》的旧书扫描件里，夹在最后一页。那一页本来什么都没有。'];return ['十七岁那年，你的课桌端口里，多了一封私信。',
   '那个总在课间回头看你的人转了学籍，走前把它压在你的端口缓存里，加密等级低得像是故意留的。你翻到它时，对方的节点号已经注销三天了。信很短，字很好看，写着：你总盯着窗外那片灰，到底在看什么？',
   '你没有回信的地址——对方的节点号已经注销。那封信，你存进了一本叫《边城》的旧书扫描件里。'];},
  choices:[
   {k:'A',t:'没回，让它在旧书扫描件里躺着',
    body:['后来你换舱，旧终端卖给了回收站。你站在巷口，看着载终端的手推车拐过街角。清空之前，你没来得及导出那一份。'],
    fx:{lamps:{频:1},attrs:{men:-1}},hint:'频↑｜意志↓'},
   {k:'B',t:'顺着{ta}的学籍记录找过去',
    body:['你照访客登记摸到那所学塾门口，在进闸的队伍里没看见{ta}。你在旧指示灯下等到熄灯。后来你们再没见上，可那一次一路跑过去的劲，你留了很多年。'],
    fx:{lamps:{冲:1},attrs:{vit:1,soc:1}},hint:'冲↑｜机体↑ 网↑'},
   {k:'C',t:'回了一封，发到旧号，被打了回来',
    body:['信被系统打回那天，你把它锁进离线分区，此后很多年都没删。'],
    fx:{lamps:{执:1},attrs:{arc:1}},hint:'执↑｜术↑'}
  ]},
 {variants:2,t:'第四章 · 货运磁轨',age:18,
  body:function(s){
    if(s.flags.quit_school)return['你终究是没走进那间考场。','同届的人还在倒计时，你背着行李包从学塾门口路过，没敢抬头。','父亲送你到磁轨站，塞给你两百信用点，说，实在不行就回来。'];
    if(s.v===1)return['十八岁那年，舱里的账第一次见了底。父亲把能换的东西换了一遍：备用电芯、旧义肢的关节，还有那台听了半辈子的收音机。','他没跟你说。你是路过配给站时撞见他抱着东西出来的，他把东西往身后藏，藏得笨，你全看见了。','那阵子你回来得晚，进门先看墙上那行数字。它一直在往下走，谁也没本事让它停住。你连开口问一句的胆子都没有。','后来他把一根捆扎带塞进你手里，是他在轨道厂用了半辈子的那根，扣子锈死了。他说：留着，将来捆什么都用得上。'];return['资格考核那年夏天，天极热。','考位是一排贴着编号的隔间，顶上的排风扇转了整场。你写到最后一页，听见外面货梭过闸的闷响。散场时你看见父亲蹲在檐下，手里攥着一瓶汽水，见你出来赶紧递过来：冰的。','他一句也没问考得怎么样，把汽水塞给你，说，回去吃饭。','后来评级下来了，离资格线差两分。','那一晚父亲坐在舱门口，抽了很多烟。他推门进你屋里说：再登记一年，爹供你，这舱抵出去也供你。'];
  },
  choices:[
   {k:'A',t:'再登记一年，重考一次资格',cond:function(s){return !s.flags.quit_school},lock:'你早就不在学塾了，这条路已经关上',
    body:['你把自己关了一年，除了下线睡觉不出舱。第二年你过了线。通知下来那天，父亲把那页文书翻来覆去地看，看得眼睛发湿，嘴上却说这有啥好看的。'],
    fx:{lamps:{越:1},attrs:{arc:2,men:-1,coin:-1},years:1},hint:'越↑｜术↑↑ 意志↓ 币↓｜耗 1 年'},
   {k:'B',t:'“爸，我走技术线，早点挣信用点”',cond:function(s){return !s.flags.quit_school},lock:'你早就不在学塾了，这条路已经关上',
    body:['你背起行李包，坐上南下的货运磁轨。靠窗的位置，对座大叔吃合成面的味道你记了很多年。窗外是倒退的棚架、冷却塔、一串认不出的航标灯。磁轨在身下嗡地一声启动。这条路，是你自己选的。'],
    fx:{lamps:{轨:1},attrs:{coin:1,arc:1},flags:{south:1}},hint:'轨↑｜币↑ 术↑'},
   {k:'C',t:'报外城一所松门槛的学塾',cond:function(s){return !s.flags.quit_school},lock:'你早就不在学塾了，这条路已经关上',
    body:['你比了几家的配额，最后上了车。磁轨开动那一刻你回头，父亲还站在月台上，越来越小，像井台边一枚晒干了的核桃。你把票根攥在手心，告诉自己别回来时还是这副样子。'],
    fx:{lamps:{迁:1},attrs:{arc:1,soc:1,coin:-1}},hint:'迁↑｜术↑ 网↑ 币↓'},
   {k:'A',t:'上磁轨，去南边的流水线',cond:function(s){return !!s.flags.quit_school},lock:'你还在念书',
    body:['你跟着同乡上了南下的磁轨。流水线的节拍比学塾的铃还准。第一个月你划回去三百信用点，附了一行字：我挺好的。'],
    fx:{lamps:{轨:1},attrs:{coin:1,vit:-1},flags:{south:1}},hint:'轨↑｜币↑ 机体↓'},
   {k:'B',t:'留在下城，给老陈打下手修义肢',cond:function(s){return !!s.flags.quit_school},lock:'你还在念书',
    body:['你拜了巷尾的老陈做师傅，学修义肢。老陈脾气坏，手却稳。三年后你能在米粒大的接点上落焊，闭着眼也敢下手。'],
    fx:{lamps:{载:1},attrs:{arc:2}},hint:'载↑｜术↑↑'},
   {k:'C',t:'白天搬模块，夜里啃自考课',cond:function(s){return !!s.flags.quit_school},lock:'你还在念书',
    body:['你在工地搬模块，夜里在工棚灯下啃课。灰雪围着灯泡打转，你一手拍雪一手翻页。六年后你拿到那张登记凭证，没人知道它有多重。'],
    fx:{lamps:{越:1},attrs:{arc:2,vit:-1,men:1},years:1},hint:'越↑｜术↑↑ 机体↓ 意志↑｜耗 1 年'}
  ]},
 {variants:2,t:'第五章 · 蜂巢舱与第一笔信用点',age:22,
  body:function(s){if(s.v===1)return['上城不问你在地下几层睡过，也不问你上一回吃热的东西是哪一天。它只问一句：你今天能不能上线。','你排到的第一份活是夜巡：沿着旧井那一层的管廊走一圈，把冻住的阀芯敲开，把跳闸的回路复位。一夜走十四公里，脚下永远是湿的。','第一个月的信用点到账，不是屏上跳出来的一串数字，是配给站出票口吐出来的一张薄片凭条。你把它插进终端，数字亮了一下。你看了三遍，拔出来又看了两遍。','你给下城留了一段话。祖母的回话只有一句：我娃瘦了。父亲在旁边挤进来一句：别把钱都花在吃上。'];return ['上城不看你哭过几回，也不看你手里那张登记凭证。',
   '你租了旧城区一个蜂巢舱，墙皮是 recycled 塑料，一张床、一张桌、一扇朝北的排气窗。窗外那盏旧指示灯每晚准时亮，像是城里唯一愿意陪你的东西。',
   '第一份工，你上流水线、跑外单、替人补代码，一天十二个小时。第一个月信用点到账那天，你站在终端前把那一串数字看了三遍，第一次觉得自己够格在闸口那边刷卡了。',
   '你给家里接通话，祖母的影像在画面里晃，说：我娃瘦了。你说，没瘦，胖了两斤。父亲在旁边挤进来一句：信用点自己留着，别饿着。'];},
  choices:[
   {k:'A',t:'划一半信用点回下城',
    body:['母亲在通话里数落你乱花信用点，骂到一半声音哑了。父亲难得开口，只说了三个字：好孩子。就这三个字，让你在磁轨上低头系鞋带，系了很久。'],
    fx:{lamps:{载:1},attrs:{coin:-1,men:1}},hint:'载↑｜币↓ 意志↑'},
   {k:'B',t:'全砸在自己身上：夜校加二手终端',
    body:['你把到手的信用点全押在自己身上。夜校在旧区第五层，二手终端的散热扇响得像要散架。后来靠这门手艺，你在上城站住了脚。你偶尔想起祖母写在钢板上的那两笔，觉得自己正给自己补第二笔。'],
    fx:{lamps:{轨:1},attrs:{arc:2}},hint:'轨↑｜术↑↑'},
   {k:'C',t:'请同舱的人吃了一顿合成餐',
    body:['你第一次尝到人情往来的甜和重。合成餐配着兑水的酒，四个人挤在舱里，笑声快把顶板掀了。你咂摸出来：想在这边站住，光靠手不行，得有一条肯替你说话的频段。'],
    fx:{lamps:{链:1},attrs:{soc:2,coin:-1}},hint:'链↑｜网↑↑ 币↓'}
  ]},
 {variants:2,t:'第六章 · 那盏没点亮的指示灯',age:28,
  body:function(s){if(s.v===1)return['父亲是在配给站过磅的时候倒下的。一袋合成粮压在磅上，数字停在半路，人先滑下去了。送到维护舱才知道不是摔的：神经根，年轻时连了太多夜班，义体和肉身一起烂在里面。','你赶回下城。他躺在维护舱里，看见你就笑，说小毛病，别担心。他手上的老茧还在，指节比你记忆里细了一圈。','那几天你守在舱门口，替他调床位的高低、替他念配给站的排班表。他听着听着就睡过去，醒过来第一句话是问站里那台磅还准不准。','走的前一晚，他把母亲支去领东西，从枕头底下摸出一把旧扳手，握柄被手掌磨出一块白亮的洼，旁边压着半支没抽完的合成烟。他说：你爹这辈子没给你留下别的，就这双手，还算稳。你拿着。'];return ['你恋爱了。{ta}在上城的另一片枢纽做事，笑起来眼睛弯弯的。你们把两条通勤轨坐了个遍，你把每月到账的信用点，一小半花在带{ta}吃那些贵得没道理的现做菜上。你夜里回舱，觉得灰雪落下来都带着点暖色。',
   '再往后，先崩的是父亲的神经根。不是外伤，是年轻时连了太多夜班，义体和肉身一起烂在里面。你赶回去，看见病床上的他瘦了一大圈，还笑着说小毛病，别担心。',
   '你请了几天假守着。走的前一晚，父亲把母亲支出去，从枕头底下摸出一样东西：你小时候那只纸青蛙旁边，另一件他藏了半辈子的——一张泛黄的硬片。年轻的他站在轨道厂门口，身后是灰雪。',
   '他说：你爹这辈子没替你挣下一间上城的舱，就这一身硬骨头和这颗要强的性子，你拿去吧。'];},
  choices:[
   {k:'A',t:'先留下来，把手上班次交接干净',
    body:['你在下城多待了两周，班次交给同组的人顶。那两周你陪他下棋、替他把公告念出声、看他在天井里晒人造太阳。你后来总说，那半个月是你这一生最像样的日子。'],
    fx:{lamps:{驻:1},attrs:{coin:-1,men:1},flags:{father_stay:1}},hint:'驻↑｜币↓ 意志↑'},
   {k:'B',t:'先回去上线，说“跑完这轮就回”',
    body:['这轮班跑得比想的长。后来你接到通话，说父亲进了抢救舱。你赶回去时他的节点已经离线了，只留着一具还在喘气的身体。你跪在床前喊爸，他的手指动了动，却没能抬起。'],
    fx:{lamps:{缺:2},attrs:{men:-1},flags:{no_goodbye:1}},hint:'缺↑↑｜意志↓｜不可逆：第七章与第十章全部改写'},
   {k:'C',t:'把工位辞了，回去守着他',cond:function(s){return s.attrs.coin>=2},lock:'你拿不出卸下工位的底气（币不足 2）',
    body:['母亲说你傻呀。你说，妈，工位没了能再排，爸就这一个。那段时间你守他走完最后一程，他的节点是慢慢暗下去的，没跳。后来你一笔一笔把债还清，重新排班。'],
    fx:{lamps:{燃:2},attrs:{coin:-2,men:2},flags:{father_stay:1,quit_job:1}},hint:'燃↑↑｜币↓↓ 意志↑↑'},
   {k:'D',t:'拒绝加装，按时下线',
    body:['你把神经链的时段调回了最基础的那一档。少挣的信用点你记在本子上，一次也没去补。'],
    fx:{lamps:{守:1},attrs:{vit:2,coin:-1}},years:2,hint:'守↑｜体魄↑↑ 信用点↓｜寿 +2'}
  ]},
 {variants:2,t:'第七章 · 节点前的灯',age:29,
  body:function(s){
    if(s.flags.no_goodbye)return['父亲走的那年冬天，云栖又下了一场灰雪，像极了你出生那年。','你跪在他的节点前，一晚上没合眼。你想得最多的不是他在井台边掐灭的那支合成烟，而是你最后一次见他，他说回来啦，你应了一声哎，然后就走了。','你连他最后想说什么都不知道——他没留下语音包。','你给节点接了一路应急电，亮到天明。'];
    if(s.v===1)return['父亲走的那年冬天，灰雪下了整七天，把下城的管廊口埋掉一半。他的节点停在旧舱那面墙上，一盏指示灯，绿了二十多年。','你在节点前守了三夜。铁皮巷的人来了一趟又一趟，来了就蹲在门口，谁也不多说话，走的时候把手在裤子上擦一擦。','第三夜你才把他交代过的事一件一件数出来：别怕；把自己顾住；还有那句说过很多回的，实在不行就回来。','你没让节点前那盏灯断过。天快亮的时候，底下第一班磁轨从管廊里过，震得钢板响。你就着这个声响，把它当成送行。'];return['父亲走的那年冬天，云栖又下了一场灰雪，像极了你出生那年。','你跪在他的节点前，一晚上没合眼。你想起他在井台边反反复复掐灭的那支烟，想起他把评级单折成四折揣在贴身口袋里，想起他在钢板上写的那两笔。','你到这时候才数明白，他这辈子只交代过两件事：别怕；把自己顾住。','节点前的灯你守着，没让它断过一帧。'];
  },
  choices:[
   {k:'A',t:'把那半支合成烟收进旧铁盒',
    body:function(s){return s.flags.no_goodbye?['很多年后你打开那个铁盒，烟已经潮了。你对着它站了很久，想说爸我挺好的，最后只说了半句。这句话本该说给一个还亮着的节点听，不是说给一盒潮烟的。']:['很多年后你打开那个铁盒，烟已经潮了。你对着它说：爸，我挺好的。说完把盒盖按回去，按了两下才扣上。']},
    fx:function(s){return s.flags.no_goodbye?{lamps:{频:1,缺:1},attrs:{men:-1}}:{lamps:{频:1}}},
    hint:'频↑（若未告别：同时缺↑ 意志↓）'},
   {k:'B',t:'把他的节点灯挂在最高那层架上',
    body:['每天出门前抬头看一眼那盏节点灯，你说，爸，我上工去了，像他还坐在舱里的时候。'],
    fx:{lamps:{播:1}},hint:'播↑'},
   {k:'C',t:'烟不留，灯不挂，一并清掉',
    body:['你什么也没留，只把他记着，连同那晚的灰雪、井台边的冷凝水、巷口那盏旧指示灯。有些人不靠遗物活着，他早长进了你骨头里。'],
    fx:{lamps:{嵌:1}},hint:'嵌↑'}
  ]},
 {variants:2,t:'第八章 · 四十岁的注销',age:40,
  body:function(s){if(s.v===1)return['四十岁那年，你那条线整个被并进了另一片枢纽。人不用挪地方，权限先走一步。待签的单子上，你的名字被挪到了最下面那一栏。','闸机照旧认得你的脸，认不出你的号。第一天你在闸口试了四回，最后跟着送料的车从侧门进去的。','你在枢纽底层的空舱里坐了两个月。舱壁上那张排班表从头到尾没有你的名字。你每天照点去，照点回，谁也没赶你。','{ta}说：要不，我们回下城吧。你没答。窗外旧城区那盏指示灯还亮着，亮得跟二十年前一样。'];return ['四十岁那年，你的工号被注销了。',
   '不是清退，是替代。新一版调度模型上线，你做了十年的那件事，被压成一行脚本。你没吵也没闹。你在枢纽楼下站了一会儿，看那栋待了十年的调度塔，然后转身进了磁轨站。终端里，舱位分期的催缴单安安静静躺着。',
   '你开始重新递登记申请。三十五岁是一道闸，四十岁是一道更高的闸。你学会了一件事：在自动评议那台机器面前，把“我快四十了”说成“我接过的线比你见过的多”。',
   '{ta}说：要不，我们回下城吧。',
   '你站在窗边，看着旧城区那盏陪了你很多年的指示灯。它还在亮。'];},
  choices:[
   {k:'A',t:'留在原地，改行再学一遍',cond:function(s){return s.attrs.arc>=5},lock:'术不足 5：你的底子撑不起一次转身',
    body:['你报了班，从头学新东西，像二十岁那年一样背题。有几回你半夜把终端合上，第二天又打开。后来你在一处模型还啃不动的活口站住了。孩子问你后悔吗，你说，不后悔，牌打烂了可以重洗。'],
    fx:{lamps:{轨:1,越:1},attrs:{arc:2,men:-1,coin:-1},flags:{fired:1}},hint:'轨↑ 越↑｜术↑↑ 意志↓ 币↓'},
   {k:'B',t:'带着一家人退回下城',cond:function(s){return s.lamps['频']>=1||s.flags.father_stay},lock:'你早已无根可回（频未亮、也没陪过父亲）',
    body:['下城，井台还在，天桥还在，铁皮巷里那块磨亮的钢板还在。你接手了父亲留下的旧舱，补了顶板住下来，每天沿天桥走一圈，跟隔壁舱的人点头。你走了半辈子，最后还是认这片灰雪。'],
    fx:{lamps:{源:1},attrs:{men:2,coin:-1},flags:{fired:1,back_home:1}},hint:'源↑｜意志↑↑ 币↓'},
   {k:'C',t:'两头都不落，跟着工期漂',
    body:['你开始接散活，今年这片枢纽，明年那片。你常年在磁轨上，看过很多座城的后半夜。你偶尔想起父亲那句往上城去，别停在闸口这边，才发现自己一直在追一个还没影的上城。'],
    fx:{lamps:{逐:1,驻:-1},attrs:{soc:-1,coin:1},flags:{fired:1}},hint:'逐↑ 驻↓｜网↓ 币↑｜韧度 +1'},
   {k:'D',t:'去做一次完整的义体维护',
    body:['维修舱的灯很白。技师问你多久没来了，你说记不清。醒来以后你摸着自己的手，第一次觉得这副身体是自己的。'],
    fx:{lamps:{念:1},attrs:{vit:2,coin:-2}},years:3,hint:'念↑｜体魄↑↑ 信用点↓↓｜寿 +3'}
  ]},
 {variants:2,t:'第九章 · 凌晨三点的合成面',age:45,
  body:function(s){if(s.v===1)return['这一年你们的作息彻底错开了。她上白班，你接夜单，同一间舱里两个人像两组轮流上电的回路。','舱里那块屏替你们记事：她的维护日期、你的下线时间、交租的日子。中间那一大片空白，谁也没去填。','凌晨三点，你自己的神经接口先醒了：对面那一刻的体表温度掉得比平时快。你下床，热了两支营养膏，锡管烫得握不住。','她没接。她坐起来看着那两支锡管，问：我们上一次一起看完一整场人造太阳落下去，是哪一年？你答不上来。数据存得下你跑过的每一单，存不下这个。'];return ['你们这一年靠共享日程过日子。她的排班、你的外包单、房子的自动还款，都写在同一块屏上，谁都不必开口。',
   '交流变成了消息。你在客厅，她在卧室，两条消息之间隔着一句"嗯"。',
   '凌晨三点，你的神经接口弹出一条提示：对方睡眠周期异常，已持续十一分钟。你下床，热了两支营养膏。',
   '她没接。她坐起来，看着你手里那两支锡管，忽然说：我们上一次一起吃热的东西，是哪一年？你答不上来。数据存得下你所有的订单，存不下这一个答案。',
   '那晚你们没聊很久。她把自己那支搁回床头，没拆。你看着它一点点凉下去，管壁上凝出一层白霜。'];},
  choices:[
   {k:'A',t:'你先把排班表调成两个人的',cond:function(s){return s.attrs.men>=4},lock:'意志不足 4：你连自己都撑不住，顾不上别人',
    body:['你开始手写日程。你把她的休息日圈出来，旁边画一个只有你俩看得懂的记号。第一周她没反应，第三周，她在那天晚上提前回了家。'],
    fx:{lamps:{温:1},attrs:{soc:1,men:1}},hint:'温↑｜网↑ 意志↑'},
   {k:'B',t:'你把从没上传过的那些话说出来',cond:function(s){return s.attrs.men>=5||s.lamps['明']>=1},lock:'意志不足 5：这些话你还是说不出口',
    body:['你把那些从没上过网的东西说了出来：父亲被注销那天你没掉眼泪、自己账号被冻结那夜你在天台坐了一整晚。她听完说，你怎么不早说。她的声音也发了抖。'],
    fx:{lamps:{明:1},attrs:{men:1,soc:1}},hint:'明↑｜意志↑ 网↑'},
   {k:'C',t:'把营养膏递过去，话还是没出口',
    body:['锡管递过去，话缩回来。你们又运行了几年，同一间舱，各自待机。系统一直提示关系状态正常。你比谁都清楚，那是没报错，不是没坏。'],
    fx:{lamps:{驻:-1},attrs:{men:-1}},hint:'驻↓（灯暗一档）｜意志↓'}
  ]},
 {variants:2,t:'第十章 · 母亲的缓存',age:52,
  body:function(s){if(s.v===1)return['母亲的缓存开始丢东西。先是丢名字，后来丢年份，最后连井台在哪个方向，她都要回头问你一句。你答得越来越慢，她问得越来越快。','有个下午她抬头看你，问：你是哪一位？你说：我是你{子}啊。她哦了一声，隔一会儿又问一遍。问到第七遍的时候，她自己先笑了。','她认不出你，可每次走到铁皮巷口那口井，都会停下来，用手背试风向。她说：这风不对，娃该加件衣裳了。','以前是她把你从井台上背回去的，一只手托着你，一只手扶着管壁。现在轮到你把她从井台边扶起来了。'];return ['母亲老了。她常常坐在井台边——如今井早停服了，被盖上了水泥——一坐就是一下午。',
   '她的记忆缓存开始掉帧。有个下午她抬头看你，问：你是哪一位？你说：我是你{子}啊。你怎么连'+'{name}'+'都不认得了？她哦了一声，没往心里存，隔一会儿又问一遍。',
   '她忘了很多人，却总记得去配给站领你爱吃的那一份，记得给她的娃在窗台上留一盏小灯。',
   '你发现，那个在灰雪夜里抱着你的人，现在需要你抱了。'];},
  choices:[
   {k:'A',t:'把她接进你这间舱',cond:function(s){return s.attrs.coin>=3},lock:'币不足 3：你连一个多余的舱位都腾不出',
    body:['舱里凭空多了个老小孩。你学会给她做饭、剪头发、按时换药。她半夜醒来会说怕黑，你就让过道那盏灯一直亮着，亮到天亮。'],
    fx:{lamps:{驻:1,燃:1},attrs:{coin:-1,vit:-1,men:1}},hint:'驻↑ 燃↑｜币↓ 机体↓ 意志↑'},
   {k:'B',t:'每周固定回一趟，灰雪也走',cond:function(s){return s.attrs.men>=4},lock:'意志不足 4：你连每周一趟都撑不下来',
    body:['你成了下城的常客，成了那间旧舱每到周末就亮一回的灯。街坊都说这娃心实。只有你知道自己在补一笔账：父亲那盏没点亮的指示灯，你想在母亲身上点亮。'],
    fx:{lamps:{缺:-1,燃:1},attrs:{men:1}},hint:'缺→燃（灯·转化）｜意志↑'},
   {k:'C',t:'总说“排完这轮班就回去”',
    body:['你接通话，她在画面里笑，说你忙你的，妈好着呢。你挂断，坐在舱里半天没动。后来你终于回去了，她攥着你的手说，等你好久了。那天夜里你睡在旧舱，她起来给你掖了掖被角，掖了两回。'],
    fx:{lamps:{缺:2,驻:-1},attrs:{men:-1}},hint:'缺↑↑ 驻↓｜意志↓｜韧度 +1'}
  ]},
 {variants:2,t:'第十一章 · 一个人的舱室',age:60,
  body:function(s){if(s.v===1)return['你干了四十三年的那条线，到最后被折成一段数，划进一张薄片里。有人教你按哪个键把它取出来用，你学了三天才记住。','下工那天没人通知你，是你自己算出来到点了。你沿着管廊走了最后一趟，把每一盏还亮着的指示灯都摸了一遍。','回到舱里，你先把那扇朝北的排气窗擦干净。底下那层的孩子放了学，追着跑，吵成一团。你想起自己六岁那年也这么跑过，跑过两条巷子，在闸口被杆子拦下来。','你打开那个旧铁盒。里面没有值钱的东西：一枚锈住的捆扎带扣、几片刻着字的旧钢板、一叠没人再认的票根，还有几片干枯的叶子。你把它倒在桌上，倒出很轻的一声响。'];return ['注销工号那天，你从调度楼里出来，人造太阳刺得睁不开眼。',
   '你在台阶上站了一会儿。没人来接你。你自己回了舱，门一开，冷气先扑上来。',
   '你把舱里收了一遍，给自己煮了一包合成面。盐包放多了，你想起母亲总说你手底下没个准。',
   '你坐到那扇朝北的排气窗边，看下面一层的孩子放了学、追着跑、吵成一团。你想起自己也这么小过，在井台边撩冷凝水，把钢板溅得星星点点。',
   '你打开那个旧铁盒。里面是：一只发潮的纸青蛙、一封没发出去的私信、一张家里的老硬片，还有十几张磁轨票根，几片干枯的叶子。',
   '这就是你这一生登记过的全部。'];},
  choices:[
   {k:'A',t:'把盒子里的东西一件件写下来',cond:function(s){return s.attrs.arc>=6},lock:'术不足 6：你想写，却不知道从哪一句起头',
    body:['你把井台、铁皮巷、天桥、灰雪、货运磁轨、凌晨三点那两支冷掉的营养膏，全写了进去。最后一页你写：这一生我点过很多灯，也熄过几盏。愿读到这儿的人，都有人替他留一盏。'],
    fx:{lamps:{播:2},attrs:{arc:1},flags:{wrote_book:1}},hint:'播↑↑｜术↑｜解锁第十二章 B'},
   {k:'B',t:'每周跟还剩的老友碰一次面',cond:function(s){return s.attrs.soc>=4},lock:'网不足 4：你翻遍联络名录，找不到一个能接通的号',
    body:['你们坐在天桥头，看底下那艘报废的货运梭，讲从前线上的事。有人已经听不清了，就看着别人笑。散场时都说，下辈子还挂在同一个频段。'],
    fx:{lamps:{链:1},attrs:{men:1}},hint:'链↑｜意志↑'},
   {k:'C',t:'把盒盖扣上，搁在枕边，不动',
    body:['你每天睡前打开看一会儿，再扣上盒盖。东西都在里头，谁也没动过。'],
    fx:{lamps:{频:1}},hint:'频↑'},
   {k:'D',t:'定期维护，不再硬扛',
    body:['你终于学会在警报响之前就下线。灰雪落在窗外，你端着热的东西坐着，什么也没做。'],
    fx:{lamps:{暖:1},attrs:{vit:2,men:1}},years:3,hint:'暖↑｜体魄↑↑ 心力↑｜寿 +3'}
  ]},
 {variants:2,t:'第十二章 · 最后一场灰雪',age:78,
  body:function(s){if(s.v===1)return['你走的那天，灰雪落得没有声音。下城的管廊口全落了闸板，只剩旧井那一块还露着，往外冒着一点白汽。','你躺在维护舱里，屏上的曲线一档一档往下走，像夜班时管廊里的水压。你想把罩子掀开一点，好看看外面。','舱外有人在过道里走，脚步声一晃一晃。你听出来的是别的声音：铁皮巷的滴水、天桥下货梭过闸的闷响、配给站那台磅落下去的一声钝响。这一辈子的声音排着队从耳边走过去，一个也没落下。','值班的人替你按灭了墙上的指示灯。灰雪还在下，一层压一层，把管廊口、天桥、还有那口停了服的井，全盖平了。'];return ['你走的那天，灰雪下得很碎，像极了你出生那年封城第三天。',
   '你躺在床上，透过窗看见灰雪落在旧舱的檐口、落在钢板上、落在远处那座天桥。你恍惚看见好几个自己：灰雪夜被登记的那个婴儿、井台边的孩子、货运磁轨上靠窗的年轻人、调度塔下转身的中年人、排气窗边坐着的老人。',
   '那几个你都朝这边看。',
   '你想回应他们。喉咙里只剩一点电流的杂音。',
   '窗外，好像有人给一盏旧指示灯，轻轻罩上了一个罩子，免得灰雪把它打灭。'];},
  choices:[
   {k:'A',t:'把能拨的号都拨一遍',cond:function(s){return s.attrs.soc>=3},lock:'网不足 3：你已经想不起该打给谁',
    body:['你用最后一点力气把能拨的号都拨了一遍，说我挺好的，你们好好的。通话那头的人不知道，这一句挺好的，是收尾。'],
    fx:{lamps:{播:1}},hint:'播↑'},
   {k:'B',t:'留下那本一页页写满的册子',cond:function(s){return !!s.flags.wrote_book},lock:'你这一生没有留下只言片语',
    body:['你留下那本一页一页写满的册子。后来有人在深夜的指示灯底下读到它，一直坐到天亮。'],
    fx:{lamps:{播:2}},hint:'播↑↑'},
   {k:'C',t:'什么也不留，只把窗闩拉开',
    body:['你抬手把帘子拉开一角，让灰雪那点白光透进来。然后你闭上眼睡过去，像跑完一段很长很长的夜班，终于到点下线。'],
    fx:{lamps:{源:2}},hint:'源↑↑'}
  ]}
],
endings:function(ctx){
  var L=ctx.lamps,A=ctx.attrs;
  var core=sumLamps(L);
  if(L['频']>=2&&L['载']>=2&&L['轨']>=2&&L['燃']>=2&&L['播']>=2&&L['源']>=2&&L['温']>=2)
    return mkEnd('点亮万盏灯','hidden','你这一生太完整，完整到后来下城的孩子都听过你的节点号。可你自己知道，你只是每一回都选了那个更难一点的选项。',ctx);
  if(ctx.tough>=3) return mkEnd('九死未悔','hidden','你的一生被注销过很多次。每一次你都以为这回是真的完了。可灯芯这东西，灭了还能再点着。你点了很多很多次。',ctx);
  if(A.coin>=8&&core<=15) return mkEnd('金灯无芯','special','你最后什么都有了：舱位、信用点、上城的通行权限。只是夜里屋子里太亮，亮得你看不清任何一张脸。你不缺灯，你缺的是灯底下坐着的人。',ctx);
  if(A.soc<=1&&core>=12) return mkEnd('独照','special','你几乎没让任何人真正走近过。你把自己活成了天桥头那盏旧指示灯：照过很多人，谁也没上过你的楼。',ctx);
  if(L['源']>=3&&(L['缺']||0)<=0) return mkEnd('灰雪无声','special','你回到那口停服的井边，坐在钢板上，什么也不想。你欠系统的还清了，系统欠你的，你不打算要了。灰雪落下来，没有声音。',ctx);
  var b=ctx.bucket;
  if(b==='chuan')    return mkEnd('传灯者','normal','你的节点注销很久了，还有人在夜里读你留下的那句话。灯换了一盏又一盏，火还是那一点火。',ctx);
  if(b==='zhideng')  return mkEnd('执灯人','normal','你这一生没干成什么惊天动地的事，可你守住了该守的人。铁皮巷的烟火里，你的灯最亮，也最安稳。',ctx);
  if(b==='yuanxing') return mkEnd('点灯的远行者','normal','当年那个被系统判为低优先级的孩子，一路逆风，走得很远。你走过的轨后来成了别人的路标。',ctx);
  if(b==='guntang')  return mkEnd('滚烫的人','normal','你从没真的停下来过。别人说你折腾，你自己知道，你只是不愿意凉。',ctx);
  if(b==='shoudeng') return mkEnd('守灯的人','normal','你没有把谁照亮成人造太阳，你只是让身边的人，在关键时刻没黑着。寻常日子被你过成了诗。',ctx);
  if(b==='quejiao')  return mkEnd('缺一角的灯','normal','你这一生有太多包没发出去。到最后你跟那些未发送坐在同一张桌前，各自喝了一杯，谁也没提当年。',ctx);
  return mkEnd('灯与灰雪','normal','你一直在找归宿。找了很多年才发现，归宿不在上城，在你出发的那场灰雪里。',ctx);
},
epitaph:function(ctx){
  var m=ctx.main;
  var pool={
    '燃':['爸，我挺好的。','这一回，我没迟到。'],
    '频':['有些包没发出去，就发给岁月了。'],
    '缺':['来日方长，敌不过一句等我回来。'],
    '轨':['人生是一条轨，我踩上去了，就没下来。'],
    '源':['走遍上城下城，还是那口井边。'],
    '播':['这一生我点过很多灯，也熄过几盏。'],
    '驻':['有些好东西留不住，所以要在手边时看够它。'],
    '温':['日子不是熬出来的，是修出来的。'],
    '执':['我用很长时间记得一个人。这是福，也是劫。'],
    '越':['我踩着全家人的肩膀，够到了高处。']
  };
  var p=pool[m]||['这一局，我尽力了。'];
  return pick(p);
}
};

prologue:function(s){
  var g=s.gender==='女';
  return [
  '二一〇年冬，玄霜落了整月。山门下的柴屋漏风，夜里得拿草帘子堵上。',
  '照心井的执事来得比产婆还早。他背着一座半人高的灯龛，铜皮包角，冻得发白。进门第一句不是问母子平安，是问：灯芯备好了没有？',
  '你父亲答不上来。家里能换的都换了，偏偏忘了这个。灯芯要三块碎灵石，他没有。',
  '执事没说话，从灯龛里取出一根备用的，插上。他说：先记着，日后还。',
  '那一夜，一根百年古松的芯子在你额前烧了小半个时辰。火苗几次要塌，几次又立起来。',
  '执事走的时候留了一句：这孩子灯不稳，往后是个操心的。',
  '你父亲在门口站到天亮。第二天有人在灶膛里发现一截烧断的火折子，断口很齐，是被硬捏断的。',
  'p.ann||你的第一个抉择，其实早就替你做好了：你被点了灯，你没办法不活。'
  ];
},

events:[
 {id:'x23',n:'井水里照出别人的脸',when:function(s){return s.age>=6&&s.age<=16},text:'你去井边打水，水面上浮着一张不属于你的脸。',
  out:[{c:function(s){return s.attrs.arc>=4},t:'你把水舀开一层，那张脸还在，眉眼像谁你说不上来。你回屋拿火棍，在灰地上照着描了一遍，描到第三遍才描对，那天你认了七个新字。',fx:{attrs:{arc:1},lamps:{忆:1}}},
       {c:function(s){return s.attrs.men>=5},t:'你盯着它看，直到腿蹲麻了。祖母来叫你，你才直起身。你把桶里的水泼了，重新打了一桶，那张脸就没再出来。',fx:{attrs:{men:1},lamps:{镇:1}}},
       {t:'你手一抖，水晃起来，脸就散了。你再想找，只剩自己那张小脸，还有半片云。',fx:{lamps:{敛:1}}}]},
 {id:'x24',n:'自己搓的第一根灯芯',when:function(s){return s.age>=6&&s.age<=15},text:'祖母让你学着搓灯芯。棉花要撕得匀，搓的时候手不能停。',

       {t:'你搓一根断一根，桌上堆了一片碎絮。祖母什么也没说，把碎絮拢起来，装进了自己那个旧荷包。',fx:{lamps:{温:1}}}],choices:[{k:'A',t:"你搓了十几根，只成了一根，还搓得太紧。插进灯盏里烧得比别家的都久，祖母把那根挑出来，说留给你用。",fx:{"lamps":{"行":1},"attrs":{"men":1}}},{k:'B',t:"你搓一根断一根，桌上堆了一片碎絮。祖母什么也没说，把碎絮拢起来，装进了自己那个旧荷包。",fx:{"lamps":{"温":1},"attrs":{"men":1}}}]},
 {id:'x25',n:'半块废灵石',when:function(s){return s.age>=8&&s.age<=20},text:'你在后山的碎石堆里刨出半块灵石。边角是断口，里头的灵光只剩一点，像没睡醒的萤。',

       {t:'你没敢拿回家。你把它塞回石堆里，用两块石头压住，做了个记号。第二年你回去看，记号还在，石头没了。',fx:{lamps:{憾:1}}}],choices:[{k:'A',t:"你把它拿到外城的铺子里换了东西：一整袋粗盐，一把削得动木头的短刀。掌柜说这半块只值这些，你也没还价。",fx:{"lamps":{"行":1},"attrs":{"coin":1}}},{k:'B',t:"你把它压在枕下，一压压了三年。后来你才知道，开了口的灵石放久了会自己哑掉。你捏着那半块哑石，在井边站了半炷香。",fx:{"lamps":{"敛":1},"attrs":{"men":1}}}]},
 {id:'x26',n:'替人当差',when:function(s){return s.age>=12&&s.age<=26},text:'管杂役的执事站在棚子外头喊：西坡缺一个人手，谁去。',

       {c:function(s){return s.attrs.soc>=4},t:'你替了两日。第三日有人替你把柴劈了，你这才知道那位同门在外门认得不少人。',fx:{attrs:{soc:1},lamps:{渡:1}}},

 {id:'x27',n:'山门发冬衣',when:function(s){return s.age>=8&&s.age<=20},text:'入冬前，山门给外门的杂役弟子发冬衣。一人一件，按名录点。',

       {c:function(s){return s.attrs.coin>=3},t:'你那件短了一截，袖口露着手腕。你拿出三块碎灵石，请药庐的婆婆往里续了一层棉花。',fx:{attrs:{coin:-1,vit:1},lamps:{温:1}}},

 {id:'x28',n:'外门的那阵笑',when:function(s){return s.age>=12&&s.age<=28},text:'演武场边上有几个外门弟子在说笑。你走过去的时候，其中一个把嗓子抬高了：无灵根也配领宗门的饭？',

       {c:function(s){return s.attrs.arc>=4},t:'你没停步，回去把那半本旧账簿翻到最后一页，把剩下的字描完了。后来在丹房，你比谁都先看懂方子上的火候。',fx:{attrs:{arc:1},lamps:{攀:1}}},
       {t:'你低了头，走快了。那句话你记了很多年，记到后来已经想不起是谁说的。',fx:{attrs:{men:-1},lamps:{敛:1}}}]},
 {id:'x29',n:'药庐里那株草',when:function(s){return s.age>=6&&s.age<=18},text:'药庐墙根下有一株草，被踩得只剩两片叶。你每日给它浇半瓢水。',

 {id:'x30',n:'夜半那阵咳',when:function(s){return s.age>=14&&s.age<=32},text:'你起夜，路过师父的柴房，听见里头一阵咳，咳到后头带出点湿响。',
