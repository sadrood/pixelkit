 {id:'x3',n:'旧友借灵石',when:function(s){return s.age>=22},
  out:[{c:function(s){return s.attrs.soc>=4},t:'你借了。两年后他翻倍还你，还带来一桩好差事。',fx:{attrs:{soc:1,coin:1},lamps:{渡:1}}},
       {t:'你说自己也紧。对面沉默了一下，说无事。后来就再没见过他。',fx:{attrs:{soc:-1}}}]},
 {id:'x4',n:'一场高热',when:function(s){return s.age>=18&&s.age<=55},
  out:[{c:function(s){return s.attrs.vit>=5},t:'烧到三十九度，睡了一天，出了身汗，好了。',fx:{attrs:{vit:1}}},
       {t:'烧了三天。你没歇，怕误了差事。病拖成了暗伤。',fx:{attrs:{vit:-1,men:-1}}}]},
 {id:'x5',n:'一句提点',when:function(s){return s.attrs.arc>=4&&s.age>=20},text:'有人在内门长老面前提了你的名字。',
  out:[{t:'你被调去一个能真正学到东西的地方。那一年你像块干海绵。',fx:{attrs:{arc:1}}}]},
 {id:'x6',n:'洞府涨价',when:function(s){return s.age>=22&&s.age<=45},
  out:[{c:function(s){return s.attrs.coin>=4},t:'涨就涨吧，你还住得起。洞外那盏灵石灯还是每晚准时亮。',fx:{attrs:{coin:-1}}},
       {t:'你搬去了外城最偏的一条巷子。门外没有灯，只有一片黑。',fx:{attrs:{coin:-1,men:-1},lamps:{游:1}}}]},
 {id:'x7',n:'母亲的传讯',when:function(s){return s.age>=12},
  out:[{c:function(s){return s.flags.no_goodbye},t:'她问你吃了没。你说吃了。断了传讯你坐了很久，有些话这辈子都问不出口了。',fx:{attrs:{men:-1},lamps:{憾:1}}},
       {t:'她问你吃了没。你说吃了。其实那天你还没吃。',fx:{lamps:{忆:1}}}]},
 {id:'x8',n:'同门聚会',when:function(s){return s.age>=32},
  out:[{c:function(s){return s.attrs.soc>=5},t:'去了。当年的人多半境界涨了，话却比年轻时软。散场有人拍你肩膀：下回你组局。',fx:{attrs:{soc:1},lamps:{渡:1}}},
       {t:'你没去。他们在传讯册里发的合照上，你一眼找到了那个空位。',fx:{lamps:{敛:1}}}]},
 {id:'x9',n:'验脉',when:function(s){return s.age>=40},
  out:[{c:function(s){return s.attrs.coin>=4},t:'经脉有一处淤堵。你拿出灵石请人通了，虚惊一场。',fx:{attrs:{coin:-1}}},
       {t:'经脉有一处淤堵。你说等忙完这阵。这一等，就是三年。',fx:{attrs:{vit:-1},flags:{sick:1}}}]},
 {id:'x10',n:'照心井封了',when:function(s){return s.age>=35},text:'山门下的照心井，被宗门以“陈旧”为由填了。',
  out:[{c:function(s){return s.lamps['忆']>=1},t:'你回去看过一次。石阶还在，井没了。你蹲下来摸了摸那块新石，像摸一个已经说不出话的老朋友。',fx:{lamps:{化:1}}},
       {t:'你是从旁人口里听说的。哦，填了啊。你说。',fx:{lamps:{敛:1}}}]},
 {id:'x11',n:'替人守夜',when:function(s){return s.age>=20},text:'同门家里出了白事，托你去灯冢守一夜。',
  out:[{c:function(s){return s.attrs.men>=5},t:'你在灯冢坐了一整夜。天亮时你想明白了一件搁了很多年的事。',fx:{attrs:{men:1},lamps:{镇:1}}},
       {t:'你守到后半夜就撑不住了。你一直记得这件事。',fx:{lamps:{憾:1}}}]},
 {id:'x12',n:'一株野药',when:function(s){return s.age>=16},text:'你在崖边撞见一株没人认得的药。',
  out:[{c:function(s){return s.attrs.arc>=5},t:'你认出它是古方里的引子，卖了三个月的用度。',fx:{attrs:{coin:2}}},
       {t:'你犹豫了半天，最后没采。第二天再去，被人先摘走了。',fx:{attrs:{men:-1}}}]},
 {id:'x13',n:'外门裁役',when:function(s){return s.age>=30&&s.age<=50},text:'宗门裁撤外门差役，抽签决定去留。',
  out:[{c:function(s){return s.attrs.soc>=5},t:'有人替你说了一句话，你留下了。你第一次明白缘法比境界要紧。',fx:{attrs:{soc:1},lamps:{渡:1}}},
       {t:'你被记上了名录。卷铺盖那天，没人来送。',fx:{attrs:{coin:-1,men:-1},lamps:{游:1}}}]},
 {id:'x14',n:'旧灯重燃',when:function(s){return s.age>=30&&s.tough>=1},text:'你在旧物堆里翻出一盏早年熄掉的灯。',
  out:[{t:'你试着点了一次。灯芯焦黑，火却真的起来了。',fx:{lamps:{镇:1},attrs:{men:1}}}]},
 {id:'x15',n:'一个讨饭的孩子',when:function(s){return s.age>=25&&s.age<=60},text:'山门外蹲着一个十一二岁的小孩，饿得眼发直。',
  out:[{c:function(s){return s.attrs.coin>=4},t:'你带他吃了碗热汤面，又塞给他半块灵石。三十年后，有人在你灯冢前放下了一束野花。',fx:{attrs:{coin:-1},lamps:{继:1}}},
       {t:'你绕开了。走出去十几步你又回头，人已经不见了。',fx:{lamps:{敛:1},attrs:{men:-1}}}]},
 {id:'x16',n:'同门相争',when:function(s){return s.age>=25},text:'一个你带过的人，抢了你等了很久的差事。',
  out:[{c:function(s){return s.attrs.men>=5},t:'你没争。你只是把他叫来，把该交代的都交代了。他红着脸走了。',fx:{attrs:{men:1},lamps:{化:1}}},
       {t:'你跟他翻了脸，从此再没说过话。',fx:{attrs:{soc:-1},lamps:{憾:1}}}]},
 {id:'x17',n:'一场大雨',when:function(s){return s.age>=18},text:'你赶路时撞上百年不遇的大雨，被困在山神庙。',
  out:[{t:'你在庙里躲了一夜，听雨打瓦。天亮时你想，这辈子好像也没几回这么安静过。',fx:{attrs:{men:2}}}]},
 {id:'x18',n:'故乡来人',when:function(s){return s.age>=28},text:'一个穿旧衣的老乡找到你，说你母亲的坟头草高了。',
  out:[{c:function(s){return s.attrs.coin>=3},t:'你连夜赶回去，把坟修了，又住了一个月。',fx:{attrs:{coin:-1},lamps:{忆:1}}},
       {t:'你说等这阵忙完。老乡点点头走了。你后来一直没回去。',fx:{lamps:{憾:1},attrs:{men:-1}}}]},
 {id:'x19',n:'灯冢失火',when:function(s){return s.age>=35},text:'灯冢夜半起了火，烧了大半个山坡。',
  out:[{c:function(s){return s.attrs.vit>=6},t:'你冲进去抢出三盏旧灯，眉毛烧掉一半。',fx:{attrs:{vit:-1},lamps:{镇:1}}},
       {t:'你站在坡下看着，火映在脸上。有一盏灯，你认得。',fx:{lamps:{憾:1}}}]},
 {id:'x20',n:'一句遗言',when:function(s){return s.age>=40},text:'有人转交给你一句旧人临终前的话。',
  out:[{t:'那句话很短，你听懂了。你把灯调亮了一档。',fx:{lamps:{温:1},attrs:{men:1}}}]}
],
chapters:[
 {variants:2,t:'第一章 · 山门下的照心井',age:6,
  body:function(s){if(s.v===1)return['你的童年是从一只粗陶灯盏开始的。灯盏缺了口，祖母拿米汤糊过，糊不住，每晚还是渗油。她说这盏灯是你爹从矿上带回来的，灯芯换过三回，灯盏没换。','照心石嵌在井台正中，白天照人，夜里照灯。有一晚你被水声吵醒，爬起来看见母亲坐在井边洗她的旧衣，一件一件搓，搓完晾在石栏上。她第二天要去东海。','临走前她把你抱到井台边，让你伸手去接一捧水。水从指缝里漏光了。她说：漏了就漏了，井还在。你那时候听不懂这句话。','她走的那天，祖母只在灶上多添了一把柴。柴烧得旺，锅里的水滚了很久，到最后也没有人起身去盛。'];return ['你的童年，是一段没有尽头的石阶。',
   '照心井说是井，其实是块照心石嵌在石槽里。井水照人一生，这话传了几百年，谁也没见过谁的一生。',
   '祖母每天申时来浣纱。她从不看你，只看水。有一回她把你按到井边，说：你过来看看。你趴下去，看见水里有张小脸，还有半片云。你说那是我吗。她说：那是现在。往后的，这井装不下。',
   '父亲在矿脉上做夜工，十天半月不下山。有一回他难得回来，给你带了一只草编的蚱蜢。他不会编，是拿半袋旱烟跟人换的。父子俩对着那只蚱蜢坐了一下午，谁也没开口。',
   '后来蚱蜢让露水泡烂了。你把它埋在照心石边上，还插了根草，当碑。',
   '然后某天，母亲说宗门征调，要去东海。',
   '那天玄霜落得很密。',
   '祖母把你的手按在照心石上：别哭。你看这块石头，霜落了这么多年，什么时候干过？'];},
  choices:[
   {k:'A',t:'在霜地里追上她，攥住半幅衣袖',
    body:['你母亲蹲下来，把你的手从她衣角上一根一根掰开。她说：娘不走，你吃什么。你看着她上桥，看着桥把她的背影吃掉。',
     '你回头的时候，发现祖母一直站在石阶上，没有过来。'],
    fx:{lamps:{忆:1},attrs:{men:-1},flags:{chased:1}},hint:'忆↑｜道心↓'},
   {k:'B',t:'立在石阶尽头作揖，说照心井我来守',
    body:['你母亲没回头。她要是回了头，这双脚就迈不出山门了。你站在石阶上挥手，挥到手臂发酸才放下。',
     '那天下午你把井边的纱浣完了。纱很沉，浸了水更沉。祖母没拦你，只是把灶上的火留着，等你回来烤手。'],
    fx:{lamps:{扛:1},attrs:{men:1,vit:-1}},hint:'扛↑｜道心↑ 根骨↓'},
   {k:'C',t:'退回柴屋翻开引气诀，一个字没念进去',
    body:['你退回柴屋，翻出引气诀。那一页你背了七年，条条都熟。你盯着它看了一个下午，一个字也没念进去。',
     '天黑了，祖母在外头喊你吃饭。你答应了一声，声音很稳。'],
    fx:{lamps:{敛:1},attrs:{men:1}},hint:'敛↑｜道心↑'}
  ]},
 {variants:2,t:'第二章 · 断魂桥与测灵大典',age:15,
  body:function(s){if(s.v===1)return['测灵那日，山门外排了三百来个孩子，从断魂桥头一直排到石阶中段。执事手里一册名录、一管朱笔，点到谁的名，谁就把手按上照心石。','你前面那个孩子按上去，石面浮起一层薄青，执事在册上勾了一笔：下等灵根，入外门候补。队伍往前挪一步，石板被踩得发亮。','轮到你时，日头已经偏西。执事把你的手按在石上，等了很久，石面一直凉着。他抬头看你一眼，朱笔在册上落了三个字：无灵根。','这三个字不响，可排在后头的孩子都听见了。有人小声笑。你把手收回来，指腹上还留着石头那点凉。父亲从人堆后头挤过来，什么也没说，伸手替你拍了拍肩上的灰。'];return ['母亲隔几年回来一趟，带回来的不是糖，是东海那边的灵石碎屑，装在一只粗布袋里。你一枚也没舍得花，全压在枕下。',
   '祖母的脊背一年比一年弯，到后来浣纱要跪在石板上。她教你认字，用的是执事丢下的半本旧账簿，拿火棍在灰地上描一个，你跟着描一个。她说，字认得多了，将来进山门才不至于被人糊弄。',
   '矿脉上换主事的那几年，父亲从井下退了下来。他不再做夜工，天天坐在门口发呆。有一回你回来，看见他在井边，把一支旱烟点燃、掐灭、再点燃，反反复复。你没敢过去。他抬头看见你，把旱烟杆在膝头磕了两下，说，回来啦。',
   '去外门要过一座断魂桥。桥下常年拴着一只旧渡船，铁环锈得不成样子。桥头那盏灵石灯坏了半年，没人修。',
   '那年冬天测灵大典，执事把你的手按在照心石上，看了很久，说：无灵根。'];},
  choices:[
   {k:'A',t:'“爹，我不修了，我下矿脉换灵石去”',
    body:['你父亲把粗瓷碗摔在灶前，碎片溅进灰里。他红着眼吼：谁准你不修的？吼完又蹲下去，半晌才说，是爹没能耐，没给你留下一根灵根。'],
    fx:{lamps:{扛:1},attrs:{coin:1,arc:-1,men:1},flags:{quit_school:1}},hint:'扛↑｜灵石↑ 悟性↓｜锁死：问剑大比关闭'},
   {k:'B',t:'去外门做杂役弟子',
    body:['父亲抽完一袋旱烟才开口，说，好，咱家出一个吃宗门饭的也好。后来你在外门劈柴、挑水、扫演武场，每天把手上的茧磨厚一层。'],
    fx:{lamps:{行:1},attrs:{arc:1},flags:{tech:1}},hint:'行↑｜悟性↑'},
   {k:'C',t:'赌气说“我要进内门，进不了就不回来”',
    body:['父亲没说话。半夜你醒来，听见他压着嗓子跟母亲说：把咱家那间药庐抵了吧，孩子有出息是大事。'],
    fx:{lamps:{攀:1},attrs:{arc:1,coin:-1,men:-1}},hint:'攀↑｜悟性↑ 灵石↓ 道心↓'}
  ]},
 {variants:2,t:'第三章 · 十七岁的剑穗',age:17,
  body:function(s){if(s.v===1)return['那晚你在丹房值夜，替师父看一炉驱寒的散药。后半夜雨落在瓦上，一阵密一阵疏，炉膛里的火你续了三回。','天亮你回屋，门闩上系着一只剑穗。绳是旧的，穗子打得紧，底下压着一角淋湿的纸。字只两行：我转去别峰了。你总望着山外，到底在看什么。','你去问值门的执事。执事翻了名录，说人昨夜就随运药的云舟走了，往南。你把那张纸摊在案上晾干，折起来，夹进书里。','剑穗你没解下来，任它挂着。后来那扇门换了新的门闩，穗子还系在原来的位置，风一吹就响。'];return ['十七岁那年，你的剑鞘里多了一只剑穗。',
   '那个总在演武场回头看你的人转去了别峰，走前把它塞在你剑鞘里。你摸到它时，人已下山两日，追不上了。穗子很短，打得很好看，旁边压着一行小字：你总望着山外，到底在看什么？',
   '你没有回信的路子。那只剑穗，你系在了那本《云水杂记》的书脊上。'];},
  choices:[
   {k:'A',t:'一字未回，剑穗在鞘上系了十年',
    body:['后来你换过三把剑，穗子一直没换。有一回它断在雪里，你来回找了三遍。没找着，也就没再找。'],
    fx:{lamps:{忆:1},attrs:{men:-1}},hint:'忆↑｜道心↓'},
   {k:'B',t:'追去{ta}的别峰',
    body:['你走了一下午，找到那座别峰，站在山门口，人山人海里没有{ta}。你在灵石灯下站到天黑，灯油烧短了一截。后来你们再没碰上，可那半天翻山的路，你记了一辈子。'],
    fx:{lamps:{闯:1},attrs:{vit:1,soc:1}},hint:'闯↑｜根骨↑ 缘法↑'},
   {k:'C',t:'回了一封，托云舟捎去，又被原样退回',
    body:['信退回那天，你把它压在枕下，让那点纸上的清气陪你睡了很多年。'],
    fx:{lamps:{执:1},attrs:{arc:1}},hint:'执↑｜悟性↑'}
  ]},
 {variants:2,t:'第四章 · 下山的云舟',age:18,
  body:function(s){
    if(s.flags.quit_school)return['你到底没能站上问剑台。','同门在演武场上练剑，你背着行囊从山门绕过去，没敢抬头。','父亲送你到渡口，塞给你半块碎灵石，说，实在不行就回来。'];
    if(s.v===1)return['十八岁那年，山门放榜定在霜降前。你天没亮就醒了，屋檐下挂着一排冰棱，长短不齐，滴水滴得很慢。','问剑台那年的名额里没有你。台上的剑鸣一阵一阵传下来，你在台下的石阶上坐着，从头听到了尾。有人从台上下来，剑穗上还沾着露水。','父亲走了两日山路来看你。他在老槐树下站了半天，攥着一只粗布水囊，见你过来先递出去：先喝。他没问你比得怎么样，只说，走，回去吃饭。','回到柴屋，他把旱烟点着又掐灭，反反复复好几回。他说：想走哪条路，你自己定。家里那间药庐还在。'];return['问剑大比那年夏天，日头毒得厉害。','你站在台上，剑锋划过空气的声音，像那年井边祖母浣纱的水声。比完最后一场你走出演武场，看见父亲站在老槐树下，攥着一只水囊，看见你就赶紧递过来：解解暑。','他没有问你比得怎么样。他只说，走，回去吃饭。','后来名次出来了。你差了两分，进不了内门。','那一晚父亲抽了很多旱烟。他走进你屋里说：重考，爹供你，咱家砸锅卖铁也供你。'];
  },
  choices:[
   {k:'A',t:'再养一年灯，候下一场问剑大比',cond:function(s){return !s.flags.quit_school},lock:'你早就不在山门了，这条路已经关上',
    body:['你把自己关进没日没夜的苦修里。第二年你进了内门。榜贴出来那天，父亲把名录翻来覆去地看，看得眼睛都湿了，嘴上却说这有啥好看的。'],
    fx:{lamps:{攀:1},attrs:{arc:2,men:-1,coin:-1},years:1},hint:'攀↑｜悟性↑↑ 道心↓ 灵石↓｜耗 1 年'},
   {k:'B',t:'“爹，我走别的路，早点挣灵石”',cond:function(s){return !s.flags.quit_school},lock:'你早就不在山门了，这条路已经关上',
    body:['你背起行囊，搭上南下的云舟。靠舷的位置，对座那位老汉啃干粮的味道你记了很多年。窗外是倒退的山峰、云海、陌生的城池。云舟离地那一瞬，你攥紧了行李绳。没有人送你，也没有人拦你。'],
    fx:{lamps:{行:1},attrs:{coin:1,arc:1},flags:{south:1}},hint:'行↑｜灵石↑ 悟性↑'},
   {k:'C',t:'寻一座肯收无灵根的小派',cond:function(s){return !s.flags.quit_school},lock:'你早就不在山门了，这条路已经关上',
    body:['你挑挑拣拣，最后上了另一条云舟。舟开那一刻你回头，看见父亲站在渡口，越来越小，像井边一枚晒干了的核桃。你攥紧行囊，告诉自己一定要活出个人样。'],
    fx:{lamps:{游:1},attrs:{arc:1,soc:1,coin:-1}},hint:'游↑｜悟性↑ 缘法↑ 灵石↓'},
   {k:'A',t:'下矿脉',cond:function(s){return !!s.flags.quit_school},lock:'你还在山门里',
    body:['你跟着同乡下了矿脉。凿石的声响比演武场的剑鸣还规律。第一个月你寄回去三百灵石，附了一张纸条：我挺好的。'],
    fx:{lamps:{行:1},attrs:{coin:1,vit:-1},flags:{south:1}},hint:'行↑｜灵石↑ 根骨↓'},
   {k:'B',t:'拜炉房老师父，学一手錾剑纹',cond:function(s){return !!s.flags.quit_school},lock:'你还在山门里',
    body:['你拜了炉房的老师父学錾剑纹。他脾气坏，手却稳。三年后你能在米粒大的剑纹上落錾。'],
    fx:{lamps:{扛:1},attrs:{arc:2}},hint:'扛↑｜悟性↑↑'},
   {k:'C',t:'白日搬矿石，夜里就着灯抄经',cond:function(s){return !!s.flags.quit_school},lock:'你还在山门里',
    body:['你白天搬矿石，晚上在工棚的灯下抄经。飞虫围着灵石灯撞，你一手赶虫一手翻书。六年后你把《云水杂记》背了下来，没人知道它有多重。'],
    fx:{lamps:{攀:1},attrs:{arc:2,vit:-1,men:1},years:1},hint:'攀↑｜悟性↑↑ 根骨↓ 道心↑｜耗 1 年'}
  ]},
 {variants:2,t:'第五章 · 外城丹房与第一块灵石',age:22,
  body:function(s){if(s.v===1)return['你在外城接的第一桩活，是替一家药庐碾三个月的药。药碾子沉，一天下来手腕发抖，夜里拿不稳筷子。','结账那日，掌柜从柜台底下摸出一只粗布袋，倒出三块碎灵石，最大那块缺了个角。他拿秤称了称，说，缺角的按八成算。','你把它们揣在怀里走回巷子，一路按住袋口。巷口那盏灵石灯亮着，灯下设着一张赌摊，几个人围着喊。你绕了过去。','回到屋里，你把三块灵石摊在案上，就着窗外那点灯看。看够了，才想起该去给自己买斤米。'];return ['外城的丹房不认眼泪，只认火候。丹要是废了，你哭得再响，也没人赔你半块灵石。',
   '你在丹房后巷赁了半间屋，墙皮是炉灰熏的，一张板床、一张旧案、一扇朝北的窗。巷口那盏灵石灯每晚准时亮，灯芯是宗门发的次品，可它是这条巷子里唯一肯陪你的东西。',
   '头一份差事是守炉：添炭、看火、抄方子，十二个时辰里只睡两个时辰，耳朵还竖着听炉里的响动。头一笔灵石到手，三块碎的，用草纸裹着。你把它们摊在案上看了半宿，头一回觉出自己站住了。',
   '你托云舟捎了信回山门。祖母让人回话：我孙儿瘦了。你回：没有，是长高了。信的末尾多出一行外人的字：灵石留着自己用，别在丹房里饿着肚子。后来你才知道，那是师父添的。'];},
  choices:[
   {k:'A',t:'头一笔灵石劈成两半，一半托人捎回',
    body:['祖母托人带话，说你乱花。信的末尾又是师父的字：留着，别省。就是这几个字，让你在云舟上一直看着舷外的云，没敢回头。'],
    fx:{lamps:{扛:1},attrs:{coin:-1,men:1}},hint:'扛↑｜灵石↓ 道心↑'},
   {k:'B',t:'全押在自己身上，换一炉上品丹方',
    body:['你把灵石全押在自己身上。后来那一手控火的功夫，成了你一生吃饭的本事。你偶尔想起祖母拿火棍在灰地上教你的那些字，一个也没白认。'],
    fx:{lamps:{行:1},attrs:{arc:2}},hint:'行↑｜悟性↑↑'},
   {k:'C',t:'在丹房后巷摆一桌，请同门喝酒',
    body:['你头一回尝到人情往来的甜和重。那顿酒大家喝得高兴，笑声快把丹房的屋顶掀了。你这才明白，在外城扎下根，光守得住炉子不够，还得靠一张笑脸搭起来的渡口。'],
    fx:{lamps:{渡:1},attrs:{soc:2,coin:-1}},hint:'渡↑｜缘法↑↑ 灵石↓'}
  ]},
 {variants:2,t:'第六章 · 那盏没续上的灯',age:28,
  body:function(s){if(s.v===1)return['报信的是个小师弟，半夜拍你的门，鞋上全是泥。他说山门递了急讯来，师父的灯只剩一寸油，人还撑着，不肯用药。','你赶到山门是第三日午后。师父半靠在榻上，榻边那盏本命灯罩着布，光从布里漏出来，一小片，落在墙上。','他见了你，先问炉子。你说炉子有人看着。他哦了一声，说那就好。之后就闭上眼，不再多说一句。','夜里他睡得浅。你替他掖被角时，摸到枕下压着一张旧纸：一个年轻人站在照心井边，灯龛在侧，身后落着霜。你没敢动它。'];return ['你与人结契了。{ta}在邻巷的丹房做事，笑起来眼角弯弯的。你们把外城的巷子走过一遍又一遍，灵石有一小半都换了新出的灵果。你以为日子会一直这样亮下去。',
   '后来山门捎信来：师父的灯要枯了。不是伤，是灯芯烧到了尽头；他这一生只养一个执念，养到油干。你赶回去，见他躺在榻上，人瘦成一把骨头，见了你还笑，说小毛病，别耽搁你那口炉子。',
   '你在山中守了几日。最后一晚，师父把你唤到榻前，从枕下摸出一样东西：一枚烧得半焦的灯芯，用草纸裹着，旁边压着一张旧纸。纸上年轻的他站在照心井边，灯龛在侧，身后是霜。',
   '他说：我这一生没给你留别的，就留一句。灯要照得远，先得自己站得稳。你拿去吧，别学我，把话攒到最后才说。'];},
  choices:[
   {k:'A',t:'先回山门守着那盏灯，丹房托给同门',
    body:['你在山门多守了两旬。那两旬你替他添灯油、给他念早年抄下的丹方、扶他到静室外头晒日头。后来你总说，那是你这一生最好的两旬。'],
    fx:{lamps:{镇:1},attrs:{coin:-1,men:1},flags:{father_stay:1}},hint:'镇↑｜灵石↓ 道心↑'},
   {k:'B',t:'连夜赶回丹房，说这炉丹炼完就归',
    body:['这一炉炼了很久。后来山门来讯，说师父的灯灭了。你赶回山门时，榻边只剩一截冷芯，人已经走了两日。你跪在灯冢前想喊一声师父，喉咙里只出来半句。'],
    fx:{lamps:{憾:2},attrs:{men:-1},flags:{no_goodbye:1}},hint:'憾↑↑｜道心↓｜不可逆：第七章与第十章全部改写'},
   {k:'C',t:'把丹房的差事交还，回山守灯到底',cond:function(s){return s.attrs.coin>=2},lock:'你拿不出交还差事的底气（灵石不足 2）',
    body:['同门说你傻。你说，丹房的差事没了还能再找，师父只这一个。你替他把最后那段灯油续完，他走的时候，灯芯是稳的。后来你慢慢补上了那笔亏空，重新上路。'],
    fx:{lamps:{燃:2},attrs:{coin:-2,men:2},flags:{father_stay:1,quit_job:1}},hint:'燃↑↑｜灵石↓↓ 道心↑↑'},
   {k:'D',t:'不再强冲瓶颈，改温养经脉',
    body:['你把那股冲劲压下来，改为日日温养。同门笑你慢，你不辩解。三个月后，你的气反而稳了。'],
    fx:{lamps:{守:1},attrs:{vit:2,men:1}},years:2,hint:'守↑｜体魄↑↑ 心力↑｜寿 +2'}
  ]},
 {variants:2,t:'第七章 · 灯冢前的长明灯',age:29,
  body:function(s){
    if(s.flags.no_goodbye)return['师父灯灭的那年冬天，山门又落了一场玄霜，像极了你出生那年。','你在灯冢里守了一夜。你想得最多的不是他那句“灯要照得远”，而是你最后一次见他时，你说弟子走了，他说去吧，你连头都没回。','他最后想说什么，你再没处问了。他留下的那张旧纸，边角让你攥得起了毛。','冢里那盏长明灯，灯油是你一寸一寸续上去的。'];
    if(s.v===1)return['灯冢在山背阴的一面，无风也凉。七层灯架都是石头凿的，一层搁一世的灯，旧灯多半只剩半截芯。','守夜的人要做两件事：给架上的灯添油，把烧尽的芯挑出来，装进一只粗陶罐。罐子满了，就埋在后坡。','你守到后半夜，山里的雾漫上来，把灯架下头那几格都淹了。你就着上头那几盏灯，把师父那盏从头擦了一遍。','天快亮时，山下第一声钟响，架上有一盏灯自己矮了下去，没灭，只是矮了。你把剩下的油分给了旁边几盏。'];return['师父灯灭的那年冬天，山门又落了一场玄霜，像极了你出生那年。','你在灯冢里守了一夜。你想起他第一次把你从外门柴房里叫出来，想起他把一盏次品的灵石灯塞进你行囊，想起他在你手背上写下的“照远”二字。','你到这时候才明白，他这一生只教过你一件事：灯要亮，先得自己站得稳。','你把他的本命灯从架上接下来，续到了天明。'];
  },
  choices:[
   {k:'A',t:'把那盏没续上的灯，收进匣子里',
    body:function(s){return s.flags.no_goodbye?['很多年后你打开那个匣子，灯芯早潮了。你对着它站了很久，想说师父我挺好的，最后只说了半句——这话本该说给他听，而不是说给一盏冷灯。']:['很多年后你打开那个匣子，灯芯早潮了。你对着它说：师父，我挺好的。']},
    fx:function(s){return s.flags.no_goodbye?{lamps:{忆:1,憾:1},attrs:{men:-1}}:{lamps:{忆:1}}},
    hint:'忆↑（若未告别：同时憾↑ 道心↓）'},
   {k:'B',t:'把师父的本命灯，挂上洞府最高那格',
    body:['每天下山前你抬头看一眼。你说，师父，弟子去了。说得跟他在的时候一样，没人应，你也照说。'],
    fx:{lamps:{继:1}},hint:'继↑'},
   {k:'C',t:'不收灯也不挂灯，让那点火自己走',
    body:['你把他记在心里，连同那晚的霜、井边的水、桥头的灯。有些人不必留遗物，他已经长进你的灯芯里。'],
    fx:{lamps:{化:1}},hint:'化↑'}
  ]},
 {variants:2,t:'第八章 · 四十岁的道基崩',age:40,
  body:function(s){if(s.v===1)return['四十岁那年秋天，内门议事的钟敲了三下。你走进戒律堂时，堂上那册名录正摊着，执事的笔停在你的名字上头。','他们说你的道基是从根上塌的，按例除名，腰牌当日收回。你解下腰牌搁在案上，玉面上有一道细纹，是你自己这些年磕出来的。','出门时天阴着。{ta}站在台阶底下等你，手里拎着你的旧行囊，什么也没问，只说：山下的面馆还开着。','回去那条巷子你走过十年。今晚巷口的灵石灯早亮了一刻，照着摊子上没收的竹筐，筐里的菜叶上还挂着水。'];return ['四十岁那年，你的道基崩了。',
   '不是伤，是走火，是苦修二十年那一关从根上塌了。宗门按例把你的名字从内门名录上划掉，腰牌当日收回；交出去的时候，你指腹上还留着那块玉的形状。你连火都没发，只在丹房门口站了半炷香，看着那口守了十年的炉子。',
   '欠宗门的那笔账还安静躺在传讯册上。你总得给自己另找一条路。三十五是第一堵墙，四十是另一堵更高的墙。你学会了一个新本事：在外门执事面前，把“我道基崩了”说成“我有二十年的炉火功夫”。',
   '{ta}说：要不，我们回山门吧。',
   '你站在窗边，看着巷口那盏陪了你很多年的灵石灯。它还在亮。'];},
  choices:[
   {k:'A',t:'散功重修',cond:function(s){return s.attrs.arc>=5},lock:'悟性不足 5：你的底子撑不起一次散功',
    body:['你从头练起，像十五岁那年重新扎马步。数不清熄了多少回灯，又一回回点着。后来你的灯重新亮起来，比从前矮一截，可是稳。{ta}问你悔不悔，你说，不悔，灯芯烧断了可以再接。'],
    fx:{lamps:{行:1,攀:1},attrs:{arc:2,men:-1,coin:-1},flags:{fired:1}},hint:'行↑ 攀↑｜悟性↑↑ 道心↓ 灵石↓'},
   {k:'B',t:'带上道侣和行囊，回山门接一份差役',cond:function(s){return s.lamps['忆']>=1||s.flags.father_stay},lock:'你早已无根可回（忆未亮、也没陪过父亲）',
    body:['山门还在，照心井填了，石阶还在。你接手了师父留下的药庐，补了屋顶住下来，每天沿断魂桥走一段，跟旧日的执事点头。你走遍过许多座城，末了想回的，还是那口填了的井边。'],
    fx:{lamps:{返:1},attrs:{men:2,coin:-1},flags:{fired:1,back_home:1}},hint:'返↑｜道心↑↑ 灵石↓'},
   {k:'C',t:'不领山门的腰牌，也不离这片云海',
    body:['你开始接零散的活计，今年在南山，明年在北泽。你常年在路上，看过很多座城的夜。你偶尔想起师父那句“灯要照得远”，才明白自己一直在追一个“远”字，追到连落脚的地方都没给自己留。'],
    fx:{lamps:{逐:1,镇:-1},attrs:{soc:-1,coin:1},flags:{fired:1}},hint:'逐↑ 镇↓｜缘法↓ 灵石↑｜韧度 +1'},
   {k:'D',t:'花灵石换一炉养元的丹',
    body:['丹炉开的时候药香漫了半个院子。你把灵石数了三遍，还是买了。这一炉下去，你觉得自己又长回来一点。'],
    fx:{lamps:{暖:1},attrs:{vit:2,coin:-2}},years:3,hint:'暖↑｜体魄↑↑ 灵石↓↓｜寿 +3'}
  ]},
 {variants:2,t:'第九章 · 子时的丹房',age:45,
  body:function(s){if(s.v===1)return['结契百年，你们把两座洞府并成了一座。东西各一间静室，中间那间摆着香炉，谁的蒲团都隔着一臂远。','入冬她闭关。你在洞外替她看着护山阵，一守就是四十九日。阵眼上那盏灯油尽了三次，你添了三次。','出关那日她比上回见时瘦了一圈，剑却磨得发亮。你们隔着一炉香对坐，她说这一关过得险。你手里有句话，搁了百年。','炉里的香烧到一半，那缕烟直直地升上洞顶，又散开。你们隔着香炉坐着，谁也没先开口。'];return ['结契百年，你们各自有了洞府。修道的人不说恩爱，只说同参。',
   '她的剑意越来越利，你的丹火越来越沉。同一个道场打坐，隔着一炉香，谁也不肯先收功。',
   '子时，丹炉将熄。你没有续火，反倒起身，从柜底翻出一对粗陶茶盏，是结契那年在外城摊子上买的，一只缺了角。',
   '你煮了茶，推到她那一侧。她睁眼，看了那只缺角的盏很久，没喝。她说，你还留着。你说，留着。当年半句没说完的话，你借着炉火说完。',
   '炉火是在你说完的时候灭的。茶也凉了。她始终没喝，可也没有起身走。'];},
  choices:[
   {k:'A',t:'先收自己的功，去洞外替她调阵',cond:function(s){return s.attrs.men>=4},lock:'道心不足 4：你连自己都撑不住，顾不上别人',
    body:['你不再催她收功。她闭关，你就在洞外把护山阵调好；她出关，你就备好温水净面。这些事你从前嫌琐碎。她后来对旁人说：他这人笨，可靠得住。'],
    fx:{lamps:{温:1},attrs:{soc:1,men:1}},hint:'温↑｜缘法↑ 道心↑'},
   {k:'B',t:'把压了百年的委屈，对着炉火剖开',cond:function(s){return s.attrs.men>=5||s.lamps['剖']>=1},lock:'道心不足 5：这些话你还是说不出口',
    body:['你把压了百年的东西剖开：师父灯灭那日你没敢哭、道基崩时你在崖底躺了三天、她每次闭关你在洞外守着一盏灯。她说，你早该同我说。你两个人都没再端着。'],
    fx:{lamps:{剖:1},attrs:{men:1,soc:1}},hint:'剖↑｜道心↑ 缘法↑'},
   {k:'C',t:'茶盏推到炉边，话到嘴边又咽回去',
    body:['茶盏递到一半，话又咽下。你们同参又参了百年，各守各的炉，各养各的剑。道场不小，中间那尊香炉，谁的蒲团都够不着。'],
    fx:{lamps:{镇:-1},attrs:{men:-1}},hint:'镇↓（灯暗一档）｜道心↓'}
  ]},
 {variants:2,t:'第十章 · 师娘的残念',age:52,
  body:function(s){if(s.v===1)return['师娘的神念是先从名字上散的。先是记不住同辈谁是谁，后来连去药庐该走哪条路也说不准了。','有一回你去看她，她正蹲在药庐门口择药，抬头看你一眼，喊了一声师父的名字。你应了。她就把择好的那半把药塞给你，让你带走。','你走的时候她送到门口，说：下回来把袖子上的泥拍干净，你年轻时候最不爱干净。她说的是师父。','你走出半里地又回头，她还站在门口，手搭在门框上，眼睛望着路口，像在等一个再也不会来的人。'];return ['师娘老了。照心井早填了，上头盖了新石，她还天天去，就坐在那块石头上，一坐一个下午。',
   '她的神念开始散。有一回她端着碗停了手，问：你是谁家的后生？你说：是我，你一手带大的，你连'+'{name}'+'都不记得了？她似懂非懂地点头，隔一阵，又问一遍。',
   '她忘了很多人，却还记得你怕黑，记得在你住过的那间厢房里替你留一盏灯，灯芯拨得短短的，怕费油。',
   '你这才看清，当年在霜夜里替你掖过被角的那个人，如今要你弯下腰替她掖了，手还得放轻。'];},
  choices:[
   {k:'A',t:'把师娘接进洞府，替她守一盏灯',cond:function(s){return s.attrs.coin>=3},lock:'灵石不足 3：你连一间多余的屋子都腾不出',
    body:['洞府里多了一个要人照看的人。你学着给她煎药、梳头、换衣裳。她夜里常常醒，说屋里黑。你就在她床头留一盏小灯，一夜不吹，让它自己烧到天亮。'],
    fx:{lamps:{镇:1,燃:1},attrs:{coin:-1,vit:-1,men:1}},hint:'镇↑ 燃↑｜灵石↓ 根骨↓ 道心↑'},
   {k:'B',t:'每月朔日下山，为师娘续一回灯油',cond:function(s){return s.attrs.men>=4},lock:'道心不足 4：你连每月一趟都撑不下来',
    body:['你成了山门的常客，成了那间药庐的常客。同门都说你有良心。只有你自己知道，你是在补一桩旧账：师父那盏没续上的灯，你想在师娘身上把它点上。'],
    fx:{lamps:{憾:-1,燃:1},attrs:{men:1}},hint:'憾→燃（灯·转化）｜道心↑'},
   {k:'C',t:'总说闭关要紧，出关就下山看她',
    body:['你托人捎话，她让人回：你忙你的，师娘好着呢。你收了那句话，心里空了一块。等你这炉丹炼完赶回去，她已经认不出你，只攥着你的袖子不撒手。那天夜里你睡在药庐，半夜她起来，给你掖了掖被角。'],
    fx:{lamps:{憾:2,镇:-1},attrs:{men:-1}},hint:'憾↑↑ 镇↓｜道心↓｜韧度 +1'}
  ]},
 {variants:2,t:'第十一章 · 山巅的静室',age:60,
  body:function(s){if(s.v===1)return['静室只有一扇窗，糊的是旧窗纸。你进来头一件事是把窗纸换成厚的，外头的光进来只剩一层白。','没有日月，你就在墙上刻道子记日子。刻到第七排你不再刻了，山下的人自会按时送米来。','你把这些年攒下的东西一件件摊开：一只断掉的剑穗、一枚烧得半焦的灯芯、一张旧纸、几片干叶子。摆满了一张案。','山下的钟一天响两回。你听着钟声把那些东西又一件件收回去，收的动作比摊开时慢得多。'];return ['你把山门的差事交了出去，退进山巅那间静室，闭了长关。这一关闭了多久，你自己也没数。',
   '门一闩上，外头的声气就断了。你坐了很久，才想起这些年并没有谁会来叩这扇门，也想起自己从前从没等过谁。',
   '你把静室扫了一遍，自己起炉煮了壶粗茶。茶煮老了，苦。你想起师娘从前总说你手笨，说你连火候都看不准。',
   '你坐到窗边，看山下的新弟子练剑、追打、喊叫。你想起你也曾是这样的小孩，在照心石边拨水，把青石板溅得星星点点。',
   '你打开那个旧匣子。里面有：一只断掉的剑穗、一枚烧得半焦的灯芯、一张泛黄的旧纸，还有十几张旧舟票，几片干枯的叶子。',
   '灯照到的地方，就这么多。'];},
  choices:[
   {k:'A',t:'摊开这一生的旧物，落笔成灯谱',cond:function(s){return s.attrs.arc>=6},lock:'悟性不足 6：你想写，却不知道从哪一句起头',
    body:['照心井、石阶、断魂桥、玄霜、云舟、子时那盏茶，你都写进去。末页你落笔：我这一生点过许多灯，也亲手熄过几盏；愿读到此处的人，夜里都有人替他留灯。'],
    fx:{lamps:{继:2},attrs:{arc:1},flags:{wrote_book:1}},hint:'继↑↑｜悟性↑｜解锁第十二章 B'},
   {k:'B',t:'与剩下那几个老友，按月对坐论道',cond:function(s){return s.attrs.soc>=4},lock:'缘法不足 4：你翻遍传讯册，找不到一个能发的名字',
    body:['你们坐在断魂桥头，看云海，讲旧事。有人耳朵已经背了，听不清就跟着别人笑。散的时候你们说，下一世还投同一座山门。'],
    fx:{lamps:{渡:1},attrs:{men:1}},hint:'渡↑｜道心↑'},
   {k:'C',t:'合上木匣搁在枕边，一句不写',
    body:['你只是每天睡前把匣子打开一会儿，再合上。像替这一生一页一页往回翻，翻到哪一页停住，你自己也说不清。'],
    fx:{lamps:{忆:1}},hint:'忆↑'},
   {k:'D',t:'放下争胜的心，在山里养灯',
    body:['你把灯挪到背风的地方，日日添油。山里的日子慢，慢到你能数清每一片落下来的叶子。'],
    fx:{lamps:{归:1},attrs:{vit:2,men:2}},years:3,hint:'归↑｜体魄↑↑ 心力↑↑｜寿 +3'}
  ]},
 {variants:2,t:'第十二章 · 最后一场玄霜',age:78,
  body:function(s){if(s.v===1)return['你走那日，药庐外头落着细霜。檐角挂着一盏旧灯，是师娘当年留下的，油只剩底上一层。','守在你榻边的是山门派来的小弟子，十四五岁，手脚笨，把你的被角掖了三回。你让他把灯芯拨短一些，省油。','你把眼睛闭上又睁开。窗纸外头有脚步声，是新入门的孩子在扫阶前的霜，扫帚一下一下，一直扫到断魂桥那头。','那盏旧灯烧到最后，火苗矮下去，罩子上结的霜化出一圈水，顺着灯盏流到案上，积了一小汪。'];return ['你走的那天，落着小玄霜，像极了你出生那年。',
   '你躺在榻上，透过窗看见霜落在药庐的檐角、落在青石阶、落在远处的断魂桥。你恍惚看见许多个自己：霜夜的婴儿、井边的孩子、云舟上靠舷的年轻人、丹房外转身的中年人、窗边煮茶的老人。',
   '他们都不说话，只是站在那里看你。',
   '你想再点一次灯。指尖抬起来，又落下。',
   '窗外，好像有人给一盏灵石灯，轻轻罩上了一个罩子，免得霜把它打灭。'];},
  choices:[
   {k:'A',t:'用最后一丝灵力，给名录上的人传句话',cond:function(s){return s.attrs.soc>=3},lock:'缘法不足 3：你已经想不起该传给谁',
    body:['你用最后一点力气给每个人传了讯，说我挺好的，你们好好的。那头的人不知道，这一句挺好的，是告别。'],
    fx:{lamps:{继:1}},hint:'继↑'},
   {k:'B',t:'把那一卷灯谱，压在照心石下',cond:function(s){return !!s.flags.wrote_book},lock:'你这一生没有留下只言片语',
    body:['你留下了那一卷灯谱。后来有人在深夜的灯下读到那句“我这一生点过许多灯，也亲手熄过几盏”，坐了很久，座前的灯芯烧短了一截。'],
    fx:{lamps:{继:2}},hint:'继↑↑'},
   {k:'C',t:'推开一线窗，让玄霜自己落进来',
    body:['你抬手把窗推开一线，让霜光落进来。然后你闭上眼，灯自己矮下去，像一场走了很久的夜路，终于到了地方。'],
    fx:{lamps:{返:2}},hint:'返↑↑'}
  ]}
],
endings:function(ctx){
  var L=ctx.lamps,A=ctx.attrs;
  var core=sumLamps(L);
  if(L['忆']>=2&&L['扛']>=2&&L['行']>=2&&L['燃']>=2&&L['继']>=2&&L['返']>=2&&L['温']>=2)
    return mkEnd('点亮万盏灯','hidden','你这一生太完整，完整到后来山门里的孩子都听过你的名字。可你自己知道，你只是每一回都选了那个更难一点的选项。',ctx);
  if(ctx.tough>=3) return mkEnd('九死未悔','hidden','你的灯被掐灭过很多次。每一次你都以为这回是真的完了。可灯芯这东西，灭了还能再点着。你点了很多很多次。',ctx);
  if(A.coin>=8&&core<=14) return mkEnd('金灯无芯','special','你最后什么都有了：洞府、灵石、内门的腰牌。只是夜里灯太亮，亮得你看不清任何一张脸。你不缺灯，你缺的是灯底下坐着的人。',ctx);
  if(A.soc<=1&&core>=12) return mkEnd('独照','special','你几乎没让任何人真正走近过。你把自己活成了桥头那盏灵石灯：照过很多人，谁也没上过你的山。',ctx);
  if(L['返']>=3&&(L['憾']||0)<=0) return mkEnd('玄霜无声','special','你回到那口填了的井边，坐在青石阶上，什么也不想。你欠山门的还清了，山门欠你的，你不打算要了。霜落下来，没有声音。',ctx);
  var b=ctx.bucket;
  if(b==='chuan')    return mkEnd('传灯者','normal','你的灯早灭了，还有人在夜里读你留下的那一卷。灯换了一盏又一盏，火还是那一点火。',ctx);
  if(b==='zhideng')  return mkEnd('执灯人','normal','你这一生没修成什么惊天动地的境界，可你守住了该守的人。石阶上的烟火里，你的灯最亮，也最安稳。',ctx);
  if(b==='yuanxing') return mkEnd('点灯的远行者','normal','当年那个被照心石判为无灵根的孩子，一路逆风，走得很远。你走过的路后来成了别人的路标。',ctx);
  if(b==='guntang')  return mkEnd('滚烫的人','normal','你从没真的停下来过。别人说你折腾，你自己知道，你只是不愿意凉。',ctx);
  if(b==='shoudeng') return mkEnd('守灯的人','normal','你没有把谁照亮成太阳，你只是让身边的人，在关键时刻没黑着。寻常日子被你过成了道。',ctx);
  if(b==='quejiao')  return mkEnd('缺一角的灯','normal','你这一生有太多话没说出口。到最后你跟那些遗憾坐在同一张石桌前，各自喝了一盏，谁也没提当年。',ctx);
  return mkEnd('灯与玄霜','normal','你一直在找归处。找了很多年才发现，归处不在内门，在你出发的那场玄霜里。',ctx);
},
epitaph:function(ctx){
  var m=ctx.main;
  var pool={
    '燃':['爹，我挺好的。','这一回，我没迟到。'],
    '忆':['有些话没说完，就说给岁月了。'],
    '憾':['来日方长，敌不过一句等我回来。'],
    '行':['人生是一条航路，我踩上去了，就没下来。'],
    '返':['走遍千山万水，还是那口井边。'],
    '继':['这一生我点过很多灯，也熄过几盏。'],
    '镇':['有些好东西留不住，所以要在手边时看够它。'],
    '温':['日子不是熬出来的，是修出来的。'],
    '执':['我用很长时间记得一个人。这是福，也是劫。'],
    '攀':['我踩着全家人的肩膀，够到了高处。']
  };
  return pick(pool[m]||['这一局，我尽力了。']);
}
};

events:[
 {id:'m23',n:'腊月里点不起灯油',when:function(s){return s.age>=6&&s.age<=14},text:'腊月里油贵，罐子见了底。天黑透了，门灯还黑着，对门的帘子掀了两回。',out:[{c:function(s){return s.attrs.vit>=4},t:'你顶着风去煤厂门口替人卸了半宿车，换回小半瓶油。灯点上的时候，对门的帘子放下了。',fx:{attrs:{vit:1},lamps:{挑:1}}},{c:function(s){return s.attrs.arc>=4},t:'你剪短一截灯芯，又拿旧碗翻了个罩子，火苗小了一半，倒也能亮到半夜。',fx:{attrs:{arc:1},lamps:{看:1}}},{t:'你把灯吹了，一家人在黑里喝完那锅腊八粥。第二天上学，你绕开了对门的门口。',fx:{attrs:{men:-1},lamps:{咽:1}}}],choices:[{k:'A',t:"你顶着风去煤厂门口替人卸了半宿车，换回小半瓶油。灯点上的时候，对门的帘子放下了。",fx:{"lamps":{"挑":1},"attrs":{"vit":1}}},{k:'B',t:"你剪短一截灯芯，又拿旧碗翻了个罩子，火苗小了一半，倒也能亮到半夜。",fx:{"lamps":{"看":1},"attrs":{"arc":1}}}]},
 {id:'m24',n:'保长来查户口',when:function(s){return s.age>=6&&s.age<=16},text:'保长夹着册子挨门挨户点人头，进门先看灯，再问家里几口人。你爹出车还没回来。',out:[{c:function(s){return s.attrs.men>=5},t:'你站在门口一句一句答得稳，说爹在货场，夜里就回。保长把册子合上，说这户有人。',fx:{attrs:{men:1},lamps:{直:1}}},{c:function(s){return s.attrs.soc>=4},t:'隔壁的裁缝师傅隔着墙替你搭了句话，说这家的孩子他从小看着长大。保长笑了一声，走了。',fx:{attrs:{soc:1},lamps:{引:1}}},{t:'你越答越急，话没答圆。保长在本子上打了个勾，说回头再来。那盏门灯，你点到了半夜。',fx:{attrs:{men:-1},lamps:{赊:1}}}],choices:[{k:'A',t:"你站在门口一句一句答得稳，说爹在货场，夜里就回。保长把册子合上，说这户有人。",fx:{"lamps":{"直":1},"attrs":{"men":1}}},{k:'B',t:"隔壁的裁缝师傅隔着墙替你搭了句话，说这家的孩子他从小看着长大。保长笑了一声，走了。",fx:{"lamps":{"引":1},"attrs":{"soc":1}}}]},
 {id:'m25',n:'胡同口死了人',when:function(s){return s.age>=8&&s.age<=18},text:'天没亮，胡同口围了一圈人。倒在那儿的是个拉车的，没人认得他，巡警说等人来领。',out:[{c:function(s){return s.attrs.arc>=5},t:'你回家取了纸笔，把他的车号、衣裳、倒下的地方都记下来，贴在他车把上。三天后有人哭着找来了。',fx:{attrs:{arc:1},lamps:{看:1}}},{c:function(s){return s.attrs.coin>=3},t:'你掏出几个铜板，跟街坊凑了一领席子把他盖上。巡警看了你一眼，没说什么。',fx:{attrs:{coin:-1},lamps:{同:1}}},{t:'你挤在人缝里看了一眼就走了。那天上午的课，你一个字也没听进去。',fx:{attrs:{men:-1},lamps:{咽:1}}}]},
 {id:'m26',n:'学堂先生被带走',when:function(s){return s.age>=10&&s.age<=18},text:'第二节课没上成。先生正讲到一半，两个穿黑衣裳的人站在门口等他。',out:[{c:function(s){return s.attrs.arc>=5},t:'你把先生落在讲台上的那本书揣进怀里，绕了三条胡同送到他家门口。他媳妇接过去的时候手在抖。',fx:{attrs:{arc:1},lamps:{直:1}}},{c:function(s){return s.attrs.soc>=4},t:'你托一个在东交民巷当差的远亲打听了一句。回话说人没事，过些日子能出来。你把这话告诉了全班。',fx:{attrs:{soc:1},lamps:{引:1}}},{t:'你把课本上先生写过字的那一页折了个角，这件事没跟任何人提。',fx:{attrs:{men:-1},lamps:{咽:1}}}]},
 {id:'m27',n:'一袋杂合面',when:function(s){return s.age>=6&&s.age<=14},text:'祖母从粮店背回半袋杂合面，里头掺着麸子和豆饼。她说，掺着吃，能吃到开春。',out:[{c:function(s){return s.attrs.vit>=5},t:'你和弟弟去城外挖了两筐野菜，回来剁碎和在面里。那一锅窝头，比纯面的还香。',fx:{attrs:{vit:1},lamps:{拼:1}}},{c:function(s){return s.attrs.arc>=4},t:'你翻出旧账本算了一遍，把家里一天能吃多少写在墙上。祖母照着那道线舀面，一勺都没多。',fx:{attrs:{arc:1},lamps:{看:1}}},{t:'你恨那袋面。趁没人，你把手里的窝头掰了一半塞进墙缝，第二天被老鼠拖走了。',fx:{attrs:{men:-1},lamps:{咽:1}}}]},
 {id:'m28',n:'替人写状纸',when:function(s){return s.age>=12&&s.age<=18},text:'街口修鞋的老周被人讹了一笔，说要告状，可他这辈子没写过自己的名字。',out:[{c:function(s){return s.attrs.arc>=5},t:'你替他把状纸写了，一条一条，写得清楚。递上去那天，老周在你家门口搁了一双新纳的鞋底。',fx:{attrs:{arc:1},lamps:{直:1}}},{c:function(s){return s.attrs.soc>=4},t:'你想起国文先生认得衙门口的人，领着老周去求了一趟。事情压下去了，没闹到公堂上。',fx:{attrs:{soc:1},lamps:{引:1}}},{t:'你说自己笔拙，写不了。老周把纸卷起来揣回怀里，说声算了。你看着他拖着鞋走了。',fx:{attrs:{men:-1},lamps:{赊:1}}}]},
 {id:'m29',n:'津浦线上的逃难人',when:function(s){return s.age>=8&&s.age<=18},text:'车站墙根下蹲着一家子，说是从南边来的，行李只剩两只柳条箱。女人怀里抱着个比你小的孩子。',out:[{c:function(s){return s.attrs.coin>=3},t:'你跑回家端了半锅粥出来。祖母追到门口，没骂你，回屋又往锅里添了一勺。',fx:{attrs:{coin:-1},lamps:{温:1}}},{c:function(s){return s.attrs.men>=5},t:'你把他们领到庙里的廊下避风，又去井台打了一桶水。第二天他们走的时候，那女人朝你弯了弯腰。',fx:{attrs:{men:1},lamps:{同:1}}},{t:'你贴着墙根走过去了。走出半条街，你回头看了一次，又接着往前走。',fx:{attrs:{men:-1},lamps:{咽:1}}}]},
 {id:'m30',n:'老娘把当票缝进棉袄',when:function(s){return s.age>=10&&s.age<=18},text:'母亲拆开你那件旧棉袄的里子，把几张当票叠好塞进去，又一针一针缝上。她说，这衣裳比箱子牢。',out:[{c:function(s){return s.attrs.arc>=4},t:'你把当铺的名字和票上的号记在心里，没写在纸上。过了很多年，你还念得出来。',fx:{attrs:{arc:1},lamps:{等:1}}},{c:function(s){return s.attrs.men>=5},t:'你什么也没问，把棉袄接过来，替她把线头咬断了。',fx:{attrs:{men:1},lamps:{温:1}}},{t:'你偷偷拆开看过一回，又照原样缝回去，针脚比原先歪。母亲什么也没说。',fx:{attrs:{men:-1},lamps:{问:1}}}]},
 {id:'m0a',n:'胡同一场架',when:function(s){return s.age>=6&&s.age<=16},text:'隔壁胡同的孩子把你们的水桶踢翻了，两边的人在井台前对峙。',
  out:[{c:function(s){return s.attrs.vit>=4},t:'你先动的手。打完两拨人都挂了彩，可那桶水是你重新打满提回去的。',fx:{attrs:{vit:1},lamps:{拼:1}}},
       {t:'你把桶扶起来，拉着弟弟回家。母亲问起胳膊上的青，你说是自己撞的。',fx:{attrs:{men:1},lamps:{咽:1}}}]},
 {id:'m0b',n:'走失的一只羊',when:function(s){return s.age>=6&&s.age<=16},text:'邻居家唯一那只羊丢了，一胡同的人分头去找。',
  out:[{c:function(s){return s.attrs.arc>=4},t:'你顺着蹄印摸到城外的沟里，把它牵了回来。邻居当晚给你家端来一碗白面。',fx:{attrs:{arc:1},lamps:{寻:1}}},
       {t:'你走到城墙根就天黑了，回来时院里已经点灯。羊第二天自己回来了。',fx:{attrs:{men:1},lamps:{问:1}}}]},
 {id:'m1',n:'车上遇险',when:function(s){return s.age>=16&&s.age<=45},text:'你在货场撞上一列溜车，人被挤在两节车厢中间。',
  out:[{c:function(s){return s.attrs.vit>=6},t:'你翻身滚进道沟，还拽了旁边一个学徒。老工头说，你小子命硬。',fx:{attrs:{men:1}}},
       {t:'你被压断了小指，从此少半截。工钱还是那些。',fx:{attrs:{vit:-1,coin:-1}}}]},
 {id:'m2',n:'屋顶漏雪',when:function(s){return s.age>=18},
  out:[{c:function(s){return s.attrs.coin>=3},t:'你寄钱回去，请人翻了屋顶。母亲托人回话，说不漏了。',fx:{attrs:{coin:-1},lamps:{问:1}}},
       {t:'你只寄得出一半。母亲说不漏了。你后来才知道，她拿瓦盆在堂屋接了半个冬天。',fx:{attrs:{men:-1},lamps:{赊:1}}}]},
 {id:'m3',n:'旧友借钱',when:function(s){return s.age>=22},
  out:[{c:function(s){return s.attrs.soc>=4},t:'你借了。两年后他翻倍还你，还带来一条路子。',fx:{attrs:{soc:1,coin:1},lamps:{引:1}}},
       {t:'你说自己也紧。对面沉默了一下，说无妨。后来就再没下文了。',fx:{attrs:{soc:-1}}}]},
 {id:'m4',n:'一场伤寒',when:function(s){return s.age>=18&&s.age<=55},
  out:[{c:function(s){return s.attrs.vit>=5},t:'烧到四十度，躺了一天，出了身汗，好了。',fx:{attrs:{vit:1}}},
       {t:'烧了三天。你没舍得歇，怕误工。病拖成了老病根。',fx:{attrs:{vit:-1,men:-1}}}]},
 {id:'m5',n:'一句话',when:function(s){return s.attrs.arc>=4&&s.age>=20},text:'有人在东家面前提了你的名字。',
  out:[{t:'你被调去做记账。那一年你像块干海绵，把每一笔都啃进脑子里。',fx:{attrs:{arc:1}}}]},
 {id:'m6',n:'房东加价',when:function(s){return s.age>=22&&s.age<=45},
  out:[{c:function(s){return s.attrs.coin>=4},t:'加就加吧，你还付得起。亭子间外那盏门灯还是每晚准时亮。',fx:{attrs:{coin:-1}}},
       {t:'你搬到更偏的棚户区。门外没有灯，只有一片黑。',fx:{attrs:{coin:-1,men:-1},lamps:{走:1}}}]},
 {id:'m7',n:'家书',when:function(s){return s.age>=12},
  out:[{c:function(s){return s.flags.no_goodbye},t:'她问你吃了没。你回信说吃了。写完信你坐了很久，有些话这辈子都问不出口了。',fx:{attrs:{men:-1},lamps:{赊:1}}},
       {t:'她问你吃了没。你回信说吃了。其实那天你还没吃。',fx:{lamps:{问:1}}}]},
 {id:'m8',n:'同乡吃酒',when:function(s){return s.age>=32},
  out:[{c:function(s){return s.attrs.soc>=5},t:'去了。当年的人多半胖了，话却比年轻时软。散场有人拍你肩膀：下回你张罗。',fx:{attrs:{soc:1},lamps:{引:1}}},
       {t:'你没去。他们在合影里给你留了个位置，人没到。',fx:{lamps:{咽:1}}}]},
 {id:'m9',n:'诊所诊断',when:function(s){return s.age>=40},
  out:[{c:function(s){return s.attrs.coin>=4},t:'肺上有个影子。你咬牙进了趟洋医院，照了一张片子，虚惊一场。大夫说，少抽烟。',fx:{attrs:{coin:-1}}},
       {t:'肺上有个影子。你说等忙完这阵。这一等，就是三年。',fx:{attrs:{vit:-1},flags:{sick:1}}}]},
 {id:'m10',n:'水井填了',when:function(s){return s.age>=35},text:'胡同口那口井，被巡警下令填了。',
  out:[{c:function(s){return s.lamps['问']>=1},t:'你回去看过一次。青石板还在，井没了。你蹲下来摸了摸那块新土，像摸一个已经说不出话的老朋友。',fx:{lamps:{同:1}}},
       {t:'你是从同乡嘴里听说的。哦，填了啊。你说。',fx:{lamps:{咽:1}}}]},
 {id:'m11',n:'替人守灵',when:function(s){return s.age>=20},text:'邻家老人走了，没人敢去守，怕沾上事。',
  out:[{c:function(s){return s.attrs.men>=5},t:'你去了。守到天亮，还替他把门灯点上了。那家人后来念了你一辈子。',fx:{attrs:{men:1},lamps:{看:1}}},
       {t:'你没去。半夜你听见外头有哭声，翻个身，没起。',fx:{lamps:{赊:1}}}]},
 {id:'m12',n:'一箱旧书',when:function(s){return s.age>=18},text:'收旧货的人挑来一箱书，论斤卖。',
  out:[{c:function(s){return s.attrs.arc>=5},t:'你认出里头有一本绝版的，用半个月工钱换了下来。',fx:{attrs:{arc:2},lamps:{直:1}}},
       {t:'你翻了翻，觉得没用，走了。多年后你在别人书房里又见到那本书。',fx:{attrs:{men:-1}}}]},
 {id:'m13',n:'铺子查封',when:function(s){return s.age>=30&&s.age<=50},text:'街面上查得紧，东家的铺子说封就封。',
  out:[{c:function(s){return s.attrs.soc>=5},t:'有个熟人替你说了话，你被留下看栈房。',fx:{attrs:{soc:1},lamps:{引:1}}},
       {t:'你失了差事。铺子里的人各奔东西，没人回头。',fx:{attrs:{coin:-1,men:-1},lamps:{走:1}}}]},
 {id:'m14',n:'门灯重亮',when:function(s){return s.age>=30&&s.tough>=1},text:'你翻出一盏早年不敢点的门灯。',
  out:[{t:'你试着点了一次。灯芯黑得厉害，火却真的起来了。',fx:{lamps:{看:1},attrs:{men:1}}}]},
 {id:'m15',n:'门口的孩子',when:function(s){return s.age>=25&&s.age<=60},text:'门口蹲着一个六七岁的孩子，饿得眼发直，说是逃难来的。',
  out:[{c:function(s){return s.attrs.coin>=4},t:'你带他吃了一顿饱饭，又给了他两个铜板。三十年后，有人在你坟前放了一束野花。',fx:{attrs:{coin:-1},lamps:{托:1}}},
       {t:'你塞了半个窝头就把门关了。你后来一直记得他站在雪里的样子。',fx:{lamps:{咽:1},attrs:{men:-1}}}]},
 {id:'m16',n:'同行相争',when:function(s){return s.age>=25},text:'一个你带过的学徒，抢了你等了很久的差事。',
  out:[{c:function(s){return s.attrs.men>=5},t:'你没争。你只是把他叫来，该交代的都交代了。他红着脸走了。',fx:{attrs:{men:1},lamps:{同:1}}},
       {t:'你跟他翻了脸，从此再没说过话。',fx:{attrs:{soc:-1},lamps:{赊:1}}}]},
 {id:'m17',n:'一场大雨',when:function(s){return s.age>=18},text:'你赶夜路时撞上暴雨，被困在关帝庙。',
  out:[{t:'你在庙里躲了一夜，听雨打瓦。天亮时你想，这辈子好像也没几回这么安静过。',fx:{attrs:{men:2}}}]},
 {id:'m18',n:'故人来信',when:function(s){return s.age>=28},text:'一封辗转了半年的信送到你手上，说你母亲坟头草高了。',
  out:[{c:function(s){return s.attrs.coin>=3},t:'你连夜赶回去，把坟修了，又住了两个月。',fx:{attrs:{coin:-1},lamps:{供:1}}},
       {t:'你说等这阵忙完。朋友点点头走了。你后来一直没回去。',fx:{lamps:{赊:1},attrs:{men:-1}}}]},
 {id:'m19',n:'一场大火',when:function(s){return s.age>=35},text:'你住的那条街半夜起了火。',
  out:[{c:function(s){return s.attrs.vit>=6},t:'你冲进去抢出一只旧皮箱，眉毛烧掉一半。箱子里是家里的老照片。',fx:{attrs:{vit:-1},lamps:{看:1}}},
       {t:'你站在街对岸看着，火映在脸上。有些东西，你来不及拿。',fx:{lamps:{赊:1}}}]},
 {id:'m20',n:'一句遗言',when:function(s){return s.age>=40},text:'有人转交给你一句旧人临终前的话。',
  out:[{t:'那句话很短，你听懂了。你把门灯调亮了一档。',fx:{lamps:{温:1},attrs:{men:1}}}]}
],
chapters:[
 {variants:2,t:'第一章 · 胡同口的水井',age:6,
  body:function(s){if(s.v===1)return['母亲走的那天没下雪，是起了风。她天不亮就把灶上的火引着，熬了一锅比平常稠的粥，又把你那件棉袄的袖口翻出来重新绱了一遍。','她拎着那个蓝布包袱出门时，胡同里只有倒夜香的推车在响。祖母让你送到井台为止。你站在井台上看她，她没回头，走得很快，鞋底在冻硬的土上敲出声音。','那年冬天门灯的油下得特别快。祖母每回添油都只添半勺，说，省着点，你妈在外头也是这么省的。','你后来才知道，母亲去的是杨树浦的纱厂。同去的还有四个人，走之前在井台上打了个照面，谁也没说要去哪儿。'];if(s.v===1)return['母亲走的那天没下雪，是起了风。她天不亮就把灶上的火引着，熬了一锅比平常稠的粥，又把你那件棉袄的袖口翻出来重新绱了一遍。','她拎着那个蓝布包袱出门时，胡同里只有倒夜香的推车在响。祖母让你送到井台为止。你站在井台上看她，她没回头，走得很快，鞋底在冻硬的土上敲出声音。','那年冬天门灯的油下得特别快。祖母每回添油都只添半勺，说，省着点，你妈在外头也是这么省的。','你后来才知道，母亲去的是杨树浦的纱厂。同去的还有四个人，走之前在井台上打了个照面，谁也没说要去哪儿。'];return ['你的童年，是一盏总在晃的门灯。',
   '胡同口那口井是整条巷子的命。谁家点灯、谁家挑水，都得在井台上打个照面。祖母每天打第一遍水，打上来先不洗衣裳，先洗眼睛。她说水凉，洗完了看东西清楚。',
   '你父亲在车站扛大件，一个月挣不出两袋面。他回来得少，回来也不说话，就坐在井台上卷旱烟。有一回他不知从哪儿捡回来一只泥叫叫，尾巴缺了一块，是货堆里的残货。',
   '他不会吹，你也不会。父子俩对着那只哑叫叫坐了一下午。',
   '后来叫叫让雨水泡化了。你把剩下的半个泥疙瘩塞进墙缝里，塞得很深。',
   '然后某天，母亲说要去南边做工。',
   '那年的头一场雪，落在井台上，很快化成了水。',
   '祖母把你按在井台边擦脸。她说：门灯还亮着，你妈就得回来。家里有人，灯才算数。'];},
  choices:[
   {k:'A',t:'追到胡同口，抱住她的铺盖卷不放',
    body:['你母亲蹲下来，握着你的手腕，没说话，握了一会儿，松开，起来走了。你追到胡同口，看见她上了电车。电车的灯在雪里拖出一条黄线，越拖越短。'],
    fx:{lamps:{问:1},attrs:{men:-1},flags:{chased:1}},hint:'问↑｜骨气↓'},
   {k:'B',t:'懂事地挥手，说“娘放心，门灯我守着”',
    body:['你母亲点了下头，很轻，然后就走了。你在门口挥手，手举着，一直举到她拐弯。',
     '那天下午你把井台上那盆衣裳洗了。井绳磨手，磨出两道红印，第二天才消。祖母看见了，什么也没说，晚上往你碗里多搁了半勺油。'],
    fx:{lamps:{挑:1},attrs:{men:1,vit:-1}},hint:'挑↑｜骨气↑ 身板↓'},
   {k:'C',t:'蹲在灶前添柴，没抬头也没送',
    body:['你回了屋，把课本摊开。那篇课文叫《背影》，老师还没讲。你从第一个字看到最后一个字，看完又从头看。',
     '院子里传来门闩响了一下。你没抬头。'],
    fx:{lamps:{咽:1},attrs:{men:1}},hint:'咽↑｜骨气↑'}
  ]},
 {variants:2,t:'第二章 · 石桥与洋学堂',age:15,
  body:function(s){if(s.v===1)return['那年开学，学堂的先生把名单念到一半，停了一下，说，名字后头画圈的，散学后去一趟账房。你的名字后头有一个圈。','你回家没说。夜里父亲从你书包里翻出那张纸条，凑着门灯看了很久，一句话也没说，把纸条折好，压在灯座底下。','第二天他把家里能卖的东西在院里摆了一排：一只停摆的怀表、祖母的银簪、半箱子旧书。他在那一排东西前头蹲了半晌。','桥头那盏灯还是坏的。你每天过桥都想，等哪天家里缓过来，头一件事就是把这盏灯修上。'];if(s.v===1)return['那年开学，学堂的先生把名单念到一半，停了一下，说，名字后头画圈的，散学后去一趟账房。你的名字后头有一个圈。','你回家没说。夜里父亲从你书包里翻出那张纸条，凑着门灯看了很久，一句话也没说，把纸条折好，压在灯座底下。','第二天他把家里能卖的东西在院里摆了一排：一只停摆的怀表、祖母的银簪、半箱子旧书。他在那一排东西前头蹲了半晌。','桥头那盏灯还是坏的。你每天过桥都想，等哪天家里缓过来，头一件事就是把这盏灯修上。'];return ['母亲每年回来一趟，腊月里到，正月里走。走的那天你总要踮脚去比门框上那道旧刻痕，看自己这一年长了几分。',
   '祖母在族谱上只认得出自己那三个字。她教你数数，用的是门灯里的油：油下去一寸是一夜，一夜一夜数到油罐见底，就该上街打油了。',
   '津浦线裁人的那几年，父亲从货场退了下来。他不再扛大件，天天蹲在井台边补一条旧麻袋。有一回你放学回来，看见他把缝好的针脚全拆了，拆完再缝，缝完再拆。你没敢过去。他抬头看见你，把针别在衣襟上，说，回来啦。',
   '上学要过一座石桥。桥下常年拴着一只破船，缆绳锈得发黑。桥头挂过一盏灯，坏了半年，也没人上去换。',
   '那年冬天，你把学堂发的奖状拿回家。父亲凑着门灯看了很久，只说一句：笔杆子比扁担轻。他把奖状压在炕席底下，再没拿出来过。'];},
  choices:[
   {k:'A',t:'“爹，我不念了，我去车站找活”',
    body:['你父亲摔了手里的碗。碗碎了一地，他红着眼睛吼：谁让你不念的？吼完他又坐下来，像一只泄了气的旧轮胎，说，是爹没本事。'],
    fx:{lamps:{挑:1},attrs:{coin:1,arc:-1,men:1},flags:{quit_school:1}},hint:'挑↑｜银元↑ 学识↓｜锁死：升学线关闭'},
   {k:'B',t:'报考免费的师范',
    body:['父亲沉默了很久，说，好，咱家能出人就好。后来你在师范里，每天把手上的茧磨厚一层，见了所有能见的光。'],
    fx:{lamps:{走:1},attrs:{arc:1},flags:{tech:1}},hint:'走↑｜学识↑'},
   {k:'C',t:'赌气说“我要考最好的学堂，考不上就不回来了”',
    body:['父亲没说话。半夜你醒来，听见他压着嗓子跟母亲说：把咱家那间铺面抵了吧，孩子有出息是大事。'],
    fx:{lamps:{攀:1},attrs:{arc:1,coin:-1,men:-1}},hint:'攀↑｜学识↑ 银元↓ 骨气↓'}
  ]},
 {variants:2,t:'第三章 · 十七岁的信',age:17,
  body:function(s){if(s.v===1)return['那年春天，你常去的那间旧书铺关了门。掌柜的把书论斤挑走，柜台底下剩下一摞散页，谁也没要。','散页里夹着一张纸条，是{ta}的字。上头只写着家里要往南边搬，走得急，来不及当面说。字很小，末尾画了一只歪歪的燕子，尾巴没画完。','那张纸条你后来对折了，塞进《呐喊》里。那本书原本是替{ta}借的，借书条还在你兜里，字都磨淡了。','你没有去车站。那天下午你在井台上打了六桶水，把家里那口缸灌满，水溢出来，把鞋面泡湿了一只。'];if(s.v===1)return['那年春天，你常去的那间旧书铺关了门。掌柜的把书论斤挑走，柜台底下剩下一摞散页，谁也没要。','散页里夹着一张纸条，是{ta}的字。上头只写着家里要往南边搬，走得急，来不及当面说。字很小，末尾画了一只歪歪的燕子，尾巴没画完。','那张纸条你后来对折了，塞进《呐喊》里。那本书原本是替{ta}借的，借书条还在你兜里，字都磨淡了。','你没有去车站。那天下午你在井台上打了六桶水，把家里那口缸灌满，水溢出来，把鞋面泡湿了一只。'];return ['十七岁那年，你的课本里多了一封信。',
   '那个总在课间回头看你的人，随家里迁去了天津。走前把信夹在你的国文课本里。你翻到它的时候，人已经上了往南开的车。信纸很薄，字写得好，只问一句：你上课总往窗外看，是在看什么？',
   '信封上没有落地址。那封信你也没处寄，就夹在一本《呐喊》里，夹到书页发黄，字迹淡下去。'];},
  choices:[
   {k:'A',t:'把信夹进《呐喊》，再没翻开',
    body:['后来你搬家，书卖给了收旧货的。你站在胡同口，看着那辆三轮车拐出巷子。收旧货的没给几个钱，你也没还价。'],
    fx:{lamps:{问:1},attrs:{men:-1}},hint:'问↑｜骨气↓'},
   {k:'B',t:'追去{ta}的新学堂',
    body:['你走了一下午，找到那所洋学堂，站在门口，人山人海里没有{ta}。你在学堂门前的灯底下站到天黑。后来你们再没见面，但那份跑过去过的勇气，陪了你很多年。'],
    fx:{lamps:{拼:1},attrs:{vit:1,soc:1}},hint:'拼↑｜身板↑ 人脉↑'},
   {k:'C',t:'回了一封，寄到学堂，被退了回来',
    body:['信退回那天，你把它压在枕下，让那股墨香陪你睡了很多年。'],
    fx:{lamps:{等:1},attrs:{arc:1}},hint:'等↑｜学识↑'}
  ]},
 {variants:2,t:'第四章 · 津浦线的慢车',age:18,
  body:function(s){if(s.flags.quit_school)return['你终究是没走进那间考场。','同窗在教室里背书，你背着铺盖卷从校门口路过，没敢抬头。','父亲送你到车站，塞给你两块银元，说，实在不行就回来。'];
    if(s.v===1)return['十八岁那年夏天，院子里的日头一天比一天长。父亲把货场的活揽到了夜里，回来时衣裳上一层白汗碱。','他不再问你念得怎么样。他只是隔几天就把你桌上的旧课本挪一挪位置，像是怕落灰，又像是怕你看不见。','那阵子胡同里几个同年的人各走各的路：一个去了天津投亲戚，一个进警局当了差，还有一个在家门口支了个烟摊。','你站在井台上，看他们一个一个走出胡同。你不知道自己该往哪边走，只知道这条路得自己挑，没人能替你挑。'];
    if(s.v===1)return['十八岁那年夏天，院子里的日头一天比一天长。父亲把货场的活揽到了夜里，回来时衣裳上一层白汗碱。','他不再问你念得怎么样。他只是隔几天就把你桌上的旧课本挪一挪位置，像是怕落灰，又像是怕你看不见。','那阵子胡同里几个同年的人各走各的路：一个去了天津投亲戚，一个进警局当了差，还有一个在家门口支了个烟摊。','你站在井台上，看他们一个一个走出胡同。你不知道自己该往哪边走，只知道这条路得自己挑，没人能替你挑。'];return['升学考那年夏天，天极热。','考场设在城里的中学，屋里闷得像蒸笼。你写完最后一个字，手心全是汗，在卷角上洇出一小块。出了校门，看见父亲蹲在墙根等你，脚边搁着一把用棉套裹住的粗瓷壶，见你出来就往你手里塞：井里镇过的，快喝。','他没问你考得怎么样。他把那把壶的棉套重新裹好，说，走，回家，你奶熬了粥，灶上还煨着。','后来榜出来了。你差了两分。','那一晚他蹲在灶前，一包旱烟抽掉半包。后半夜他推门进来，说：再考一年，爹把货场上的活再多揽几趟，供你。'];
  },
  choices:[
   {k:'A',t:'再考一年，让爹再扛一年',cond:function(s){return !s.flags.quit_school},lock:'你早就辍学了，这条路已经关上',
    body:['你把自己关进没日没夜的题海里。第二年你考上了。放榜那天，父亲把录取单翻来覆去地看，看得眼睛都湿了，嘴上却说这有啥好看的。'],
    fx:{lamps:{攀:1},attrs:{arc:2,men:-1,coin:-1},years:1},hint:'攀↑｜学识↑↑ 骨气↓ 银元↓｜耗 1 年'},
   {k:'B',t:'“爹，我去上海学机器，早点挣钱”',cond:function(s){return !s.flags.quit_school},lock:'你早就辍学了，这条路已经关上',
    body:['你背起铺盖卷，坐上南下的慢车。靠窗的位置，对座大叔啃烧饼的味道你记了很多年。窗外是倒退的麦田、土岗、陌生的城。慢车晃了很久才出站。你没回头。'],
    fx:{lamps:{走:1},attrs:{coin:1,arc:1},flags:{south:1}},hint:'走↑｜银元↑ 学识↑'},
   {k:'C',t:'去一所便宜的省立学校',cond:function(s){return !s.flags.quit_school},lock:'你早就辍学了，这条路已经关上',
    body:['你挑挑拣拣，最后上了车。车开那一刻你回头，看见父亲站在月台上，越来越小，像井边一枚晒干了的核桃。你攥紧车票，告诉自己一定要活出个人样。'],
    fx:{lamps:{渡:1},attrs:{arc:1,soc:1,coin:-1}},hint:'渡↑｜学识↑ 人脉↑ 银元↓'},
   {k:'A',t:'去车站扛大件',cond:function(s){return !!s.flags.quit_school},lock:'你还在念书',
    body:['你跟着同乡上了货场。麻袋压在肩上的分量比课本沉得多。第一个月你寄回去三块钱，附了一张纸条：我挺好的。'],
    fx:{lamps:{走:1},attrs:{coin:1,vit:-1},flags:{south:1}},hint:'走↑｜银元↑ 身板↓'},
   {k:'B',t:'留在本地跟师傅学手艺',cond:function(s){return !!s.flags.quit_school},lock:'你还在念书',
    body:['你拜了巷尾的老陈做师傅，学修钟表。老陈脾气坏，手却稳。三年后你能在米粒大的齿轮上落针。'],
    fx:{lamps:{挑:1},attrs:{arc:2}},hint:'挑↑｜学识↑↑'},
   {k:'C',t:'白天做工，晚上上夜校',cond:function(s){return !!s.flags.quit_school},lock:'你还在念书',
    body:['你白天拉车，晚上在夜校的灯下看书。蚊子围着灯泡撞，你一手拍蚊子一手翻页。六年后你拿到了那张文凭，没人知道它有多重。'],
    fx:{lamps:{攀:1},attrs:{arc:2,vit:-1,men:1},years:1},hint:'攀↑｜学识↑↑ 身板↓ 骨气↑｜耗 1 年'}
  ]},
 {variants:2,t:'第五章 · 亭子间与第一块大洋',age:22,
  body:function(s){if(s.v===1)return['第一块大洋是月底结的。账房先生把银元摊在柜台上，一个一个数给你听，数到最后一个，指甲在边齿上刮了一下。','你揣着它走了三条弄堂。过一家南货店，橱窗里挂着火腿和干贝；过一家当铺，高柜台后头有人低声说话。你都没进去。','亭子间的桌上只有一盏捡来的破油灯，灯座裂了缝，点起来烟大。你在灯下把那块大洋翻过来又翻过去，听它磕在木头上的声。','楼下的留声机响了很久。你躺在床上算这个月的账：房钱、饭钱、寄回家的，算到最后手指头停住了。'];if(s.v===1)return['第一块大洋是月底结的。账房先生把银元摊在柜台上，一个一个数给你听，数到最后一个，指甲在边齿上刮了一下。','你揣着它走了三条弄堂。过一家南货店，橱窗里挂着火腿和干贝；过一家当铺，高柜台后头有人低声说话。你都没进去。','亭子间的桌上只有一盏捡来的破油灯，灯座裂了缝，点起来烟大。你在灯下把那块大洋翻过来又翻过去，听它磕在木头上的声。','楼下的留声机响了很久。你躺在床上算这个月的账：房钱、饭钱、寄回家的，算到最后手指头停住了。'];return ['上海不相信眼泪，也不相信文凭。',
   '你租了一间亭子间，墙皮是烟熏黄的，一张床、一张桌、一扇朝北的窗。对面人家的门灯每晚亮到十点，灯一灭，整条弄堂就沉进黑里。',
   '第一份差事，你跑街、抄账，也在厂里守半夜的机器，一天十二个钟头。第一块大洋到手那天，你在柜台上把它翻过来又翻过去，听它磕在木头上的那一声脆响。',
   '你托同乡捎了封平安信回去。祖母让人带话：我娃瘦了。你回：没有，胖了。父亲在话尾添了一句：混不下去就回来，家里还有半缸米。'];},
  choices:[
   {k:'A',t:'把第一块大洋，分一半寄回北平',
    body:['母亲托人带话怪你乱花钱，捎话的人说，她没再往下说。父亲难得说了句：好孩子。就是这四个字，让你在电车上把帽檐压得很低，一路没抬起来。'],
    fx:{lamps:{挑:1},attrs:{coin:-1,men:1}},hint:'挑↑｜银元↓ 骨气↑'},
   {k:'B',t:'全留给自己，报夜校 / 买一台旧机器',
    body:['你赌在自己身上。后来这本事，成了你糊口又立住的东西。你偶尔想起祖母说的人字两笔，觉得自己正在给自己补上第二笔。'],
    fx:{lamps:{走:1},attrs:{arc:2}},hint:'走↑｜学识↑↑'},
   {k:'C',t:'请同乡吃了顿饭',
    body:['你第一次尝到人情往来的甜和重。那顿饭大家都很高兴，笑声快把亭子间掀了。你忽然明白，在这座城里扎根光靠力气不够，要靠一张笑脸搭起来的桥。'],
    fx:{lamps:{引:1},attrs:{soc:2,coin:-1}},hint:'引↑｜人脉↑↑ 银元↓'}
  ]},
 {variants:2,t:'第六章 · 那盏没点亮的门灯',age:28,
  body:function(s){if(s.v===1)return['信是邻居代写的，信封上只有七个字：父病重，速归。字歪歪扭扭，墨渍洇开一片，像是写的时候手在抖。','你去找掌柜的告假。掌柜的把算盘推过来，说，这个月的工钱在这儿。你要走，差事给你留着，别去太久。','火车是第二天晌午的，慢车，逢站就停。你在月台上买了两个茶叶蛋，一个当场吃了，一个揣在怀里，到家时凉透了。','父亲躺在里屋的炕上，听见动静转过头来。他瘦得颧骨都突出来了，还是先说了一句：路上累了吧。'];if(s.v===1)return['信是邻居代写的，信封上只有七个字：父病重，速归。字歪歪扭扭，墨渍洇开一片，像是写的时候手在抖。','你去找掌柜的告假。掌柜的把算盘推过来，说，这个月的工钱在这儿。你要走，差事给你留着，别去太久。','火车是第二天晌午的，慢车，逢站就停。你在月台上买了两个茶叶蛋，一个当场吃了，一个揣在怀里，到家时凉透了。','父亲躺在里屋的炕上，听见动静转过头来。他瘦得颧骨都突出来了，还是先说了一句：路上累了吧。'];return ['你成了家。{ta}在隔壁弄堂的纱厂做事，笑起来眼睛弯弯的。你们把这条街走了无数遍，你工钱的一小半都花在带{ta}看文明戏上。你头一回觉得，屋顶漏风也不算什么。',
   '后来父亲病了，是肺上的事，在货场上吸了半辈子煤灰。你连夜赶回去，看见炕上的他瘦得脱了形，还摆手说小毛病，不碍的。',
   '你在家待了几天。动身那晚，父亲支开祖母，从枕下摸出一样东西：你小时候那只泥叫叫旁边，还压着一张发黄的照片。照片上他年轻，站在货场门口，身后也是雪。',
   '他说：你爹没给你挣下房，也没给你挣下地。就这一副肩膀，扛得住事，你拿去用，别学我，什么话都咽着。'];},
  choices:[
   {k:'A',t:'先留下，陪爹坐够这半个月',
    body:['你在老家多待了两周。那两周你陪他下棋、给他念报、看他在院里晒太阳。你后来总说，那是你人生里最好的两周。'],
    fx:{lamps:{看:1},attrs:{coin:-1,men:1},flags:{father_stay:1}},hint:'看↑｜银元↓ 骨气↑'},
   {k:'B',t:'赶回上海，承诺“忙完这阵就回”',
    body:['这阵忙了很久。后来你接到电报，说父亲不行了。你赶回去时他已经走了。你跪在灵前喊爹，他的手是凉的。那天夜里，院门口的门灯，按规矩灭了。'],
    fx:{lamps:{赊:2},attrs:{men:-1},flags:{no_goodbye:1}},hint:'赊↑↑｜骨气↓｜不可逆：第七章与第十章全部改写'},
   {k:'C',t:'把差事辞了，回去侍疾',cond:function(s){return s.attrs.coin>=2},lock:'你拿不出辞了差事的底气（银元不足 2）',
    body:['母亲说你傻呀。你说，娘，差事没了可以再找，爹就这一个。那段时间你陪他走完最后一程，他走得很安详。后来你慢慢还清了债，重新出发。'],
    fx:{lamps:{供:2},attrs:{coin:-2,men:2},flags:{father_stay:1,quit_job:1}},hint:'供↑↑｜银元↓↓ 骨气↑↑'},
   {k:'D',t:'不再进夜场，改成白天做账',
    body:['你把夜里的活推了，改成白天替人理账。钱是薄了，可你每天都能看见太阳落在算盘上。'],
    fx:{lamps:{守:1},attrs:{vit:2,coin:-1}},years:2,hint:'守↑｜体魄↑↑ 银元↓｜寿 +2'}
  ]},
 {variants:2,t:'第七章 · 灵前的长明灯',age:29,
  body:function(s){if(s.flags.no_goodbye)return['父亲走的那年冬天，北平又下了一场大雪，像极了你出生那年。','你在灵前守了一夜，膝盖麻得站不起来。你想得最多的不是他在井台边拆了又缝的那条麻袋，而是你上回临走时，他说回来啦，你说哎，转身就出了胡同。','他最后想说什么，你永远不知道了。','长明灯是你添的油。一勺一勺，添到后半夜手都是抖的。风从门缝里进来，你就侧身挡着，没让它灭。'];
    if(s.v===1)return['灵棚搭在堂屋里，八仙桌上供着他的相片，香是邻居送来的。来吊的人进门先看一眼门灯，再进来磕头。','有人提起他早年替街坊垫过的一笔药钱，说那账就算了。你翻出赊账簿，找到那一页，用指甲划了一道，说你替他记着。','夜里守灵的人散了，只剩你。你把灯芯剪了一回，火苗晃了两下，稳住了。院子里的雪落了一寸厚，没人扫。','出殡那天早上，你把门灯一直点到日头出来。隔壁的老太太说，灯亮着，这条胡同就知道这户人家还有后人。'];
    if(s.v===1)return['灵棚搭在堂屋里，八仙桌上供着他的相片，香是邻居送来的。来吊的人进门先看一眼门灯，再进来磕头。','有人提起他早年替街坊垫过的一笔药钱，说那账就算了。你翻出赊账簿，找到那一页，用指甲划了一道，说你替他记着。','夜里守灵的人散了，只剩你。你把灯芯剪了一回，火苗晃了两下，稳住了。院子里的雪落了一寸厚，没人扫。','出殡那天早上，你把门灯一直点到日头出来。隔壁的老太太说，灯亮着，这条胡同就知道这户人家还有后人。'];return['父亲走的那年冬天，北平又下了一场大雪，像极了你出生那年。','你在灵前守了一夜，膝盖麻得站不起来。你想起他在井台边拆了又缝的那条麻袋，想起他把奖状压在炕席底下，想起他说笔杆子比扁担轻。','到这时候你才想通，他这辈子只教过你两件事：别怕；手里有火，别攥死，哪怕只够分给隔壁一户。','你跪着，看那盏长明灯，没让它灭。'];
  },
  choices:[
   {k:'A',t:'把他那支没舍得点的烟，收进匣子',
    body:function(s){return s.flags.no_goodbye?['很多年后你打开那个盒子，烟已经潮了。你对着它站了很久，想说爹我挺好的，最后只说了半句。']:['很多年后你打开那个盒子，烟已经潮了。你对着它说：爹，我挺好的。']},
    fx:function(s){return s.flags.no_goodbye?{lamps:{问:1,赊:1},attrs:{men:-1}}:{lamps:{问:1}}},
    hint:'问↑（若未告别：同时赊↑ 骨气↓）'},
   {k:'B',t:'把他的相片，挂到堂屋正墙上',
    body:['每天出门前看一眼。你笑着说，爹，我出门了，像他还在的时候。'],
    fx:{lamps:{托:1}},hint:'托↑'},
   {k:'C',t:'不供相片，不点长明灯，只当他还在',
    body:['你把他记在心里，连同那晚的雪、井边的水、胡同口的灯。有些人不需要遗物，因为他已经长成了你。'],
    fx:{lamps:{同:1}},hint:'同↑'}
  ]},
 {variants:2,t:'第八章 · 四十岁的清算',age:40,
  body:function(s){if(s.v===1)return['收铺子那天，先来的是查账的。两个人抬走账箱，把柜上的东西一件一件登在单子上，连柜台底下那把缺腿的凳子都写了进去。','有个年轻的问你，这些算谁的？你说，算铺子的。他点点头，一笔一笔都写在铺子的名下。你站在门外，看他们把那块招牌靠在墙上。','东家当天就没了人影。你替他把三个伙计的工钱结清了，垫的是自己攒的那点钱。伙计们走的时候，都在门口回了一次头。','那晚你在空铺子里坐到半夜。地上剩一层灰，窗纸破了个洞，卷进来一股冷风。你吹了灯，锁上门，把钥匙揣进兜里。'];if(s.v===1)return['收铺子那天，先来的是查账的。两个人抬走账箱，把柜上的东西一件一件登在单子上，连柜台底下那把缺腿的凳子都写了进去。','有个年轻的问你，这些算谁的？你说，算铺子的。他点点头，一笔一笔都写在铺子的名下。你站在门外，看他们把那块招牌靠在墙上。','东家当天就没了人影。你替他把三个伙计的工钱结清了，垫的是自己攒的那点钱。伙计们走的时候，都在门口回了一次头。','那晚你在空铺子里坐到半夜。地上剩一层灰，窗纸破了个洞，卷进来一股冷风。你吹了灯，锁上门，把钥匙揣进兜里。'];return ['四十岁那年，你的铺子被收了。',
   '不是倒闭，是清查。一张封条贴上门板，你做了十年的那间铺面，隔夜就换了东家。你没跟人吵，也没去求谁。你在街口站了一阵，看他们把招牌摘下来靠墙放着，然后转身走进弄堂。柜上那本赊账簿还摊着，一页一页，全是熟人的名字。',
   '你开始重新寻出路。三十五是一堵墙，四十是另一堵更高的墙。你学会了一个新本事：在账房先生面前，把“我快四十了”翻译成“我有二十年的行当经验”。',
   '{ta}把针线搁下，说：要不，咱们还是回老家去。这城里眼下不留人，回去好歹能有半间屋遮风。',
   '你站在窗边，看弄堂口那户人家的门灯。它还亮着，说明那一家子都还有人。灯亮着，房子就还是他们的。'];},
  choices:[
   {k:'A',t:'留下，换个行当重来',cond:function(s){return s.attrs.arc>=5},lock:'学识不足 5：你的底子撑不起一次转身',
    body:['你从头学起，像二十岁那样重新当学徒。无数次想放弃，无数次在深夜擦干眼睛继续。后来你站住了。孩子问你后悔吗，你说，不后悔，人输了牌可以重新洗。'],
    fx:{lamps:{走:1,攀:1},attrs:{arc:2,men:-1,coin:-1},flags:{fired:1}},hint:'走↑ 攀↑｜学识↑↑ 骨气↓ 银元↓'},
   {k:'B',t:'带着全家回原籍',cond:function(s){return s.lamps['问']>=1||s.flags.father_stay},lock:'祖屋早卖了，你无根可回',
    body:['那座小城，井还在，桥还在，巷子里的青石板还在。你接手了祖上留下的一间旧屋，修了修住下来，每天沿桥散步，跟老邻居打招呼。你发现人一辈子走遍千山万水，最后想回的，还是那口井边。'],
    fx:{lamps:{还:1},attrs:{men:2,coin:-1},flags:{fired:1,back_home:1}},hint:'还↑｜骨气↑↑ 银元↓'},
   {k:'C',t:'留不下，也回不去，两头漂着',
    body:['你开始接零散的活，今年这里明年那里。你常年在路上，看过很多座城的深夜。你偶尔想起那句好好念，别跟爹一样，忽然发现你其实一直在追一个好好的的定义。'],
    fx:{lamps:{寻:1,看:-1},attrs:{soc:-1,coin:1},flags:{fired:1}},hint:'寻↑ 看↓｜人脉↓ 银元↑｜韧度 +1'},
   {k:'D',t:'花钱请大夫调养',
    body:['大夫说你这是熬出来的病，得慢慢养。药很贵，你还是抓了三副，一副也没少。'],
    fx:{lamps:{暖:1},attrs:{vit:2,coin:-2}},years:3,hint:'暖↑｜体魄↑↑ 银元↓↓｜寿 +3'}
  ]},
 {variants:2,t:'第九章 · 凌晨三点的灶间',age:45,
  body:function(s){if(s.v===1)return['那阵子你在报馆上夜班，回到家时天已经亮了一半。她正给孩子扎辫子，听见门响没抬头。桌上扣着一只碗，碗底还是温的。','你们的日子过成了一件一件事：米剩半缸、煤球该买了、孩子的鞋又顶脚。话都说了，只是没有一句是给对方说的。','有一回在电车上碰见她，她抱着一包东西站在后门，也看见了你。两个人在两节车厢里隔着人，一直坐到站，谁也没挪一步。','下了车她走在前头。你想接那个包，她换了只手，说，我自己拿得动。那天的雪化了一半，路滑。'];if(s.v===1)return['那阵子你在报馆上夜班，回到家时天已经亮了一半。她正给孩子扎辫子，听见门响没抬头。桌上扣着一只碗，碗底还是温的。','你们的日子过成了一件一件事：米剩半缸、煤球该买了、孩子的鞋又顶脚。话都说了，只是没有一句是给对方说的。','有一回在电车上碰见她，她抱着一包东西站在后门，也看见了你。两个人在两节车厢里隔着人，一直坐到站，谁也没挪一步。','下了车她走在前头。你想接那个包，她换了只手，说，我自己拿得动。那天的雪化了一半，路滑。'];return ['有了孩子，日子反倒越过越哑。您忙报馆，她忙一家老小，一张桌上吃饭，能一整顿不出声。',
   '不是怨。是话到嘴边，都觉得说了也白说。',
   '那夜您睡不着，披衣去灶间。炉膛里还剩一点暗火。您忽然想起，这么些年，天不亮起来生火的是她，把热水灌进那个掉漆暖壶的，也是她。',
   '您把炉子挑旺，烧了一壶水，灌进暖壶，提到房里。她在黑暗里一直睁着眼。您把暖壶搁在她手边，说，烧了这么些年水，今儿也让我给您烧一回。她没作声，脸转向墙，肩膀颤了一下。',
   '屋外雪还在落。暖壶的木塞在热气里，轻轻地响了两声。'];},
  choices:[
   {k:'A',t:'不等她开口，先把灶上的活接过来',cond:function(s){return s.attrs.men>=4},lock:'骨气不足 4：你连自己都撑不住，顾不上别人',
    body:['您不再只管报馆那一头。她咳嗽，您记得买枇杷膏；孩子开学，您头一回一个人去交的学费。她嘴上嫌您笨手笨脚，缝补您的大衣时，却比从前仔细。'],
    fx:{lamps:{温:1},attrs:{soc:1,men:1}},hint:'温↑｜人脉↑ 骨气↑'},
   {k:'B',t:'把这半辈子咽下的话，当面倒出来',cond:function(s){return s.attrs.men>=5||s.lamps['直']>=1},lock:'骨气不足 5：这些话你还是说不出口',
    body:['您把这些年不肯说的都说了：父亲下葬那天您在外地采访、铺子被收时您一个人喝的闷酒、写不出稿时您坐在桌边抽到天亮。她听完说，原来您也难。就这四个字，您记了一辈子。'],
    fx:{lamps:{直:1},attrs:{men:1,soc:1}},hint:'直↑｜骨气↑ 人脉↑'},
   {k:'C',t:'暖壶搁下，话咽回去，各睡各的',
    body:['暖壶搁下，话又咽回。您二位又相敬如宾过了些年，同一盏灯下，各想各的心事。屋子不大，两张椅子之间，却像隔着一整条弄堂。'],
    fx:{lamps:{看:-1},attrs:{men:-1}},hint:'看↓（灯暗一档）｜骨气↓'}
  ]},
 {variants:2,t:'第十章 · 母亲的门灯',age:52,
  body:function(s){if(s.v===1)return['母亲的门灯是胡同里亮得最早的一盏。去年冬天你回去，天刚擦黑，她已经把灯点上了，说要让你远远就认出自家门口。','她认路认得清楚，认人却认不全了。邻居家的后生进门叫她一声大娘，她应了，转头问你，这孩子是谁家的。','她把一把旧钥匙塞给你，铜磨得发亮，上头系着一截红线。她说，这是咱家门上的，你拿着，别丢了。','临走那天她站在门口送，一直站到你拐出胡同。你回头看过一眼，门灯还亮着，她的影子在灯底下很短。'];if(s.v===1)return['母亲的门灯是胡同里亮得最早的一盏。去年冬天你回去，天刚擦黑，她已经把灯点上了，说要让你远远就认出自家门口。','她认路认得清楚，认人却认不全了。邻居家的后生进门叫她一声大娘，她应了，转头问你，这孩子是谁家的。','她把一把旧钥匙塞给你，铜磨得发亮，上头系着一截红线。她说，这是咱家门上的，你拿着，别丢了。','临走那天她站在门口送，一直站到你拐出胡同。你回头看过一眼，门灯还亮着，她的影子在灯底下很短。'];return ['母亲老了。胡同口那口井早填了，盖上石板，她仍旧爱搬个小凳去那儿坐着，一坐就是一下午，看人来人往。',
   '她的记性一年不如一年。有一回她盯着你看了半晌，问：你是哪家的？你说：我是你{子}。她哦了一声，过一会儿又拉住你的袖子，问，'+'{name}'+'是谁呀。你答一遍，她就笑一下，像头一回见你，隔一刻钟又问第三遍，你还是耐着性子答了。',
   '她忘了很多人，却总记得出去给你买爱吃的点心，记得给她的娃留一盏灯。',
   '当年在雪夜里把你揣在怀里、怕你冻着的那个人，如今要你扶着，才走得动院里那几步路。'];},
  choices:[
   {k:'A',t:'把娘接进城里，腾出半间房',cond:function(s){return s.attrs.coin>=3},lock:'银元不足 3：你连一间多余的房都腾不出',
    body:['家里多了一个老小孩。你学着给她做饭、梳头、煎药。她夜里会突然醒来说我怕黑，你就把走廊的灯留着，整夜整夜地亮。'],
    fx:{lamps:{看:1,供:1},attrs:{coin:-1,vit:-1,men:1}},hint:'看↑ 供↑｜银元↓ 身板↓ 骨气↑'},
   {k:'B',t:'每月坐一趟慢车，回去住一夜',cond:function(s){return s.attrs.men>=4},lock:'骨气不足 4：你连每周一趟都撑不下来',
    body:['你是那座城的常客，是那间老屋的常客。亲戚们都说真孝顺。只有你知道，你是在补一种遗憾：父亲那盏没点上的灯，你想在母亲身上，把它点上。'],
    fx:{lamps:{赊:-1,供:1},attrs:{men:1}},hint:'赊→供（灯·转化）｜骨气↑'},
   {k:'C',t:'捎口信说忙，把归期一拖再拖',
    body:['你托人捎信，她让人回话说你忙你的，娘好着呢。你收了信，心里一阵空。后来你终于回去了，她拉着你的手说，等你好久了。那天夜里你睡在老屋，半夜她轻轻起来，给你掖了掖被角。'],
    fx:{lamps:{赊:2,看:-1},attrs:{men:-1}},hint:'赊↑↑ 看↓｜骨气↓｜韧度 +1'}
  ]},
 {variants:2,t:'第十一章 · 一间小屋与一只旧皮箱',age:60,
  body:function(s){if(s.v===1)return['交账那天，账房先生把算盘上的珠子一颗一颗抹平，说，这些年谢谢你。你把手里的钥匙串放在账台上，没要他送。','出铺子的时候天还亮着。你顺着弄堂慢慢走，走过米店、当铺，走过那家看过文明戏的园子，一路走回自家门口。','屋里冷。你先把门灯点上，再去生炉子。火起来的时候，你想起小时候祖母添油只添半勺的样子，就把煤球也少搁了一颗。','你把那只旧皮箱拖到桌边。箱锁早坏了，用一根麻绳捆着。你没有马上打开，先给自己倒了一碗热水，坐下，喝了半碗。'];if(s.v===1)return['交账那天，账房先生把算盘上的珠子一颗一颗抹平，说，这些年谢谢你。你把手里的钥匙串放在账台上，没要他送。','出铺子的时候天还亮着。你顺着弄堂慢慢走，走过米店、当铺，走过那家看过文明戏的园子，一路走回自家门口。','屋里冷。你先把门灯点上，再去生炉子。火起来的时候，你想起小时候祖母添油只添半勺的样子，就把煤球也少搁了一颗。','你把那只旧皮箱拖到桌边。箱锁早坏了，用一根麻绳捆着。你没有马上打开，先给自己倒了一碗热水，坐下，喝了半碗。'];return ['那年冬月，你把最后一笔账交出去，从铺子里走出来。日头很低，把墙上的雪影子照得发黄。',
   '你在门口站了一阵。没人来接。你自己走回那间小屋，推开门，先迎出来的是屋里的凉气。',
   '你把屋子拾掇了一遍，给自己下了碗面，切了两片腌萝卜。盐搁重了，你想起母亲从前总嫌你手重。',
   '你坐到窗边，看弄堂里的孩子放学回来，书包带子拖在地上。你也曾是这样的小孩，在井台上打水，桶底磕着青石，一声一声。',
   '你打开那只旧皮箱。里面有：一只哑了的泥叫叫、一封没寄出的信、一张你们家的老照片，还有十几张车票，几片干枯的叶子。',
   '这一箱东西摊在桌上，就是你这辈子剩下的全部：泥叫叫、没寄出的信、旧相片、车票、几片干叶子。'];},
  choices:[

    body:['你把井、胡同、石桥、大雪、慢车、凌晨三点的面，全写进去。写到最后一页你写：这一生我点过很多灯，也熄过几盏。愿读到这里的人，都有人给留灯。'],

 {variants:2,t:'第十二章 · 最后一场雪',age:78,
  body:function(s){if(s.v===1)return['雪是从后半夜开始下的。屋檐底下那盏门灯还亮着，雪落上去，把灯罩糊白了一圈，光透出来是昏的。','你听见外头有人扫雪，扫帚一下一下，从院门口扫到胡同口。你想起这条胡同里扫过雪的那些人，一个一个都不在了。','当年查户口的保长、井台上打水的祖母、替你垫过钱的掌柜，都在你眼前站了一会儿，又都散了。','你把手伸出被子，朝窗纸上摸了一把。雪光落在手背上，是凉的。你想，这一回灯别灭在自己手里就好。'];if(s.v===1)return['雪是从后半夜开始下的。屋檐底下那盏门灯还亮着，雪落上去，把灯罩糊白了一圈，光透出来是昏的。','你听见外头有人扫雪，扫帚一下一下，从院门口扫到胡同口。你想起这条胡同里扫过雪的那些人，一个一个都不在了。','当年查户口的保长、井台上打水的祖母、替你垫过钱的掌柜，都在你眼前站了一会儿，又都散了。','你把手伸出被子，朝窗纸上摸了一把。雪光落在手背上，是凉的。你想，这一回灯别灭在自己手里就好。'];return ['你走的那个夜里落了雪，不大，落在窗纸上，先是一点，再是一片，把外头的胡同抹平了，连对门都看不清。',
   '你躺在床上，看雪一层一层压上屋檐，压过院墙上那道旧刻痕。你恍惚看见许多个自己：雪夜里报丁的婴儿、井台上打水的孩子、慢车里靠窗的年轻人、街口转身的中年人、窗边喝粥的老人。',
   '他们都站在那儿朝这边看，一声不响。像在等你先开口，又像只是路过，顺便看一眼这盏灯还亮不亮。',
   '你想跟他们招招手。手压在被子下面，抬不动。',

  ]}
],
endings:function(ctx){
  var L=ctx.lamps,A=ctx.attrs;
  var core=sumLamps(L);
  if(L['问']>=2&&L['挑']>=2&&L['走']>=2&&L['供']>=2&&L['托']>=2&&L['还']>=2&&L['温']>=2)
    return mkEnd('点亮万盏灯','hidden','你这一生太完整，完整到后来整条胡同的老人讲起你，用的是传说那种口气。可你自己知道，你只是每一回都选了那个更难一点的选项。',ctx);
  if(ctx.tough>=3) return mkEnd('九死未悔','hidden','你的灯被吹灭过很多次。每一次你都以为这回是真的完了。可灯芯这东西，灭了还能再点着。你点了很多很多次。',ctx);
  if(A.coin>=8&&core<=14) return mkEnd('金灯无芯','special','你最后什么都有了：铺面、银元、体面。只是夜里灯太亮，亮得你看不清任何一张脸。你不缺灯，你缺的是灯底下坐着的人。',ctx);
  if(A.soc<=1&&core>=12) return mkEnd('独照','special','你几乎没让任何人真正走近过。你把自己活成了弄堂口那盏路灯：照过很多人，谁也没上过你的楼。',ctx);
  if(L['还']>=3&&(L['赊']||0)<=0) return mkEnd('雪落无声','special','你回到那口填了的井边，坐在青石板上，什么也不想。你欠这世道的还清了，世道欠你的，你不打算要了。雪落下来，没有声音。',ctx);
  var b=ctx.bucket;
  if(b==='chuan')    return mkEnd('传灯者','normal','你走后很久，还有人在夜里读你留下的那本书。灯换了一盏又一盏，火还是那一点火。',ctx);
  if(b==='zhideng')  return mkEnd('执灯人','normal','你这一生没干成什么惊天动地的事，可你守住了该守的人。胡同的烟火里，你的灯最亮，也最安稳。',ctx);
  if(b==='yuanxing') return mkEnd('点灯的远行者','normal','当年那个被看轻的孩子，一路逆风，走得很远。你走过的路后来成了别人的路标。',ctx);
  if(b==='guntang')  return mkEnd('滚烫的人','normal','你从没真的停下来过。别人说你折腾，你自己知道，你只是不愿意凉。',ctx);
  if(b==='shoudeng') return mkEnd('守灯的人','normal','你没有把谁照亮成太阳，你只是让身边的人，在关键时刻没黑着。寻常日子被你过成了诗。',ctx);
  if(b==='quejiao')  return mkEnd('缺一角的灯','normal','你这一生有太多话没说出口。到最后你跟那些遗憾坐在一张桌前，各自喝了一杯，谁也没提当年。',ctx);
  return mkEnd('灯与雪','normal','你一直在找归宿。找了很多年才发现，归宿不在远方，在你出发的那场雪里。',ctx);
},
epitaph:function(ctx){
  var m=ctx.main;
  var pool={
    '供':['爹，我挺好的。','这一回，我没迟到。'],

    '走':['人生是一条铁轨，我踩上去了，就没下来。'],

}

prologue:function(s){

  '产房在二楼最里头，走廊尽头是值班室。值班室那盏台灯一夜没关，全院就它一盏亮着。灯泡是从家属院传达室借来的，说好天亮前必须还。',
  '护士出来报信，说是个'+(g?'闺女':'小子')+'，哭声真亮。你父亲正蹲在楼梯口，手插在袖子里。他应了一声，站起来就往下跑。',

 {id:'y27',n:'空着的座位',when:function(s){return s.age>=22&&s.age<=55},text:'早读点名，点到第三排靠窗那个名字，没人应。桌洞里还放着他昨天没写完的作业本。',out:[{c:function(s){return s.attrs.vit>=5},t:'下了课你骑车去找，在砖窑上找到他，他跟着他叔搬了三天砖。你把书包递过去，说，先回来把这一章学完。',fx:{attrs:{vit:-1},lamps:{扛:1}}},{c:function(s){return s.attrs.coin>=4},t:'你托人捎话去问，才知道他家要他早点去学徒。你从工资里拿出一点，替他把这学期的书本费交了，跟谁也没提。',fx:{attrs:{coin:-1},lamps:{暖:1}}},{t:'你在教室后排站了一会儿，把他的名字在本子上圈了一下。第二天那个座位还是空着。',fx:{lamps:{歉:1},attrs:{men:-1}}}]},
 {id:'y28',n:'一袋鸡蛋',when:function(s){return s.age>=22&&s.age<=58},text:'期末考完那天，一个学生的娘在校门口等你，手里拎着一袋鸡蛋，说是自家鸡下的。',out:[{c:function(s){return s.attrs.soc>=4},t:'你收下了，第二天给她儿子买了一支钢笔。她后来见人就说，那位老师不嫌我们。',fx:{attrs:{soc:1,coin:-1},lamps:{搭:1}}},{c:function(s){return s.attrs.men>=4},t:'你追出去两条街，把袋子塞回她手里。她说老师你这是看不起我。最后你留下三个，剩下的让她拎了回去。',fx:{attrs:{men:1},lamps:{忍:1}}},{t:'你没推掉，拎回了宿舍。那袋鸡蛋你吃了半个月，越吃越觉得沉。',fx:{attrs:{vit:1},lamps:{歉:1}}}]},
 {id:'y29',n:'公开课讲砸了',when:function(s){return s.age>=26&&s.age<=55},text:'教研组来听你的公开课，后排坐着七八位老师。讲到一半，你把黑板上一道例题抄错了。',out:[{c:function(s){return s.attrs.arc>=5},t:'你当场把那道题划掉，从头重讲了一遍，讲完正好打下课铃。评课时老教师说，就冲你敢划掉那一行。',fx:{attrs:{arc:1},lamps:{坦:1}}},{c:function(s){return s.attrs.men>=5},t:'你越讲越乱，后半节自己都不知道讲到哪儿了。下课你把教案合上，回办公室从头备了一遍，备到天黑。',fx:{attrs:{men:1},lamps:{研:1}}},{t:'你把黑板一擦，装作什么都没发生。往后组里再有人听你的课，你总要先试讲两遍。',fx:{attrs:{arc:-1},lamps:{忍:1}}}]},
 {id:'y30',n:'他考上了师范',when:function(s){return s.age>=35&&s.age<=62},text:'暑假里有人敲门。开门一看，是你早年教过的一个学生，手里捏着一张录取通知书。',out:[{c:function(s){return s.attrs.soc>=5},t:'他说他报了师范，往后也想站讲台。你把那张通知书看了两遍，问的头一句是：你家里同意吗。',fx:{attrs:{soc:1},lamps:{传:1}}},{c:function(s){return s.lamps['暖']>=1},t:'他坐在你家那张掉了漆的方桌边上，说当年你替他交过一回书本费，他一直记着。你说那点事早忘了。',fx:{attrs:{men:1},lamps:{暖:1}}},{t:'你请他吃了一碗面，面煮得软了。他走的时候你送到楼下，隔着窗户看他拐过街口。',fx:{lamps:{传:1},attrs:{coin:-1}}}]},
 {id:'y0a',n:'广播室的门',when:function(s){return s.age>=6&&s.age<=16},text:'放学后广播室没锁门，话筒的指示灯亮着。走廊里空无一人。',
  out:[{c:function(s){return s.attrs.men>=4},t:'你按下开关，念了一段自己编的话，整座校园的喇叭都在响。第二天被叫去办公室，你一句没辩解。',fx:{attrs:{men:1},lamps:{闯:1}}},
       {t:'你把门轻轻带上，回教室写作业。第二天有人说是风把喇叭吹响的。',fx:{attrs:{men:1},lamps:{忍:1}}}]},
 {id:'y0b',n:'一场放映',when:function(s){return s.age>=6&&s.age<=16},text:'放映队来了，幕布挂在操场那两棵老槐树之间。散场时人潮把小伙伴冲散了。',
  out:[{c:function(s){return s.attrs.vit>=4},t:'你逆着人流找了两条街，在一盏路灯下把他找到。他哭得满脸灰。',fx:{attrs:{vit:1},lamps:{追:1}}},
       {t:'你跟着人群回了家，第二天才知道他自己摸回了院子。谁也没提这件事。',fx:{attrs:{men:1},lamps:{念:1}}}]},
 {id:'y1',n:'一场家访',when:function(s){return s.age>=22&&s.age<=58},text:'你班上有个孩子连着三天没来，你去他家看了看。',
  out:[{c:function(s){return s.attrs.vit>=5},t:'你走了两个小时的山路。孩子蹲在门口，说他爹不让念了。你磨了一下午，把人带回去了。',fx:{attrs:{vit:-1},lamps:{扛:1}}},
       {t:'你走到半路就折返了。第二天那孩子的座位空着，一直空到期末。',fx:{lamps:{歉:1},attrs:{men:-1}}}]},
 {id:'y2',n:'屋顶漏雨',when:function(s){return s.age>=18},
  out:[{c:function(s){return s.attrs.coin>=3},t:'你寄钱回去，请人翻了屋顶。母亲说，不漏了。',fx:{attrs:{coin:-1},lamps:{念:1}}},
       {t:'你只寄得出一半。母亲说不漏了。你后来才知道，她拿盆在堂屋接了半个冬天。',fx:{attrs:{men:-1},lamps:{歉:1}}}]},
 {id:'y3',n:'老同学开口',when:function(s){return s.age>=22},
  out:[{c:function(s){return s.attrs.soc>=4},t:'你帮了他。两年后他给你牵来一条路。',fx:{attrs:{soc:1,coin:1},lamps:{搭:1}}},
       {t:'你说自己也不方便。对面沉默了一下，说没事。后来就再没联系了。',fx:{attrs:{soc:-1}}}]},
 {id:'y4',n:'一场感冒',when:function(s){return s.age>=18&&s.age<=55},
  out:[{c:function(s){return s.attrs.vit>=5},t:'烧到三十八度，睡了一天，出了身汗，好了。',fx:{attrs:{vit:1}}},
       {t:'烧了三天。你没请假，怕误课。拖成了咽炎，此后每年冬天都犯。',fx:{attrs:{vit:-1,men:-1}}}]},
 {id:'y5',n:'一节公开课',when:function(s){return s.attrs.arc>=4&&s.age>=22},text:'校长推门进来听课，坐在了最后一排。',
  out:[{t:'你讲了半节课，越讲越松。下课后校长只说了一句：这个班交给你，我放心。',fx:{attrs:{arc:1},lamps:{走:1}}}]},
 {id:'y6',n:'分房',when:function(s){return s.age>=25&&s.age<=45},
  out:[{c:function(s){return s.attrs.soc>=4},t:'你分到了一间朝南的。窗外有棵梧桐，风一吹就往窗上贴。',fx:{attrs:{soc:1}}},
       {t:'你排在了名单末尾。你搬进最靠边的一间，冬天漏风。',fx:{attrs:{men:-1},lamps:{忍:1}}}]},
 {id:'y7',n:'母亲捎来的话',when:function(s){return s.age>=12},
  out:[{c:function(s){return s.flags.no_goodbye},t:'她问你吃了没。你说吃了。捎话的人走了以后，你坐了很久，有些话这辈子都问不出口了。',fx:{attrs:{men:-1},lamps:{歉:1}}},
       {t:'她问你吃了没。你回话说吃了。其实那天你还没吃。',fx:{lamps:{念:1}}}]},
 {id:'y8',n:'毕业照',when:function(s){return s.age>=32},text:'第一届学生二十年聚会，把你请去了。',
  out:[{c:function(s){return s.attrs.soc>=5},t:'三十几个人挤在包间里，抢着说当年的事。有人还留着你批过的那本作业。',fx:{attrs:{soc:1},lamps:{传:1}}},
       {t:'你没去。后来他们捎来一张合照，第一排正中间空着一个位置，是给你留的。',fx:{lamps:{忍:1}}}]},
 {id:'y9',n:'体检报告',when:function(s){return s.age>=40},
  out:[{c:function(s){return s.attrs.coin>=4},t:'嗓子长了个小结节。你花钱做了复查，虚惊一场。医生说，少讲课多喝水。',fx:{attrs:{coin:-1}}},
       {t:'嗓子长了个小结节。你说等带完这届。这一等，就是三年。',fx:{attrs:{vit:-1},flags:{sick:1}}}]},
 {id:'y10',n:'学校拆迁',when:function(s){return s.age>=35},text:'老校区要拆了，那排平房教室下个月动工。',
  out:[{c:function(s){return s.lamps['念']>=1},t:'你回去看过一次。黑板还在，讲台没了。你站在空教室里，摸了很久那块磨白的黑板。',fx:{lamps:{化:1}}},
       {t:'你听说了，没去。哦，拆了啊。你说。',fx:{lamps:{忍:1}}}]},
 {id:'y11',n:'一个差生',when:function(s){return s.age>=25&&s.age<=55},text:'一个学生的成绩一直在末位，家长已经放弃了。',
  out:[{c:function(s){return s.attrs.men>=5},t:'你把他留下来补了半年课。期末他及格了，卷子上画了个歪歪扭扭的笑脸。',fx:{attrs:{men:1},lamps:{陪:1}}},
       {t:'你想找他谈谈，一直没找到合适的时间。后来他转学了。',fx:{lamps:{歉:1}}}]},
 {id:'y12',n:'一摞旧卷子',when:function(s){return s.age>=20},text:'整理资料室，你翻出一摞三十年前的旧卷子。',
  out:[{c:function(s){return s.attrs.arc>=5},t:'上面的字迹是当年一位老先生的手书。你把它裱起来，挂在了办公室里。',fx:{attrs:{arc:2},lamps:{传:1}}},
       {t:'你翻了翻，觉得没用，扔了。多年后你在校史馆里又见到同样一份。',fx:{attrs:{men:-1}}}]},
 {id:'y13',n:'一纸调令',when:function(s){return s.age>=30&&s.age<=50},text:'教育局想调你去做行政，坐办公室，不用带班。',
  out:[{c:function(s){return s.attrs.soc>=5},t:'你去了两年又回来了。你说，桌子太干净，心里空。',fx:{attrs:{soc:1,coin:1},lamps:{走:1}}},
       {t:'你去了。往后很多年，你在走廊里听见下课铃，总要愣一下。',fx:{attrs:{coin:1,men:-1},lamps:{歉:1}}}]},
 {id:'y14',n:'讲台上的灯',when:function(s){return s.age>=30&&s.tough>=1},text:'那盏用了很多年的讲台台灯，忽然不亮了。',
  out:[{t:'你换了根灯丝，它又亮了。你看着它发了会儿呆，接着讲课。',fx:{lamps:{暖:1},attrs:{men:1}}}]},
 {id:'y15',n:'一个转学生',when:function(s){return s.age>=25&&s.age<=58},text:'班里转来一个孩子，衣服洗得发白，谁也不理。',
  out:[{c:function(s){return s.attrs.coin>=4},t:'你给他买了一套新文具，说是学校发的。二十年后他回来看你，说老师，我一直知道那是你买的。',fx:{attrs:{coin:-1},lamps:{传:1}}},
       {t:'你想管，又怕别人说你偏心。你什么都没做。',fx:{lamps:{歉:1},attrs:{men:-1}}}]},
 {id:'y16',n:'同科相争',when:function(s){return s.age>=28},text:'一个你带出来的年轻老师，抢了你的评优名额。',
  out:[{c:function(s){return s.attrs.men>=5},t:'你没争。你把他叫来，把该交代的都交代了。他红着脸走了。',fx:{attrs:{men:1},lamps:{化:1}}},
       {t:'你跟他翻了脸，从此一个办公室不搭话。',fx:{attrs:{soc:-1},lamps:{歉:1}}}]},
 {id:'y17',n:'一场大雨',when:function(s){return s.age>=18},text:'你留堂讲题，出来时下起了暴雨。',
  out:[{t:'你站在教学楼门口等雨停。一个学生跑回来给你送伞，说老师我家近。你拿着那把伞走了一路。',fx:{attrs:{men:2},lamps:{暖:1}}}]},
 {id:'y18',n:'故乡来人',when:function(s){return s.age>=28},text:'老家的亲戚找到你，说你母亲坟头草高了。',
  out:[{c:function(s){return s.attrs.coin>=3},t:'你连夜赶回去，把坟修了，又住了一个月。',fx:{attrs:{coin:-1},lamps:{孝:1}}},
       {t:'你说等这学期结束。亲戚点点头走了。你后来一直没回去。',fx:{lamps:{歉:1},attrs:{men:-1}}}]},
 {id:'y19',n:'一封信',when:function(s){return s.age>=35},text:'你收到一封没有署名的信，从很远的城市寄来。',
  out:[{c:function(s){return s.attrs.men>=4},t:'信上只有一句：老师，我现在也在讲台上。你把信夹进了教案本。',fx:{lamps:{传:1},attrs:{men:1}}},
       {t:'你拆开看了，没看懂是谁。后来那封信放在抽屉里，慢慢忘了。',fx:{lamps:{念:1}}}]},
 {id:'y20',n:'退休的表',when:function(s){return s.age>=55},text:'教务处把退休的表放在你桌上，让你签个字。',
  out:[{t:'你把它折起来，放进衣服内袋，像当年你父亲收你的奖状那样。',fx:{lamps:{回:1},attrs:{men:1}}}]}
],
chapters:[
 {variants:2,t:'第一章 · 大院与传达室',age:6,
  body:function(s){if(s.v===1)return['母亲走的那天没下雪，刮的是北风。她把你的被褥抱到奶奶屋里，把房门钥匙挂回门后那根钉子上，说了声我走了，声音很平。','你追到巷口，她已经坐上邻居的自行车后座。车子拐弯的时候歪了一下，她没回头。后来她跟人说，那天要是回了头，车就骑不稳了。','你回屋，看见她在你作业本的封皮上写了一行字：把这本写完。你写了很久才写完。写完那年她回来过一趟，住了三天，又走了。'];if(s.v===1)return['母亲走的那天没下雪，刮的是北风。她把你的被褥抱到奶奶屋里，把房门钥匙挂回门后那根钉子上，说了声我走了，声音很平。','你追到巷口，她已经坐上邻居的自行车后座。车子拐弯的时候歪了一下，她没回头。后来她跟人说，那天要是回了头，车就骑不稳了。','你回屋，看见她在你作业本的封皮上写了一行字：把这本写完。你写了很久才写完。写完那年她回来过一趟，住了三天，又走了。'];return ['你的童年，是一盏替全院亮着的灯。',
   '大院门口的传达室，窗台上搁着一盏台灯。灯罩黄得看不出本来颜色。看门的周爷爷用它做三件事：看信、认人、等夜归的人。',
   '你放学回来喜欢在灯下站一会儿。周爷爷问你站这儿干什么。你说暖和。他说那是灯泡的功劳，不是我的。',
   '你父亲在厂里三班倒，一个月见不到几回。有一回他难得早归，从工装口袋里掏出一支红蓝铅笔，笔尖已经用秃了，是他自己的。他什么也没说，放在桌上，第二天一早就走了。',
   '你舍不得用，只在作业本边角上画过一次线。后来笔让水泡烂了半截。你把剩下的那半截插在笔筒最里头，插了很多年。',
   '然后某天，母亲说要去外地进修。',
   '她走的那天落雪。你站在传达室门口，看见她走一步回一次头，走一步回一次头，一共回了七次。',
   '周爷爷把台灯往你这边转了转：别哭。灯是给等的人留的。你妈在那边，也有人给她留灯。'];},
  choices:[
   {k:'A',t:'追到院门口，攥住她背包的带子',
    body:['你母亲蹲下来，把围巾在你脖子上绕了两圈。她说：乖，妈很快回来。然后她把你的手从她衣角上拿开，攥了攥，放开。',
     '你站在院门口看她往街口走。走到一半她停下来，又回头看了一眼，那一眼看得不长，但是很重。'],
    fx:{lamps:{念:1},attrs:{men:-1},flags:{chased:1}},hint:'念↑｜耐心↓'},
   {k:'B',t:'替她拎起行李，说家里有我看着',
    body:['你挥了挥手，声音很大，大到院里两个人都听见了。你母亲背对着你站住了几秒，肩膀动了一下，还是走了。',
     '那天中午你把院里那盆衣裳洗了。水凉，洗完手僵得握不住筷子。奶奶把饭菜往你跟前推了推，一句话没说。'],
    fx:{lamps:{扛:1},attrs:{men:1,vit:-1}},hint:'扛↑｜耐心↑ 精力↓'},
   {k:'C',t:'退回屋里，把生字抄到第三行',
    body:['你回了屋，把作业本翻开。那天的作业是抄写生字，一个字一行。你抄到第三行就停住了，笔尖在纸上洇出一个墨点。',
     '你盯着那个墨点，一直盯到它干。'],
    fx:{lamps:{忍:1},attrs:{men:1}},hint:'忍↑｜耐心↑'}
  ]},
 {variants:2,t:'第二章 · 石桥与县中',age:15,
  body:function(s){if(s.v===1)return['中考的分数下来那天，你骑车去县中看榜。榜贴在传达室旁边那面墙上，红纸黑字，你在最后几行里找到自己的名字，刚够自费线。','回家你没提这件事，把那张纸折成方块压在枕头底下。夜里父亲翻你书包找火柴，翻出来了，就着灯看了很久，问你：这上面写的多少钱。','第二天他换了件干净褂子出门，天黑了才回来，凑的钱还差一截，鞋面上全是泥。他把钱数了两遍，说：先报上，剩下的我去想办法。'];if(s.v===1)return['中考的分数下来那天，你骑车去县中看榜。榜贴在传达室旁边那面墙上，红纸黑字，你在最后几行里找到自己的名字，刚够自费线。','回家你没提这件事，把那张纸折成方块压在枕头底下。夜里父亲翻你书包找火柴，翻出来了，就着灯看了很久，问你：这上面写的多少钱。','第二天他换了件干净褂子出门，天黑了才回来，凑的钱还差一截，鞋面上全是泥。他把钱数了两遍，说：先报上，剩下的我去想办法。'];return ['母亲在外地进修，一年回来一趟，行李里总有一摞写满字的备课本。你翻过，字比你的作业本工整。她走那天把备课本留下，说，拿去当草稿纸。',
   '奶奶不识字，教不了你。老师发的通知她折得方方正正，等你放学回来念给她听。念到家长签字那一栏，她按一个指印，指印歪着，像一枚没盖正的章。',
   '厂里那几年减人，父亲从车间退了下来，不再上夜班，天天坐在院门口那把藤椅上。有一回你放学回来，看见他手里捏着你四年级的作业本，一页一页翻，翻完又从头翻。他抬头看见你，把本子合上，说，回来啦。',
   '去县中要过一座石桥，桥下常年停着一只旧船。你每天早晚各过一趟，书包带子在肩上勒出两道印。桥头那盏路灯坏了整一年，晚自习回来，你们几个就打着手电筒结伴走。',
   '那年冬天你把三好学生的奖状拿回家。父亲看了很久，只问了一句：你们班多少人？你说四十六个。他点点头，把奖状抚平，夹进那只装粮票的铁盒里。'];},
  choices:[
   {k:'A',t:'把书包撂在桌上，说我不念了',
    body:['你父亲把搪瓷缸往桌上一顿，缸沿磕出一道白印。他吼你：谁准你不念的？吼完自己坐下去，两只手撑着膝盖，很久没抬头，说，是爸没本事。'],
    fx:{lamps:{扛:1},attrs:{coin:1,arc:-1,men:1},flags:{quit_school:1}},hint:'扛↑｜工资↑ 学养↓｜锁死：升学线关闭'},
   {k:'B',t:'报考免费的中等师范',
    body:['父亲用筷子在桌上划了两下，说，师范好，出来吃粉笔灰。你在师范念了三年，每天早上到操场背书，冬天呵出的白气在书页边上结一层霜。'],
    fx:{lamps:{走:1},attrs:{arc:1},flags:{tech:1}},hint:'走↑｜学养↑'},
   {k:'C',t:'撂下话：考不上重点，我就不回这个院',
    body:['父亲没说话。半夜你醒来，听见他压着嗓子跟母亲说：把咱家那间老屋抵了吧，孩子有出息是大事。'],
    fx:{lamps:{考:1},attrs:{arc:1,coin:-1,men:-1}},hint:'考↑｜学养↑ 工资↓ 耐心↓'}
  ]},
 {variants:2,t:'第三章 · 十七岁的志愿表',age:17,
  body:function(s){if(s.v===1)return['填志愿那天下午，{ta}把空白的表推到你桌上，说，你填什么我就填什么。教室后墙的板报还没揭，前两名的名字挨在一起。','{ta}的家长第二天来了学校，在教导处门口把那张表对折撕成两半。你站在走廊里，手里攥着自己填好的那一张，没敢过去。','后来{ta}转去了邻县的中学。走之前托人捎回一本翻旧的《数学手册》，扉页上只有一行小字：你填的那所学校，我记住名字了。'];if(s.v===1)return['填志愿那天下午，{ta}把空白的表推到你桌上，说，你填什么我就填什么。教室后墙的板报还没揭，前两名的名字挨在一起。','{ta}的家长第二天来了学校，在教导处门口把那张表对折撕成两半。你站在走廊里，手里攥着自己填好的那一张，没敢过去。','后来{ta}转去了邻县的中学。走之前托人捎回一本翻旧的《数学手册》，扉页上只有一行小字：你填的那所学校，我记住名字了。'];return ['十七岁那年，你的课桌里多了一张纸条。',
   '那个总在课间回头看你的人，志愿表填了另一所学校，走前把纸条压在你的课本底下。你翻到它，是三天以后的事。纸条很短，字很好看，写着：你总发呆看窗外，到底在看什么？',
   '信封上没留地址，你也没处问。那张纸条你夹进一本《边城》，夹在翠翠等渡船的那一页。'];},
  choices:[
   {k:'A',t:'把纸条夹进《边城》，再没翻开',
    body:['后来你搬宿舍，一箱旧书卖给了收废品的。你站在路口，看那辆三轮车拐过街口。夹在书里的那张纸条，你没抽出来。'],
    fx:{lamps:{念:1},attrs:{men:-1}},hint:'念↑｜耐心↓'},
   {k:'B',t:'骑车追到{ta}的新学校门口',
    body:['你骑了四十里车，找到那所学校，在门口的布告栏前站了一下午，没等到{ta}。天黑了你推着车往回走，一路上想的都是那张志愿表。后来你们再没见面，这一趟路你记了一辈子。'],
    fx:{lamps:{闯:1},attrs:{vit:1,soc:1}},hint:'闯↑｜精力↑ 师生缘↑'},
   {k:'C',t:'回了一封挂号信，原样退回来',
    body:['信退回那天，你把它压在枕下，让那股墨香陪你睡了很多年。'],
    fx:{lamps:{研:1},attrs:{arc:1}},hint:'研↑｜学养↑'}
  ]},
 {variants:2,t:'第四章 · 去省城的师范',age:18,
  body:function(s){if(s.flags.quit_school)return['你终究是没走进那间考场。','同班在教室里做最后的冲刺，你背着铺盖卷从校门口路过，没敢抬头。','父亲送你到车站，塞给你二十块钱，说，实在不行就回来。'];
    if(s.v===1)return['那年七月，父亲去了一趟学校。他不识路，在传达室门口站了半个钟头，等班主任下课。他问的话只有一句：还有没有别的法子。','班主任把两所学校的招生简章摊在桌上，用红笔从中间划了一道。父亲两道都看了，先问哪边不要学费，又把简章折起来揣进兜里。','回去的路上他一句话没说。走到石桥那头他才开口：差的那两分，我不问了。你要是还想念，家里省着吃；你要是不想念，我也不骂你。'];
    if(s.v===1)return['那年七月，父亲去了一趟学校。他不识路，在传达室门口站了半个钟头，等班主任下课。他问的话只有一句：还有没有别的法子。','班主任把两所学校的招生简章摊在桌上，用红笔从中间划了一道。父亲两道都看了，先问哪边不要学费，又把简章折起来揣进兜里。','回去的路上他一句话没说。走到石桥那头他才开口：差的那两分，我不问了。你要是还想念，家里省着吃；你要是不想念，我也不骂你。'];return['高考那年的七月，热得反常，教室那台吊扇转起来晃悠悠的。','考场就设在你自己念过三年的那栋楼里，桌面上还留着上一届刻的字。考完最后一科你走出校门，看见父亲站在槐树底下，攥着一瓶汽水，瓶身的水珠淌了他一手。他看见你就递过来：解解暑。','一句也没问考得怎么样，只说，走，回家吃饭。那顿饭他给你盛了两次饭。','成绩下来那天，你骑车去学校看榜，从最后一行往上找，找到第一行也没找到自己的名字。差两分。','那一晚院里的灯亮到后半夜。父亲走进你屋里，在你床边坐下来，两只手在膝盖上搓了搓，说：补习班再念一年，钱我想办法。'];
  },
  choices:[
   {k:'A',t:'回县中的补习班，再赌一年',cond:function(s){return !s.flags.quit_school},lock:'你早就辍学了，这条路已经关上',
    body:['补习班的教室在顶楼，冬天冻手，你就把卷子压在袖口底下写。第二年你考上了。通知书送到那天，父亲翻来覆去地看，看完折好塞进口袋，过一会儿又拿出来看了一遍。'],
    fx:{lamps:{考:1},attrs:{arc:2,men:-1,coin:-1},years:1},hint:'考↑｜学养↑↑ 耐心↓ 工资↓｜耗 1 年'},
   {k:'B',t:'“爸，我去深圳进厂，早点挣钱”',cond:function(s){return !s.flags.quit_school},lock:'你早就辍学了，这条路已经关上',
    body:['你背起那个蛇皮袋，坐上南下的绿皮火车。车窗能拉开，风灌进来带着煤灰味。对座的大叔泡了碗面，味道在车厢里散开。你把脸迎在风里，想的是那张没填完的志愿表。'],
    fx:{lamps:{走:1},attrs:{coin:1,arc:1},flags:{south:1}},hint:'走↑｜工资↑ 学养↑'},
   {k:'C',t:'去一所学费便宜的外省师范',cond:function(s){return !s.flags.quit_school},lock:'你早就辍学了，这条路已经关上',
    body:['外省的师范学费便宜，你算过三遍账才填的。车开动那一刻你回头，父亲站在月台上，越来越小。你摸着口袋里的通知书，纸是软的，捏在手里却沉。'],
    fx:{lamps:{调:1},attrs:{arc:1,soc:1,coin:-1}},hint:'调↑｜学养↑ 师生缘↑ 工资↓'},
   {k:'A',t:'去深圳进厂',cond:function(s){return !!s.flags.quit_school},lock:'你还在念书',
    body:['你跟着同乡上了南下的火车。车间里的机器声响得比下课铃还准点。第一个月你寄回去三百块，附了一张从作业本上撕下来的纸：我挺好的。'],
    fx:{lamps:{走:1},attrs:{coin:1,vit:-1},flags:{south:1}},hint:'走↑｜工资↑ 精力↓'},
   {k:'B',t:'留在县城当代课老师',cond:function(s){return !!s.flags.quit_school},lock:'你还在念书',
    body:['你接了村小的代课活，一个月二十八块。孩子们叫你老师的时候，你耳朵有点热。你开始自己读教育学。'],
    fx:{lamps:{扛:1},attrs:{arc:2},flags:{tech:1}},hint:'扛↑｜学养↑↑'},
   {k:'C',t:'白天打工，晚上自考',cond:function(s){return !!s.flags.quit_school},lock:'你还在念书',
    body:['你白天搬砖，晚上在工棚的灯下看书。蚊子围着灯泡撞，你一手拍蚊子一手翻页。六年后你拿到了那张文凭，没人知道它有多重。'],
    fx:{lamps:{考:1},attrs:{arc:2,vit:-1,men:1},years:1},hint:'考↑｜学养↑↑ 精力↓ 耐心↑｜耗 1 年'}
  ]},
 {variants:2,t:'第五章 · 单身宿舍与第一份工资',age:22,
  body:function(s){if(s.v===1)return['第一个月的工资是在教务处领的。一张工资条，一沓票子，会计让你在新来的名册上签名。签名的笔是公用的，笔杆上有一排牙印。','你数了两遍，数目比预想的少，可数第二遍的时候手是稳的。出门时同办公室的老教师拍你肩膀：头一个月都这样，往后就好了。','当天下午你去了一趟供销社，买了一只搪瓷脸盆、一支红笔、两斤红糖。红糖用草纸包着，是给奶奶捎的，拎回宿舍的路上你一直闻见甜味。'];if(s.v===1)return['第一个月的工资是在教务处领的。一张工资条，一沓票子，会计让你在新来的名册上签名。签名的笔是公用的，笔杆上有一排牙印。','你数了两遍，数目比预想的少，可数第二遍的时候手是稳的。出门时同办公室的老教师拍你肩膀：头一个月都这样，往后就好了。','当天下午你去了一趟供销社，买了一只搪瓷脸盆、一支红笔、两斤红糖。红糖用草纸包着，是给奶奶捎的，拎回宿舍的路上你一直闻见甜味。'];return ['学校不相信眼泪，也不相信文凭。',
   '你住进单身宿舍，墙皮斑驳，一张床、一张桌、一扇朝北的窗。窗外那盏路灯每晚准时亮，像是这所学校里唯一愿意陪你的东西。',
   '第一个月，你每天备课到十二点，第二天六点半站在讲台上。第一笔工资到账那天，你站在邮局柜台前看着那一串数字，第一次觉得自己是个大人了。',
   '你往传达室打电话，让周爷爷去叫你奶奶。她在那头说，我娃瘦了。你说没有，学校食堂管饱。父亲接过话筒，只说了一句：钱自己留着，别舍不得吃。'];},
  choices:[
   {k:'A',t:'工资分两半，一半汇回大院',
    body:['母亲在电话里念你乱花钱，念到后面声音低下去。父亲在旁边说了三个字：好孩子。挂了电话你没直接回宿舍，绕着操场走了两圈。'],
    fx:{lamps:{扛:1},attrs:{coin:-1,men:1}},hint:'扛↑｜工资↓ 耐心↑'},
   {k:'B',t:'全留给自己，报名进修 / 买一台旧录音机',
    body:['你把钱花在自己身上，报了个进修班。后来这门本事，成了你讲台上站四十年的底子。你偶尔想起传达室周爷爷那句话：灯是给等的人留的，也是要自己去点的。'],
    fx:{lamps:{走:1},attrs:{arc:2}},hint:'走↑｜学养↑↑'},
   {k:'C',t:'请同办公室的老师吃了顿饭',
    body:['那顿饭吃得很热闹，笑声快把宿舍楼掀了。你头一回知道，在一所学校站住脚，光靠课上得好不够，还得有人肯在你发烧时替你顶两节课。'],
    fx:{lamps:{搭:1},attrs:{soc:2,coin:-1}},hint:'搭↑｜师生缘↑↑ 工资↓'}
  ]},
 {variants:2,t:'第六章 · 父亲没说出口的话',age:28,
  body:function(s){if(s.v===1)return['父亲是在院里倒下的，倒在他自己搭的那架葡萄棚底下。邻村的人骑车到学校捎信，进办公室的时候，裤腿上全是泥点。','你把课托给隔壁班的老师，{ta}从走廊那头追出来，往你怀里塞了件外套：家里的事你别惦记，学生的本子我带回来批。','他醒过来以后不认字了，却要你把学生的作文念给他听。你坐在床边一篇一篇念，念到那篇写我爹的手，他闭上眼，手在被面上抓了抓。','临走那晚，他从枕下摸出一张叠成四折的纸，是你小学四年级写的作文，纸边磨起了毛。他说：这张比那身旧工装值钱，你拿走吧。'];if(s.v===1)return['父亲是在院里倒下的，倒在他自己搭的那架葡萄棚底下。邻村的人骑车到学校捎信，进办公室的时候，裤腿上全是泥点。','你把课托给隔壁班的老师，{ta}从走廊那头追出来，往你怀里塞了件外套：家里的事你别惦记，学生的本子我带回来批。','他醒过来以后不认字了，却要你把学生的作文念给他听。你坐在床边一篇一篇念，念到那篇写我爹的手，他闭上眼，手在被面上抓了抓。','临走那晚，他从枕下摸出一张叠成四折的纸，是你小学四年级写的作文，纸边磨起了毛。他说：这张比那身旧工装值钱，你拿走吧。'];return ['你成家了。{ta}在同一所学校教另一门课，办公室隔着一道走廊。你们每天一起骑车上下班，冬天{ta}的手套总丢一只。那年你带的班考了年级第一，你在讲台上站了半节课没出声，心里那盏灯，头一回烧得很旺。',
   '父亲病倒是在你带第三届的那年，肺里积了几十年的棉尘。你请了三天假回去，看见床上的他瘦了一大圈，见你进门还想撑着坐起来，说小毛病，别耽误你上课。',
   '临走那晚，父亲支开母亲，从枕下摸出一只铁盒。盒里是你那半截红蓝铅笔，底下压着一张照片：年轻的他站在厂门口，工装扣子扣到最上头，身后是那年冬天的雪。',
   '他说：你爸我这辈子没给你挣下什么，就这一身硬骨头和这颗要强的性子，你拿去吧。'];},
  choices:[
   {k:'A',t:'先留下来，把课调开再回',
    body:['你在老家待了两周。白天你给他念报纸，念到教育版他就让你慢些；傍晚他把藤椅搬到院里，看你坐在门槛上批作业。后来你总说，那两周是你一生里最好的两周。'],
    fx:{lamps:{陪:1},attrs:{coin:-1,men:1},flags:{father_stay:1}},hint:'陪↑｜工资↓ 耐心↑'},
   {k:'B',t:'赶回学校，承诺“忙完这阵就回”',
    body:['这一阵忙得比预想的长。期中考试那天你正在监考，教导处的老师在窗外敲玻璃。等你赶回老屋，父亲已经认不出你了。你喊爸，他眼睛动了动，不知道往哪儿看。'],
    fx:{lamps:{歉:2},attrs:{men:-1},flags:{no_goodbye:1}},hint:'歉↑↑｜耐心↓｜不可逆：第七章与第十章全部改写'},
   {k:'C',t:'请长假回去陪他',cond:function(s){return s.attrs.coin>=2},lock:'你拿不出请长假的底气（工资不足 2）',
    body:['母亲说你傻呀，一学期的课呢。你说课误了能补，爸只有一个。那半年你守着他，从立冬守到开春。等他走了，你回学校接着带那个班，课一节没落下。'],
    fx:{lamps:{孝:2},attrs:{coin:-2,men:2},flags:{father_stay:1,quit_job:1}},hint:'孝↑↑｜工资↓↓ 耐心↑↑'},
   {k:'D',t:'不再抢那个职称，把作息调回来',
    body:['你把课表挪开一节，晚上不再备课到十二点。学生的本子还是那些，可你批得动了。'],
    fx:{lamps:{守:1},attrs:{vit:2,men:1,arc:-1}},years:2,hint:'守↑｜体魄↑↑ 心力↑ 才学↓｜寿 +2'}
  ]},
 {variants:2,t:'第七章 · 灵前的灯',age:29,
  body:function(s){if(s.flags.no_goodbye)return['父亲走的那年冬天，雪下得特别大，教学楼前那根旗绳冻成了硬棍，谁也解不开。','你在灵前守了一夜。你想得最多的不是他坐在院门口翻作业本的样子，而是你最后一次见他时，他说回来啦，你说哎，然后你就走了。','他最后想说什么，你永远不知道了。他枕边压着的，是你小学的一张奖状。','灵堂那盏灯，是你踩着凳子换的灯泡。'];
    if(s.v===1)return['父亲停灵的那三天下了冻雨，村口的电线被树压断，堂屋里点的是两盏煤油灯。灯芯是你剪的，剪得齐，火苗立着不晃。','来吊唁的人里有几个你认得，是你班上学生的爹娘。他们站在门外不肯进来，说怕耽误你上课。你把人都请进屋，一人倒了一碗热水。','守到后半夜，你从教案本上撕下一页，就着灯写挽联。写完自己看了两遍，觉得那不像个儿子写的，倒像个老师写的。你把纸折起来，第二天一早重写了一副。'];
    if(s.v===1)return['父亲停灵的那三天下了冻雨，村口的电线被树压断，堂屋里点的是两盏煤油灯。灯芯是你剪的，剪得齐，火苗立着不晃。','来吊唁的人里有几个你认得，是你班上学生的爹娘。他们站在门外不肯进来，说怕耽误你上课。你把人都请进屋，一人倒了一碗热水。','守到后半夜，你从教案本上撕下一页，就着灯写挽联。写完自己看了两遍，觉得那不像个儿子写的，倒像个老师写的。你把纸折起来，第二天一早重写了一副。'];return['父亲走的那年冬天，雪下得特别大，教学楼前那根旗绳冻成了硬棍，谁也解不开。','你在灵前守了一夜。你想起他坐在院门口翻你四年级的作业本，想起他把奖状夹进装粮票的铁盒，想起他最后那句：别耽误你上课。','他这辈子没给你讲过一道题，只留下一句半的话，你到这时候才听明白。','你守在灵前，那盏灯从头天晚上亮到天亮。'];
  },
  choices:[
   {k:'A',t:'把那半截红蓝铅笔，收回铁盒里',
    body:function(s){return s.flags.no_goodbye?['很多年后你打开那只铁盒，半截铅笔还在，笔杆上裂了一道缝。你对着它站了很久，想说爸我挺好的，最后只说了半句。']:['很多年后你打开那只铁盒，半截铅笔还在，笔杆上裂了一道缝。你对着它说：爸，我挺好的。']},
    fx:function(s){return s.flags.no_goodbye?{lamps:{念:1,歉:1},attrs:{men:-1}}:{lamps:{念:1}}},
    hint:'念↑（若未告别：同时歉↑ 耐心↓）'},
   {k:'B',t:'把厂门口那张老照片，摆上书架顶层',
    body:['每天出门前抬头看一眼，跟照片说一句：爸，我上课去了。他还是照片上那个扣子扣到最上头的样子。'],
    fx:{lamps:{传:1}},hint:'传↑'},
   {k:'C',t:'铅笔和照片都收进抽屉，不摆出来',
    body:['你把铁盒和照片一起收进抽屉，不摆出来。有些东西不必天天看见，它已经长在你身上了。'],
    fx:{lamps:{化:1}},hint:'化↑'}
  ]},
 {variants:2,t:'第八章 · 四十岁的分流',age:40,
  body:function(s){if(s.v===1)return['并校的通知是腊月里贴出来的，就贴在传达室旁边那面墙上，红纸黑字，底下盖着章。下课铃响的时候，学生从纸底下挤过去，没人抬头。','教研组连着开了三个晚上的会。最后一晚，组长把你的名字从带班的名单上划掉，说，老哥，先委屈一年，去管图书室也行。你说了句行。','散会你没走，在那间空教室里坐了一会儿。黑板上有学生没擦干净的字，你上去擦了，把板擦拍净，放回粉笔盒旁边，才关灯出来。'];if(s.v===1)return['并校的通知是腊月里贴出来的，就贴在传达室旁边那面墙上，红纸黑字，底下盖着章。下课铃响的时候，学生从纸底下挤过去，没人抬头。','教研组连着开了三个晚上的会。最后一晚，组长把你的名字从带班的名单上划掉，说，老哥，先委屈一年，去管图书室也行。你说了句行。','散会你没走，在那间空教室里坐了一会儿。黑板上有学生没擦干净的字，你上去擦了，把板擦拍净，放回粉笔盒旁边，才关灯出来。'];return ['四十岁那年，学校合并了。',
   '两个校区并成一个，多出来的老师要转岗。你没吵也没闹，在操场边站了一会儿，看那栋待了十八年的教学楼。办公室的桌上摊着下学期的排课表，你的名字还在第一行，铅笔写的。',
   '你开始想别的出路。四十岁的人重新排队，只能排在最后。你学会了一件事：在校领导面前，把“我教了十八年”说成“哪一届我都能带”。',
   '{ta}在饭桌上说：真不让你带了，我们就回老城去。',
   '你站在窗边，看着操场边那盏陪了你很多年的路灯。它还在亮。'];},
  choices:[
   {k:'A',t:'留下，转岗教研 / 考研重来',cond:function(s){return s.attrs.arc>=5},lock:'学养不足 5：你的底子撑不起一次转身',
    body:['你报了个研修班，每周三晚上去听课，笔记记得比学生时代还密。教研组的活你全接，公开课一节一节地磨。后来你在组里站住了。学生问过你后不后悔，你说，牌洗过还在手里，就不算输。'],
    fx:{lamps:{走:1,考:1},attrs:{arc:2,men:-1,coin:-1},flags:{fired:1}},hint:'走↑ 考↑｜学养↑↑ 耐心↓ 工资↓'},
   {k:'B',t:'一家子搬回老城，接手老屋',cond:function(s){return s.lamps['念']>=1||s.flags.father_stay},lock:'你早已无根可回（念未亮、也没陪过父亲）',
    body:['石桥还在，桥头那盏路灯也修好了。你接手父亲留下的老屋，换了瓦，在院里摆一张桌子批作业。清早过桥去上班，老邻居在门口喊你的名字。你发现人走再远，最后想回的，还是这条能听见上课铃的街。'],
    fx:{lamps:{回:1},attrs:{men:2,coin:-1},flags:{fired:1,back_home:1}},hint:'回↑｜耐心↑↑ 工资↓'},
   {k:'C',t:'既不甘心留下，也不舍得回去，两头漂着',
    body:['你开始接零散的课，这学期在这所村小，下学期换到邻县。你见过很多所学校的天亮，也见过很多个空着的座位。你偶尔想起父亲那句好好念，才明白自己这些年追的，就是“好好”两个字。'],
    fx:{lamps:{追:1,陪:-1},attrs:{soc:-1,coin:1},flags:{fired:1}},hint:'追↑ 陪↓｜师生缘↓ 工资↑｜韧度 +1'},
   {k:'D',t:'每天跟学生一起跑操',
    body:['你站在队伍最前面，跑起来比谁都慢。学生笑你，你也笑。一学期下来，你的体检单好看了。'],
    fx:{lamps:{暖:1},attrs:{vit:2,soc:1}},years:3,hint:'暖↑｜体魄↑↑ 人情↑｜寿 +3'}
  ]},
 {variants:2,t:'第九章 · 凌晨三点的教案',age:45,
  body:function(s){if(s.v===1)return['这些年你们的作息是错开的。{ta}值晚自习，你带早自习，一个屋檐下的饭常常是一个人吃，另一个人的那份扣在锅里温着。','那天你半夜批完卷子出来，看见{ta}在灯下补你一件衬衫，针脚密得不像补丁。{ta}说，袖口磨了，上讲台抬胳膊不好看。','你没坐下，先去厨房烧了一壶水，两只杯子都倒满，一杯放在{ta}手边。第二天你跟同事换了早自习，说，今天我去接{ta}下晚自习。'];if(s.v===1)return['这些年你们的作息是错开的。{ta}值晚自习，你带早自习，一个屋檐下的饭常常是一个人吃，另一个人的那份扣在锅里温着。','那天你半夜批完卷子出来，看见{ta}在灯下补你一件衬衫，针脚密得不像补丁。{ta}说，袖口磨了，上讲台抬胳膊不好看。','你没坐下，先去厨房烧了一壶水，两只杯子都倒满，一杯放在{ta}手边。第二天你跟同事换了早自习，说，今天我去接{ta}下晚自习。'];return ['你教过一届又一届。批完最后一本作文，抬头才发现，家里那盏灯和办公室那盏，亮的年头一样长。',
   '你们的话题，早就只剩孩子的分数和老人的药。备课要紧，别的，你也懒得说。',
   '那天夜里备的是《项脊轩志》。你读到"庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣"，停住了。你想起阳台那盆绿萝。她已经很久没和你一起浇过它。',
   '你没有去煮面。你合上教案，走到卧室门口。她还没睡。你说，明天周天，咱俩把那盆花分了吧，它该换盆了。她嗯了一声，过了一会儿，又轻轻地说，好啊。',
   '第二天一早，你到阳台，发现她比你先动了手。盆土翻了半地，她的手背上全是泥。'];},
  choices:[
   {k:'A',t:'把教研会挪到白天，晚上去校门口等{ta}',cond:function(s){return s.attrs.men>=4},lock:'耐心不足 4：你连自己都撑不住，顾不上别人',
    body:['你把教研组的会调到了白天。她值晚自习的日子，你就在校门口等她，手里拎着她的保温杯。同事打趣，她嘴上说不用，第二天杯子还是空着等你续。'],
    fx:{lamps:{暖:1},attrs:{soc:1,men:1}},hint:'暖↑｜师生缘↑ 耐心↑'},
   {k:'B',t:'把监考那天和调令那晚，都讲给她听',cond:function(s){return s.attrs.men>=5||s.lamps['坦']>=1},lock:'耐心不足 5：这些话你还是说不出口',
    body:['你把那些从没讲过的都讲了：父亲走时你还在监考、学校合并通知下来那晚你在空教室坐了很久、有一年你差点递了辞呈。她听完说，我一直以为你什么都不在乎。'],
    fx:{lamps:{坦:1},attrs:{men:1,soc:1}},hint:'坦↑｜耐心↑ 师生缘↑'},
   {k:'C',t:'话到嘴边，换成一句作业批完没',
    body:['话到了嘴边，又改成了那句作业批完没。你们又一起过了些年，同一张书桌，各批各的本子。灯够亮，桌面够大，手肘碰不到手肘。'],
    fx:{lamps:{陪:-1},attrs:{men:-1}},hint:'陪↓（灯暗一档）｜耐心↓'}
  ]},
 {variants:2,t:'第十章 · 母亲的病',age:52,
  body:function(s){if(s.v===1)return['母亲记不住年月了，倒记得你上课的钟点。每天下午四点半，她就把家属院的院门打开，说，放学了，我娃该回来了。','有一回她把你学生的作业本抱在怀里，一本一本地翻，说这是她儿子的字。你没纠正，坐在旁边看她翻，翻到最后一页，她又从头翻起。','她在枕头底下攒了一沓票子，卷得整整齐齐，见你进门就往你兜里塞：拿着，交学费。你说够用了。她把手按在你口袋上不松开，按了很久。'];if(s.v===1)return['母亲记不住年月了，倒记得你上课的钟点。每天下午四点半，她就把家属院的院门打开，说，放学了，我娃该回来了。','有一回她把你学生的作业本抱在怀里，一本一本地翻，说这是她儿子的字。你没纠正，坐在旁边看她翻，翻到最后一页，她又从头翻起。','她在枕头底下攒了一沓票子，卷得整整齐齐，见你进门就往你兜里塞：拿着，交学费。你说够用了。她把手按在你口袋上不松开，按了很久。'];return ['母亲老了。她常常坐在家属院门口那条长椅上，看放学的孩子从面前跑过去，一坐就是一下午。',
   '她的记性一年不如一年。有时端详你半天，问：你是哪个班的老师？你说，我是你{子}，我叫'+'{name}'+'。她哦一声，过一会儿，又问一遍。',
   '她忘了很多人，却总记得你说过食堂的菜淡。你每次进门，她手边都摆着一碟咸菜，是给你留的。',
   '那个当年在雪夜里抱着你的人，如今过马路要攥着你的袖子。'];},
  choices:[
   {k:'A',t:'把妈接到家属院来住',cond:function(s){return s.attrs.coin>=3},lock:'工资不足 3：你连一间多余的房都腾不出',
    body:['家里多了一个老小孩。你学着给她做饭、剪头发、按时分药。她夜里醒了说怕黑，你就把走廊那盏灯留着，一直亮到天亮。'],
    fx:{lamps:{陪:1,孝:1},attrs:{coin:-1,vit:-1,men:1}},hint:'陪↑ 孝↑｜工资↓ 精力↓ 耐心↑'},
   {k:'B',t:'每周六坐末班车回一趟老家',cond:function(s){return s.attrs.men>=4},lock:'耐心不足 4：你连每周一趟都撑不下来',
    body:['每个周六下午你都在回老城的班车上。亲戚们都说你有孝心。只有你知道，你是在补一件事：父亲走的时候你在监考，这一回，你不想再缺一次。'],
    fx:{lamps:{歉:-1,孝:1},attrs:{men:1}},hint:'歉→孝（灯·转化）｜耐心↑'},
   {k:'C',t:'电话里说忙，等带完这届再回',
    body:['你打电话回去，她在那头笑，说你忙你的，妈好着呢。挂了电话你在办公室坐了一会儿。后来你回去，她在门口等着，说等你好久了。那天夜里你睡在她隔壁，听见她半夜起来，在你门口站了站。'],
    fx:{lamps:{歉:2,陪:-1},attrs:{men:-1}},hint:'歉↑↑ 陪↓｜耐心↓｜韧度 +1'}
  ]},
 {variants:2,t:'第十一章 · 退休与一箱作业本',age:60,
  body:function(s){if(s.v===1)return['最后一节课，你把该讲的讲完了才说：这是最后一节，下学期换老师。底下先是静，然后有个学生问，老师你去哪儿。你说哪儿也不去，就是不上课了。','下课铃响过，你没有马上走。你把黑板擦干净，把粉笔盒里的粉笔头倒进纸篓，又把教案本摞齐，用绳子捆了两道。','教务处让你交钥匙。一串钥匙里有办公室的、资料室的，还有那间平房教室的。那排房子早拆了，钥匙却一直挂在你这一串上。你把它单独取下来，揣进口袋。'];if(s.v===1)return['最后一节课，你把该讲的讲完了才说：这是最后一节，下学期换老师。底下先是静，然后有个学生问，老师你去哪儿。你说哪儿也不去，就是不上课了。','下课铃响过，你没有马上走。你把黑板擦干净，把粉笔盒里的粉笔头倒进纸篓，又把教案本摞齐，用绳子捆了两道。','教务处让你交钥匙。一串钥匙里有办公室的、资料室的，还有那间平房教室的。那排房子早拆了，钥匙却一直挂在你这一串上。你把它单独取下来，揣进口袋。'];return ['退休那天你走出教学楼，太阳刺眼。',
   '没人来接你。你自己坐公交车回了家，进门换鞋，屋里很静。',
   '你把屋子收拾了一遍，给自己下了一碗挂面。盐放多了，你想起母亲从前总嫌你手重。',
   '你坐到窗边，看放学的小孩在楼下追跑，书包在背上一颠一颠。你当年也是这样的小孩，在传达室门口等一个从外地回来的人。',
   '你打开那个旧箱子。里面有：一支削秃的红蓝铅笔、一张没寄出的纸条、一张你们家的老照片，还有十几本学生作业，几片干枯的叶子。',
   '一箱子东西摊在桌上，就是一辈子。'];},
  choices:[
   {k:'A',t:'把四十年的教案，订成一本书',cond:function(s){return s.attrs.arc>=6},lock:'学养不足 6：你想写，却不知道从哪一句起头',
    body:['你把石桥、大雪、讲台、凌晨三点的教案，还有那些念得出名字和念不出名字的学生，全写了进去。最后一页你写：这一生点过很多盏灯，亮着的都走出去了，熄掉的那几盏，我记着。'],
    fx:{lamps:{传:2},attrs:{arc:1},flags:{wrote_book:1}},hint:'传↑↑｜学养↑｜解锁第十二章 B'},
   {k:'B',t:'约上仅剩的老同事，每周末聚一次',cond:function(s){return s.attrs.soc>=4},lock:'师生缘不足 4：你翻遍旧学生名册，找不到一个能约的人',
    body:['你们搬几把椅子坐在操场边上，看学生打球，讲当年哪个班最皮。有人耳朵背了，听不清就跟着笑。散的时候都说，下辈子还教一个办公室。'],
    fx:{lamps:{搭:1},attrs:{men:1}},hint:'搭↑｜耐心↑'},
   {k:'C',t:'把那一箱作业本捐给学校档案室',
    body:['你没扔。你把那箱作业本整整齐齐捆好，送到了学校。管档案的老师翻了翻，说，这些都是活的。'],
    fx:{lamps:{念:1,传:1}},hint:'念↑ 传↑'},
   {k:'D',t:'申请不带毕业班，把身体养回来',
    body:['你在办公室门口站了很久才开口。主任说，行啊，早该这样了。你忽然有点想哭。'],
    fx:{lamps:{暖:1},attrs:{vit:2,men:1}},years:3,hint:'暖↑｜体魄↑↑ 心力↑｜寿 +3'}

function newGame(wk){
  var w=WORLDLINES[wk]; W=w;
  dropSave();
  var gender=pick(['男','女']);
  /* 道标：开局前立的那盏灯（UI 存在 S.pendingBeacon，跨局偏好存在 META.beacon） */
  var wantBeacon=(typeof pendingBeacon!=='undefined'&&pendingBeacon)?pendingBeacon:(META.beacon||null);
  var beacon=(wantBeacon&&w.lamps&&wantBeacon.indexOf(w.key)===0)?wantBeacon.slice(1):[];
  for(var bi=0;bi<beacon.length;bi++){
    if(beacon[bi]<0||beacon[bi]>=w.lamps.length){beacon=[];break;}
  }
  S={
    wl:wk, idx:-1, phase:'pro', age:0,
    gender:gender, name:pick(w.names),
    attrs:{vit:3,men:3,arc:3,soc:3,coin:3},
    lamps:{}, flags:{}, tough:0, dim:0,
    seen:{}, log:[], peeked:{}, snapshot:null, echoesUsed:0,
    lit:{}, pending:[], var:{}, v:0,
    beacon:beacon, beaconBorn:null, traceDebt:null, pendingBeacon:null, litAge:{}, dimAge:{},
    evPool:null,   /* 整局的事件池副本（临时卡插这里，不污染共享的 W.events） */
    lampCapped:{}, /* v2.5：被对位灯压住（封顶一档）的灯 */
    cbDone:null,   /* v2.5：本局已兑现的回头账 id */
    delta:null,    /* v2.5.1：这一步改变了什么（事后反馈用，每步重置） */
    ev:null,       /* v2.5：当前等待玩家选择的事件（没有 choices 的卡走原来的自动路径） */
    lifeShift:0,   /* v2.4⑥：累计寿数偏移（年龄第一次有后果） */
    endAge:null,   /* v2.4⑥：寿终岁数；早夭时是当场那个岁数，不是 78 */
    earlyDeath:null, /* v2.4⑥：早夭结局题名（未早夭为 null） */
  };
  if(beacon.length&&beacon[0]>=0){
    /* 偏置只作用于出身/天赋，不改任何灯的判定 */
    var rr=rollBiasedStart(w,beacon[0]);
    S.family=rr.family; S.talent=rr.talent; S.beaconBorn=rr.score;
  }else{
    S.family=pick(w.families||FAMILIES); S.talent=pick(w.talents||TALENTS);
  }
  var f=S.family.fx,t=S.talent.fx;
  for(var k in f)S.attrs[k]=clamp(S.attrs[k]+f[k],0,10);
  for(var k2 in t)S.attrs[k2]=clamp(S.attrs[k2]+t[k2],0,10);

  /* v2.4 玩法层②：前尘——上辈子的主灯这局开局就亮着，
     对应那盏暗灯则锁死（点不亮）。带着上辈子的性子出生，也带着上辈子的缺口。 */
  var lr=META.lastRun;
  if(lr&&w.lamps&&w.lamps[lr.mainIx]!=null){
    S.lamps[w.lamps[lr.mainIx]]=1;               /* 灯痕：起手亮一盏 */
    S.litAge[w.lamps[lr.mainIx]]=0;              /* 一出生就亮着 */
    if(lr.dimIx!=null&&w.lamps[lr.dimIx]!=null&&lr.dimIx!==lr.mainIx){
      S.traceDebt={n:lampWord(lr.dimIx),dn:lr.dimName||null,same:(lr.wl===wk),from:lr.endTitle||'',wl:lr.wl||'',
                   k:lr.lastK||null,t:lr.lastT||null,age:lr.lastAge||null};
      S.dimAge[w.lamps[lr.dimIx]]=1;             /* 缺口：这盏一辈子亮不起来 */
    }
  }
  render();
}

/* ---------- 章节场景变体：同一章在不同局里可以是不同的戏 ----------
   数据里给某章写 variants:N（N≥2），正文/选项文案就可以用 s.v 分叉：
   body:function(s){ return s.v===0?['戏A','…']:['戏B','…']; }
   变体号在进入该章时随机抽取一次，并存进存档（重玩同一线不会总读同一场戏）。 */
function rollVariants(){
  if(!W||!W.chapters)return;
  var c=W.chapters[S.idx];
  if(!c)return;
  var n=+c.variants||1;
  if(S.var[S.idx]===undefined&&n>1)S.var[S.idx]=Math.floor(Math.random()*n);
  S.v=S.var[S.idx]||0;
}

/* 允许选项标题/锁文案/预知提示写成 function(s)（配合 s.v 变体与 s.flags 路线分叉） */
function txt(x){ return tok(typeof x==='function'?x(S):x); }
function tok(str){
  if(!str)return '';
  var g=S.gender==='女';
  return String(str)
    .replace(/\{ta\}/g,g?'他':'她')
    .replace(/\{TA\}/g,g?'她':'他')
    .replace(/\{子\}/g,g?'闺女':'儿子')
    .replace(/\{name\}/g,S.name);
}
function arr(x){return typeof x==='function'?x(S):(Array.isArray(x)?x:[x])}

function echoBar(){

  var first=!META.echoHinted; if(first){META.echoHinted=1;saveMeta();}
  var h='<div class="echobar"><span class="echobar-hint" title="回响：每通关一次 +1，跨周目累计。花 1 枚「预知」看选项后果，花 3 枚「改命」退回上一步重选。">回响 ×'+META.echoes+' <em>?</em></span>　';
  var c=W.chapters[S.idx];
  var unpeeked=false;
  c.choices.forEach(function(ch,i){if((ch.cond?ch.cond(S):true)&&!S.peeked[S.idx+'_'+i])unpeeked=true});
  if(unpeeked)h+='<button class="btn" onclick="peek()">◈ 预知（1）　</button>';
  if(S.snapshot)h+='<button class="btn" onclick="rewrite()">↺ 改命（3）</button>';
  h+='</div>';
  if(first)h+='<p class="ann echo-hint">「回响」是你通关攒下的资源：每通关一次 +1，跨周目累计。花 1 枚可「预知」某个选项的后果，花 3 枚可「改命」退回上一步重选。</p>';
  return h;
}

    var v=S.lamps[k]||0,fix=!!(S.dimAge&&S.dimAge[k]);
    var cls=fix?(v>0?'lp on on2 on3 fix':'lp fix'):(v>0?(v>=3?'lp on on2 on3':(v>=2?'lp on on2':'lp on')):(v<0?'lp off':'lp'));
    if(!fix&&cap&&v<2)cls+=' capped';
    var cap=(S.lampCapped&&S.lampCapped[k])||(v>=2?'':((function(){var c=lampCapped(k);return c?c.by:'';})()));
    var badge=fix?'<em class="lk">缺</em>':(S.litAge&&S.litAge[k]===0?'<em class="tr">痕</em>':(cap?'<em class="cp">⊘</em>':''));
    var tip=fix?'　前尘缺口：这一世亮不起来':(S.litAge&&S.litAge[k]===0?'　上辈子的灯痕（一出生就亮着）':(cap?('　【'+cap+'】已烧到二档，这一盏封顶一档'):''));
    h+='<div class="'+cls+'" title="'+k+tip+'">'
      +k+badge+(v>1?'<em>'+v+'</em>':'')+'</div>';
  });
  h+='</div><div class="stat" style="margin-top:10px"><span>灯芯值</span><b>'+sumLamps(S.lamps)+'</b></div>';
  if(S.beacon&&S.beacon.length){
    var bhit=0;
    for(var bqi=0;bqi<S.beacon.length;bqi++)if((S.lamps[w.lamps[S.beacon[bqi]]]||0)>0)bhit++;
    h+='<div class="stat"><span>道　标</span><b>'+S.beacon.map(function(ix){return lampName(ix)}).join('')+'　'
      +bhit+'/'+S.beacon.length+'</b></div>';
  }
  h+='<div class="stat"><span>韧　度</span><b>'+S.tough+'</b></div>';
  h+='<div class="stat"><span>回　响</span><b>'+META.echoes+'</b></div></div>';
  h+='<div class="panel"><h3>'+S.name+' · '+(S.gender==='女'?'女':'男')+'</h3>';
  for(var a in w.attrs){
    var v=S.attrs[a];
    h+='<div class="att"><div class="row"><span class="nm">'+w.attrs[a]+'</span>'
      +'<span class="bar"><i style="width:'+(v*10)+'%"></i></span><span class="vl">'+v+'</span></div></div>';
  }
  h+='<div class="stat"><span>年　岁</span><b>'+S.age+'</b></div></div>';
  var fs=flagList();
  if(fs.length)h+='<div class="panel"><h3>命 运 标 记</h3><div class="flags">'+fs.map(function(x){return '<span>'+x+'</span>'}).join('')+'</div></div>';
  h+='<div class="panel"><h3>进 度</h3><div class="stat"><span>章　节</span><b>'+(S.idx+1)+' / '+w.chapters.length+'</b></div>'
    +'<div class="stat"><span>已通　关</span><b>'+META.runs+'</b></div>'
    +'<div style="margin-top:10px"><button class="btn" style="width:100%" onclick="showHelp()">玩法说明</button></div></div>';
  h+='</aside>';
