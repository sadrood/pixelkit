<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>静读 · 小说阅读器</title>
<style>
/* ============================================================
   静读 · 小说阅读器（重设计版）
   纸感浅色 / 夜间两种主题；书架、搜索、目录、阅读四个视图。
   ============================================================ */
:root{
  --ink:#2b2621; --ink-2:#6c6258; --ink-3:#9a9084;
  --paper:#f6f0e4; --paper-2:#efe7d7; --card:#fffdf8; --card-2:#faf5ea;
  --rule:rgba(78,62,44,.14); --rule-2:rgba(78,62,44,.08);
  --accent:#a8663a; --accent-2:#c98a5a; --accent-soft:rgba(168,102,58,.1);
  --ok:#4a7c59; --bad:#a8402c;
  --shadow:0 2px 8px rgba(70,52,30,.06), 0 10px 30px -18px rgba(70,52,30,.25);
  --r:14px; --r-sm:10px;
  --read-w:700px; --font-read:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif;
  --font-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
html[data-theme="night"]{
  --ink:#e6e1d6; --ink-2:#a9a294; --ink-3:#77705f;
  --paper:#15171a; --paper-2:#1b1e22; --card:#1d2126; --card-2:#23282e;
  --rule:rgba(255,255,255,.1); --rule-2:rgba(255,255,255,.05);
  --accent:#d99a63; --accent-2:#e8b184; --accent-soft:rgba(217,154,99,.12);
  --ok:#7fb08c; --bad:#e0907e;
  --shadow:0 2px 8px rgba(0,0,0,.3), 0 12px 30px -18px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-ui); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button{font-family:inherit; cursor:pointer}
input,textarea,select{font-family:inherit}
a{color:var(--accent); text-decoration:none}
::selection{background:var(--accent-soft)}

/* ---------- 顶栏 ---------- */
.top{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:14px;
  padding:12px max(20px, calc((100vw - 1080px) / 2));
  background:var(--paper); border-bottom:1px solid var(--rule-2);
}
@supports (backdrop-filter: blur(1px)) { .top{ background:color-mix(in srgb, var(--paper) 86%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px) } }
.brand{display:flex; align-items:center; gap:9px; flex-shrink:0}
.brand .mark{width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,#b9773f,#8e5327); display:grid; place-items:center; color:#fff; font-size:15px; box-shadow:var(--shadow)}
.brand h1{margin:0; font-size:17px; font-weight:700; letter-spacing:.5px}
.searchbar{flex:1; display:flex; align-items:center; gap:8px; min-width:0}
.searchbar input{
  flex:1; min-width:0; height:38px; padding:0 14px; font-size:13.5px;
  border:1px solid var(--rule); border-radius:999px; background:var(--card); color:var(--ink);
  outline:none; transition:.18s;
}
.searchbar input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.top-acts{display:flex; align-items:center; gap:6px; flex-shrink:0}
.tbtn{
  height:36px; padding:0 13px; font-size:13px; border-radius:999px;
  border:1px solid var(--rule); background:var(--card); color:var(--ink-2);
  display:inline-flex; align-items:center; gap:6px; transition:.18s; white-space:nowrap;
}
.tbtn:hover{color:var(--ink); border-color:var(--accent); background:var(--accent-soft)}
.tbtn.primary{background:linear-gradient(135deg,#b9773f,#96572b); border-color:transparent; color:#fff; font-weight:600}
.tbtn.primary:hover{filter:brightness(1.06); color:#fff}
.tbtn.icon{width:36px; padding:0; justify-content:center; font-size:15px}

/* ---------- 视图 ---------- */
.wrap{max-width:1080px; margin:0 auto; padding:22px 20px 60px}
.view{display:none}
.view.on{display:block; animation:fade .22s ease}
@keyframes fade{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:4px 0 16px}
.page-head h2{margin:0; font-size:19px; font-weight:700; letter-spacing:.5px}
.page-head .sub{margin:2px 0 0; font-size:12.5px; color:var(--ink-3)}

/* ---------- 空状态 ---------- */
.empty{
  border:1px dashed var(--rule); border-radius:var(--r); background:var(--card-2);
  padding:34px 22px; text-align:center; color:var(--ink-2);
}
.empty .big{font-size:30px; margin-bottom:10px; opacity:.8}
.empty h3{margin:0 0 6px; font-size:15px; color:var(--ink)}
.empty p{margin:0 0 16px; font-size:13px; color:var(--ink-3); line-height:1.8}
.empty .acts{display:flex; gap:9px; justify-content:center; flex-wrap:wrap}

/* ---------- 书架网格 ---------- */
.shelf{display:grid; grid-template-columns:repeat(auto-fill, minmax(168px,1fr)); gap:16px}
.bk{
  text-align:left; padding:0; border:1px solid var(--rule-2); background:var(--card);
  border-radius:var(--r); overflow:hidden; color:var(--ink); transition:.18s; box-shadow:var(--shadow);
}
.bk:hover{transform:translateY(-2px); border-color:var(--accent)}
.bk .cover{
  aspect-ratio:3/4; background:linear-gradient(150deg,#e8d8bd,#d8c3a0);
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:34px; font-weight:700;
  text-shadow:0 2px 10px rgba(0,0,0,.25); overflow:hidden;
}
.bk .cover img{width:100%; height:100%; object-fit:cover; display:block}
.bk .bd{padding:10px 12px 12px}
.bk .t{font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bk .a{font-size:12px; color:var(--ink-3); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bk .prog{margin-top:9px; height:3px; border-radius:999px; background:var(--rule); overflow:hidden}
.bk .prog i{display:block; height:100%; background:var(--accent); border-radius:999px}
.bk .pct{font-size:11px; color:var(--ink-3); margin-top:5px}

/* ---------- 搜索结果 ---------- */
.results{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px}
.res{
  display:flex; gap:12px; align-items:stretch; text-align:left; padding:12px;
  border:1px solid var(--rule-2); background:var(--card); border-radius:var(--r); color:var(--ink);
  transition:.18s; box-shadow:var(--shadow);
}
.res:hover{border-color:var(--accent); transform:translateY(-1px)}
.res .cov{
  width:62px; flex-shrink:0; aspect-ratio:3/4; border-radius:8px; overflow:hidden;
  background:linear-gradient(150deg,#e8d8bd,#d8c3a0); display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:22px; font-weight:700;
}
.res .cov img{width:100%; height:100%; object-fit:cover; display:block}
.res .info{min-width:0; display:flex; flex-direction:column; gap:3px}
.res .t{font-size:14px; font-weight:600; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.res .a{font-size:12px; color:var(--ink-3)}
.res .d{font-size:12px; color:var(--ink-2); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.6}
.res .src{margin-top:auto; font-size:11px; color:var(--accent); display:flex; align-items:center; gap:5px}
.res .src .dot{width:5px; height:5px; border-radius:50%; background:var(--accent)}
.errs{margin-top:14px; font-size:12px; color:var(--ink-3); line-height:1.8}
.errs b{color:var(--bad); font-weight:600}
.loading{display:flex; align-items:center; gap:9px; color:var(--ink-3); font-size:13px; padding:26px 0}
.spin{width:14px; height:14px; border:2px solid var(--rule); border-top-color:var(--accent); border-radius:50%; animation:sp .8s linear infinite; display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- 目录 ---------- */
.book-head{
  display:flex; gap:16px; padding:16px; border:1px solid var(--rule-2); border-radius:var(--r);
  background:var(--card); box-shadow:var(--shadow); margin-bottom:16px;
}
.book-head .cover{width:86px; aspect-ratio:3/4; border-radius:10px; overflow:hidden; flex-shrink:0; background:linear-gradient(150deg,#e8d8bd,#d8c3a0); display:flex; align-items:center; justify-content:center; color:#fff; font-size:28px; font-weight:700}
.book-head .cover img{width:100%; height:100%; object-fit:cover}
.book-head .meta{min-width:0; display:flex; flex-direction:column; gap:5px}
.book-head h2{margin:0; font-size:18px}
.book-head .who{font-size:12.5px; color:var(--ink-3)}
.book-head .acts{margin-top:auto; display:flex; gap:8px; flex-wrap:wrap}
.toc-tools{display:flex; gap:10px; align-items:center; margin-bottom:10px}
.toc-tools input{flex:1; min-width:0; height:34px; padding:0 12px; border:1px solid var(--rule); border-radius:9px; background:var(--card); color:var(--ink); font-size:12.5px; outline:none}
.toc-tools input:focus{border-color:var(--accent)}
.toc-count{font-size:11.5px; color:var(--ink-3); white-space:nowrap}
.toc{display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:6px}
.toc-i{
  display:flex; align-items:center; gap:8px; text-align:left; padding:9px 11px;
  border:1px solid transparent; border-radius:9px; background:var(--card-2); color:var(--ink-2);
  font-size:12.5px; transition:.15s; min-height:38px;
}
.toc-i:hover{border-color:var(--accent); color:var(--ink); background:var(--card)}
.toc-i.now{border-color:var(--accent); color:var(--accent); background:var(--accent-soft); font-weight:600}
.toc-i .n{overflow:hidden; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical}
.toc-i .badge{margin-left:auto; font-size:10px; padding:1px 6px; border-radius:999px; background:var(--accent); color:#fff; flex-shrink:0}

/* ---------- 阅读 ---------- */
.read-bar{
  position:sticky; top:53px; z-index:20; display:flex; align-items:center; gap:10px;
  padding:9px 0; margin-bottom:6px; border-bottom:1px solid var(--rule-2); background:var(--paper);
}
@supports (backdrop-filter: blur(1px)) { .read-bar{ background:color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter:blur(10px) } }
.read-bar .ch{flex:1; min-width:0; font-size:13px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.read-bar .grp{display:flex; gap:4px; align-items:center}
.rb{
  height:32px; min-width:32px; padding:0 8px; border:1px solid var(--rule); border-radius:8px;
  background:var(--card); color:var(--ink-2); font-size:12.5px; display:inline-flex; align-items:center; justify-content:center; transition:.15s;
}
.rb:hover{color:var(--ink); border-color:var(--accent); background:var(--accent-soft)}
.read-prog{height:2px; background:var(--rule-2); border-radius:999px; margin-bottom:18px; overflow:hidden}
.read-prog i{display:block; height:100%; width:0; background:var(--accent); transition:width .25s}
#rd-txt{
  width:min(var(--read-w), 100%); margin:0 auto;
  font-family:var(--font-read); font-size:var(--fs,18px); line-height:1.95;
  color:var(--ink); letter-spacing:.2px;
}
#rd-txt p{margin:0 0 1.05em; text-indent:2em}
#rd-txt p.no-ind{text-indent:0}
#rd-txt .hint{text-indent:0; color:var(--ink-3); font-family:var(--font-ui); font-size:13px}
.read-foot{display:flex; align-items:center; justify-content:center; gap:10px; margin:34px 0 10px}
.read-foot .nav{height:38px; padding:0 20px; border:1px solid var(--rule); border-radius:999px; background:var(--card); color:var(--ink-2); font-size:13px}
.read-foot .nav:hover{border-color:var(--accent); color:var(--accent)}
.read-foot .pos{font-size:12px; color:var(--ink-3)}

/* ---------- 书源弹窗 ---------- */
.mask{position:fixed; inset:0; background:rgba(30,24,18,.5); display:none; align-items:center; justify-content:center; padding:20px; z-index:60}
.mask.on{display:flex}
.modal{
  width:min(720px,100%); max-height:min(84vh,760px); overflow:auto; background:var(--card);
  border:1px solid var(--rule); border-radius:18px; box-shadow:0 30px 80px -30px rgba(0,0,0,.5); padding:22px;
}
.modal h3{margin:0 0 4px; font-size:17px}
.modal .sub{margin:0 0 14px; font-size:12.5px; color:var(--ink-3); line-height:1.7}
.srcs{display:flex; flex-direction:column; gap:7px; margin-bottom:14px; max-height:200px; overflow:auto}
.src-i{display:flex; align-items:center; gap:9px; padding:9px 11px; border:1px solid var(--rule-2); border-radius:10px; background:var(--card-2)}
.src-i .n{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40%}
.src-i .u{font-size:11.5px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1}
.src-i .tag{font-size:11px; padding:2px 8px; border-radius:999px; white-space:nowrap}
.src-i .tag.ok{background:rgba(74,124,89,.14); color:var(--ok)}
.src-i .tag.no{background:rgba(168,64,44,.1); color:var(--bad); max-width:200px; overflow:hidden; text-overflow:ellipsis}
.src-i .del{margin-left:auto; border:0; background:transparent; color:var(--ink-3); font-size:15px; padding:0 2px}
.src-i .del:hover{color:var(--bad)}
textarea#src-input, input#src-url{
  width:100%; border:1px solid var(--rule); border-radius:10px; background:var(--card-2); color:var(--ink);
  font-size:12.5px; padding:10px 12px; outline:none; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
textarea#src-input{height:110px; resize:vertical; line-height:1.6}
input#src-url{height:40px; font-family:var(--font-ui)}
textarea#src-input:focus, input#src-url:focus{border-color:var(--accent)}
.link-row{display:flex; gap:8px; margin:10px 0 4px}
.link-row input{flex:1; min-width:0}
.modal-acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; align-items:center}
.modal-acts .grow{flex:1}
.btn{
  height:36px; padding:0 14px; border-radius:9px; border:1px solid var(--rule);
  background:var(--card); color:var(--ink-2); font-size:13px; transition:.15s;
}
.btn:hover{border-color:var(--accent); color:var(--ink); background:var(--accent-soft)}
.btn.pri{background:linear-gradient(135deg,#b9773f,#96572b); border-color:transparent; color:#fff; font-weight:600}
.btn.pri:hover{filter:brightness(1.06); color:#fff}
.btn:disabled{opacity:.5; cursor:not-allowed}

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%, 16px); z-index:80;
  padding:10px 18px; border-radius:999px; background:#2b2621; color:#f6f0e4; font-size:13px;
  box-shadow:0 12px 30px -12px rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:.22s;
  max-width:86vw; text-align:center;
}
.toast.on{opacity:1; transform:translate(-50%, 0)}
.toast.err{background:#8f3622}

/* ---------- 手机 ---------- */
@media (max-width:720px){
  .top{flex-wrap:wrap; gap:9px; padding:10px 14px}
  .brand h1{font-size:16px}
  .searchbar{order:3; flex-basis:100%}
  .top-acts{margin-left:auto}
  .wrap{padding:14px 14px 80px}
  .shelf{grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:11px}
  .results{grid-template-columns:1fr}
  .book-head{padding:12px; gap:12px}
  .book-head .cover{width:70px}
  #rd-txt{font-size:17px; padding:0 2px}
  .read-bar{top:0}
  .read-foot{position:fixed; left:0; right:0; bottom:0; margin:0; padding:10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background:var(--card); border-top:1px solid var(--rule-2); z-index:25}
  .read-foot .nav{flex:1}
  .read-foot .pos{display:none}
  .toc{grid-template-columns:1fr}
  .modal{padding:16px; border-radius:14px}
  .src-i .u{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="mark">静</span><h1>静读</h1></div>
  <div class="searchbar">
    <input id="q" placeholder="搜书名或作者，回车搜索" autocomplete="off" />
    <button class="tbtn primary" id="btn-q">搜索</button>
  </div>
  <div class="top-acts">
    <button class="tbtn" id="btn-shelf">书架</button>
    <button class="tbtn" id="btn-src">书源</button>
    <button class="tbtn icon" id="btn-theme" title="切换纸感/夜间">◐</button>
  </div>
</header>

<main class="wrap">

  <!-- ========== 书架 ========== -->
  <section class="view on" id="v-shelf">
    <div class="page-head">
      <div><h2>书架</h2><p class="sub" id="shelf-sub">导入书源后就能搜书了</p></div>
      <button class="tbtn" id="btn-shelf-src">管理书源</button>
    </div>
    <div id="shelf"></div>
  </section>

  <!-- ========== 搜索结果 ========== -->
  <section class="view" id="v-search">
    <div class="page-head">
      <div><h2 id="search-title">搜索</h2><p class="sub" id="search-sub">输入书名或作者，在可用书源里搜</p></div>
      <button class="tbtn" id="btn-back-shelf">← 书架</button>
    </div>
    <div id="results" class="results"></div>
    <div class="errs" id="search-errs"></div>
  </section>

  <!-- ========== 目录 ========== -->
  <section class="view" id="v-toc">
    <div class="page-head">
      <div><h2 id="toc-title">目录</h2><p class="sub" id="toc-sub"></p></div>
      <button class="tbtn" id="btn-toc-back">← 书架</button>
    </div>
    <div class="book-head" id="book-head" style="display:none">
      <div class="cover" id="bh-cover"></div>
      <div class="meta">
        <h2 id="bh-title"></h2>
        <div class="who" id="bh-who"></div>
        <div class="acts"><button class="tbtn primary" id="btn-continue">继续阅读</button></div>
      </div>
    </div>
    <div class="toc-tools">
      <input id="toc-q" placeholder="筛选章节…" />
      <span class="toc-count" id="toc-count"></span>
    </div>
    <div class="toc" id="toc-list"></div>
  </section>

  <!-- ========== 阅读 ========== -->
  <section class="view" id="v-read">
    <div class="read-bar">
      <button class="rb" id="btn-read-back" title="目录">☰ 目录</button>
      <span class="ch" id="rd-title"></span>
      <div class="grp">
        <button class="rb" id="btn-fs-down" title="字号减小">A-</button>
        <button class="rb" id="btn-fs-up" title="字号增大">A+</button>
        <button class="rb" id="btn-font" title="衬线/无衬线">衬</button>
      </div>
    </div>
    <div class="read-prog"><i id="rd-prog"></i></div>
    <article id="rd-txt"></article>
    <div class="read-foot">
      <button class="nav" id="btn-prev">上一章</button>
      <span class="pos" id="rd-pos"></span>
      <button class="nav" id="btn-next">下一章</button>
    </div>
  </section>
</main>

<!-- ========== 书源弹窗 ========== -->
<div class="mask" id="m-src">
  <div class="modal">
    <h3>书源管理</h3>
    <p class="sub">粘贴「阅读」格式的书源 JSON（单个对象或数组），或贴书源分享链接由服务器代抓。导入后自动检测哪些可用。</p>
    <div class="srcs" id="src-list"></div>
    <textarea id="src-input" placeholder='[{"bookSourceName":"...","bookSourceUrl":"https://...","searchUrl":"...","ruleSearch":{...}}]'></textarea>
    <div class="link-row">
      <input id="src-url" placeholder="书源链接（.json 或分享页，服务器代抓）" />
      <button class="btn" id="btn-src-url">从链接导入</button>
    </div>
    <div class="modal-acts">
      <button class="btn" id="btn-src-demo">载入示例</button>
      <button class="btn" id="btn-src-file">从文件读</button>
      <button class="btn" id="btn-src-clear">清空输入</button>
      <span class="grow"></span>
      <button class="btn pri" id="btn-src-ok">导入</button>
      <button class="btn" id="btn-src-close">关闭</button>
    </div>
    <input type="file" id="src-file" accept=".json,.txt,application/json" hidden />
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   状态
   ============================================================ */
const LS = { src: 'jingdu_sources', books: 'jingdu_books', cfg: 'jingdu_config' };
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const store = {
  get(k, def) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? def : v; } catch { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* ignore */ } },
};

let SOURCES = store.get(LS.src, []);
let CAP = {};
let BOOKS = store.get(LS.books, []);
let CFG = Object.assign({ font: 'serif', size: 18, theme: 'paper' }, store.get(LS.cfg, {}));
let curBook = null;
let curIdx = 0;

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast on' + (isErr ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = 'toast'; }, 2600);
}

function view(name) {
  $$('.view').forEach((v) => v.classList.toggle('on', v.id === 'v-' + name));
  window.scrollTo(0, 0);
}

async function api(path, body) {
  const r = await fetch('/api/novel' + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const j = await r.json().catch(() => ({ success: false, error: '返回内容无法解析' }));
  if (!j.success && j.error) throw new Error(j.error);
  return j;
}

/* ============================================================
   配置 / 主题 / 字号
   ============================================================ */
function applyCfg() {
  document.documentElement.dataset.theme = CFG.theme;
  document.documentElement.style.setProperty('--fs', CFG.size + 'px');
  store.set(LS.cfg, CFG);
}
applyCfg();

$('#btn-theme').onclick = () => { CFG.theme = CFG.theme === 'paper' ? 'night' : 'paper'; applyCfg(); };
$('#btn-fs-up').onclick = () => { CFG.size = Math.min(26, CFG.size + 1); applyCfg(); };
$('#btn-fs-down').onclick = () => { CFG.size = Math.max(15, CFG.size - 1); applyCfg(); };
$('#btn-font').onclick = () => { CFG.font = CFG.font === 'serif' ? 'sans' : 'serif'; applyCfg(); renderChapter(); };

/* ============================================================
   书源
   ============================================================ */
function usableSources() { return SOURCES.filter((s) => CAP[s.bookSourceName]?.usable); }

async function importSources(text) {
  let parsed;
  try { parsed = JSON.parse(text); } catch (e) { throw new Error('JSON 格式有误：' + String(e.message).slice(0, 60)); }
  const list = Array.isArray(parsed) ? parsed : [parsed];
  const valid = list.filter((s) => s && (s.bookSourceUrl || s.bookSourceName));
  if (!valid.length) throw new Error('没识别到书源（需要 bookSourceUrl 字段）');
  const byName = new Map(SOURCES.map((s) => [s.bookSourceName, s]));
  for (const s of valid) byName.set(s.bookSourceName || s.bookSourceUrl, s);
  SOURCES = [...byName.values()];
  store.set(LS.src, SOURCES);
  try {
    const r = await api('/inspect', { sources: SOURCES });
    CAP = {};
    for (const s of r.sources) CAP[s.name] = { usable: s.usable, reason: s.reason };
    await fetch('/api/novel/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sources: SOURCES }),
    });
    return r;
  } catch {
    return { total: SOURCES.length, usable: 0, sources: [] };
  }
}

function renderSourceList() {
  const box = $('#src-list');
  if (!SOURCES.length) {
    box.innerHTML = '<p style="font-size:12.5px;color:var(--ink-3);padding:10px 2px">还没有书源。粘贴 JSON 或贴链接，然后点「导入」。</p>';
    return;
  }
  box.innerHTML = SOURCES.map((s, i) => {
    const c = CAP[s.bookSourceName];
    const tag = !c ? '<span class="tag no">未检测</span>'
      : c.usable ? '<span class="tag ok">可用</span>'
      : `<span class="tag no" title="${esc(c.reason)}">${esc(c.reason)}</span>`;
    return `<div class="src-i">
      <div class="n">${esc(s.bookSourceName || '(未命名)')}</div>
      <div class="u">${esc(s.bookSourceUrl || '')}</div>
      ${tag}
      <button class="del" data-i="${i}" title="删除">×</button>
    </div>`;
  }).join('');
  box.querySelectorAll('.del').forEach((b) => {
    b.onclick = () => {
      SOURCES.splice(+b.dataset.i, 1);
      store.set(LS.src, SOURCES);
      renderSourceList();
      renderShelf();
      toast('已删除该源');
    };
  });
}

$('#btn-src').onclick = () => { renderSourceList(); $('#m-src').classList.add('on'); };
$('#btn-shelf-src').onclick = () => { renderSourceList(); $('#m-src').classList.add('on'); };
$('#btn-src-close').onclick = () => $('#m-src').classList.remove('on');
$('#m-src').onclick = (e) => { if (e.target.id === 'm-src') $('#m-src').classList.remove('on'); };

$('#btn-src-ok').onclick = async () => {
  const text = $('#src-input').value.trim();
  if (!text) return toast('先粘贴书源 JSON', true);
  try {
    const r = await importSources(text);
    $('#src-input').value = '';
    renderSourceList();
    renderShelf();
    toast(`导入 ${r.total} 个书源，${r.usable} 个可用`);
  } catch (e) { toast(e.message, true); }
};

$('#btn-src-file').onclick = () => $('#src-file').click();
$('#src-file').onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => { $('#src-input').value = fr.result; toast('已读入文件，点「导入」确认'); };
  fr.readAsText(f, 'utf-8');
  e.target.value = '';
};

$('#btn-src-url').onclick = async () => {
  const input = $('#src-url');
  const u = (input.value || '').trim();
  if (!u) return toast('先粘贴书源链接', true);
  const btn = $('#btn-src-url');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '抓取中…';
  try {
    const r = await fetch('/api/novel/fetch-source?url=' + encodeURIComponent(u)).then((x) => x.json());
    if (!r.success) throw new Error(r.error || '抓取失败');
    const text = JSON.stringify(r.sources);
    $('#src-input').value = text;
    const res = await importSources(text);
    input.value = '';
    $('#src-input').value = '';
    renderSourceList();
    renderShelf();
    toast(`从链接导入 ${r.count} 个书源，${res.usable || 0} 个可用`);
  } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; btn.textContent = label; }
};

/** 示例书源：格格党（qodown.com），字段对着真实页面写的 */
const DEMO_SOURCE = {
  bookSourceName: '格格党',
  bookSourceUrl: 'http://www.qodown.com',
  searchUrl: 'http://www.qodown.com/search/,\n{\n  "body": "searchkey={{key}}&Submit=搜索",\n  "method": "POST"\n}',
  ruleSearch: { bookList: '.txt-list li', name: '.s2 a::text', author: '.s4::text', bookUrl: '.s2 a[href]' },
  ruleToc: { chapterList: '.section-list li a', chapterName: 'text', chapterUrl: 'href' },
  ruleContent: { content: '#content' },
};
$('#btn-src-demo').onclick = () => { $('#src-input').value = JSON.stringify([DEMO_SOURCE], null, 2); toast('已填入示例书源，点「导入」确认'); };
$('#btn-src-clear').onclick = () => { $('#src-input').value = ''; $('#src-url').value = ''; };

/* ============================================================
   书架
   ============================================================ */
function renderShelf() {
  const box = $('#shelf');
  const usable = usableSources().length;
  $('#shelf-sub').textContent = SOURCES.length
    ? `${SOURCES.length} 个书源，${usable} 个可用 · 搜索后点书加入书架`
    : '还没有书源：点「管理书源」粘贴 JSON 或贴链接导入';
  if (!BOOKS.length) {
    box.innerHTML = `<div class="empty">
      <div class="big">📖</div>
      <h3>书架还是空的</h3>
      <p>导入书源 → 搜索书名 → 点开一本书，它就会出现在这里，并记住你读到哪一章。</p>
      <div class="acts">
        <button class="tbtn primary" id="e-src">导入书源</button>
        <button class="tbtn" id="e-searc">去搜书</button>
      </div>
    </div>`;
    $('#e-src').onclick = () => { renderSourceList(); $('#m-src').classList.add('on'); };
    $('#e-searc').onclick = () => { view('search'); $('#q').focus(); };
    return;
  }
  box.innerHTML = `<div class="shelf">${BOOKS.map((b, i) => {
    const pct = Math.round(((b.idx || 0) + 1) / Math.max(1, b.total || (b.toc ? b.toc.length : 1)) * 100);
    return `<button class="bk" data-i="${i}">
      <div class="cover">${b.cover ? `<img src="${esc(b.cover)}" alt="" onerror="this.remove()" />` : esc((b.title || '书')[0])}</div>
      <div class="bd">
        <div class="t">${esc(b.title || '未命名')}</div>
        <div class="a">${esc(b.author || '佚名')}</div>
        <div class="prog"><i style="width:${pct}%"></i></div>
        <div class="pct">读到第 ${(b.idx || 0) + 1} / ${b.total || (b.toc ? b.toc.length : '?')} 章</div>
      </div>
    </button>`;
  }).join('')}</div>`;
  box.querySelectorAll('.bk').forEach((el) => {
    el.onclick = () => {
      const b = BOOKS[+el.dataset.i];
      if (!b || !b.toc || !b.toc.length) return toast('这本书的目录丢了，重新搜一次', true);
      curBook = b; curIdx = Math.min(b.idx || 0, b.toc.length - 1);
      $('#toc-title').textContent = b.title || '目录';
      $('#toc-sub').textContent = [b.author, b.source, `${b.toc.length} 章`].filter(Boolean).join(' · ');
      renderBookHead();
      renderToc();
      view('toc');
    };
  });
}

/* ============================================================
   搜索
   ============================================================ */
async function doSearch() {
  const kw = $('#q').value.trim();
  if (!kw) { view('search'); $('#q').focus(); return toast('输入书名或作者', true); }
  const usable = usableSources();
  if (!usable.length) {
    renderSourceList(); $('#m-src').classList.add('on');
    return toast('还没有可用书源，先导入一个', true);
  }
  view('search');
  $('#search-title').textContent = `搜索「${kw}」`;
  $('#search-sub').textContent = `正在 ${usable.length} 个书源里查找…`;
  $('#search-errs').textContent = '';
  const box = $('#results');
  box.innerHTML = '<div class="loading" style="grid-column:1/-1"><span class="spin"></span> 搜索中，书源多时可能要十几秒…</div>';
  try {
    const r = await api('/search', { keyword: kw, sources: usable.map((s) => ({ bookSourceName: s.bookSourceName })) });
    if (!r.results || !r.results.length) {
      box.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="big">🔍</div><h3>没有搜到结果</h3><p>书源都没返回数据，可能规则已变更或源站限制了访问。试试换关键词或换书源。</p></div>`;
      return;
    }
    $('#search-sub').textContent = `找到 ${r.results.length} 个结果`;
    box.innerHTML = r.results.map((x, i) => `
      <button class="res" data-i="${i}">
        <div class="cov">${x.cover ? `<img src="${esc(x.cover)}" alt="" onerror="this.parentNode.textContent='${esc((x.title || '书')[0])}'" />` : esc((x.title || '书')[0])}</div>
        <div class="info">
          <div class="t">${esc(x.title || '未命名')}</div>
          <div class="a">${esc(x.author || '佚名')}</div>
          ${x.intro ? `<div class="d">${esc(x.intro)}</div>` : ''}
          <div class="src"><span class="dot"></span>${esc(x.source || '')}</div>
        </div>
      </button>`).join('');
    box.querySelectorAll('.res').forEach((el) => { el.onclick = () => openBook(r.results[+el.dataset.i]); });
    if (r.errors && r.errors.length) {
      $('#search-errs').innerHTML = '部分书源失败：' + r.errors.map((e) => `<b>${esc(e.name)}</b> ${esc(e.error)}`).join('；');
    }
  } catch (e) {
    box.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="big">⚠️</div><h3>搜索失败</h3><p>${esc(e.message)}</p></div>`;
  }
}
$('#btn-q').onclick = doSearch;
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
$('#btn-shelf').onclick = () => { renderShelf(); view('shelf'); };
$('#btn-back-shelf').onclick = () => { renderShelf(); view('shelf'); };
$('#btn-toc-back').onclick = () => { renderShelf(); view('shelf'); };

/* ============================================================
   目录
   ============================================================ */
async function openBook(result) {
  view('toc');
  $('#toc-title').textContent = result.title || '目录';
  $('#toc-sub').textContent = '正在抓取目录…';
  $('#book-head').style.display = 'none';
  $('#toc-list').innerHTML = '<div class="loading" style="grid-column:1/-1"><span class="spin"></span> 抓取目录中…</div>';
  try {
    const r = await api('/toc', { source: { bookSourceName: result.source }, bookUrl: result.url });
    if (!r.toc || !r.toc.length) throw new Error('目录为空');
    const book = {
      title: (r.info && r.info.name) || result.title, author: (r.info && r.info.author) || result.author,
      cover: (r.info && r.info.cover) || result.cover, source: result.source, bookUrl: result.url,
      toc: r.toc, idx: 0, total: r.toc.length,
    };
    const exist = BOOKS.findIndex((b) => b.bookUrl === book.bookUrl && b.source === book.source);
    if (exist >= 0) { book.idx = Math.min(BOOKS[exist].idx || 0, r.toc.length - 1); BOOKS[exist] = book; }
    else { if (BOOKS.length >= 60) BOOKS.shift(); BOOKS.push(book); }
    store.set(LS.books, BOOKS);
    curBook = book; curIdx = book.idx;
    $('#toc-title').textContent = book.title;
    $('#toc-sub').textContent = `${book.author || '佚名'} · 共 ${book.toc.length} 章`;
    renderBookHead();
    renderToc();
  } catch (e) {
    $('#toc-sub').textContent = '抓取失败';
    $('#toc-list').innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="big">📕</div><h3>抓不到目录</h3><p>${esc(e.message)}</p><p style="font-size:12px">换个书源再搜一次试试。</p></div>`;
  }
}

function renderBookHead() {
  if (!curBook) return;
  $('#book-head').style.display = '';
  $('#bh-title').textContent = curBook.title;
  $('#bh-who').textContent = [curBook.author, curBook.source, `${curBook.toc.length} 章`].filter(Boolean).join(' · ');
  const cov = $('#bh-cover');
  cov.innerHTML = curBook.cover ? `<img src="${esc(curBook.cover)}" alt="" onerror="this.parentNode.textContent='${esc(curBook.title[0])}'" />` : esc(curBook.title[0]);
  $('#btn-continue').onclick = () => { curIdx = curBook.idx || 0; view('read'); loadChapter(); };
}

function renderToc() {
  if (!curBook) return;
  const filter = ($('#toc-q').value || '').trim().toLowerCase();
  const items = curBook.toc.map((x, i) => ({ name: x.name || '', url: x.url, i })).filter((x) => !filter || x.name.toLowerCase().includes(filter));
  $('#toc-count').textContent = filter ? `${items.length} / ${curBook.toc.length} 章` : `${curBook.toc.length} 章`;
  if (!items.length) {
    $('#toc-list').innerHTML = '<p style="padding:20px 2px;color:var(--ink-3);font-size:13px">没有匹配的章节</p>';
    return;
  }
  $('#toc-list').innerHTML = items.map((x) => `<button class="toc-i${x.i === curIdx ? ' now' : ''}" data-i="${x.i}">
    <span class="n">${esc(x.name)}</span>${x.i === curIdx ? '<span class="badge">读到这</span>' : ''}
  </button>`).join('');
  $('#toc-list').querySelectorAll('.toc-i').forEach((el) => {
    el.onclick = () => { curIdx = +el.dataset.i; view('read'); loadChapter(); };
  });
  const now = $('#toc-list').querySelector('.toc-i.now');
  if (now && now.scrollIntoView) now.scrollIntoView({ block: 'center' });
}
$('#toc-q').addEventListener('input', renderToc);

/* ============================================================
   阅读
   ============================================================ */
let curText = '';

function renderChapter() {
  const box = $('#rd-txt');
  if (!curText) { box.innerHTML = '<p class="hint">这一章没有内容</p>'; return; }
  const paras = curText.split(/\n+/).map((s) => s.trim()).filter(Boolean);
  const noInd = CFG.font !== 'serif';
  box.style.fontFamily = CFG.font === 'serif' ? 'var(--font-read)' : 'var(--font-ui)';
  box.innerHTML = paras.map((p) => `<p${noInd ? ' class="no-ind"' : ''}>${esc(p)}</p>`).join('');
}

async function loadChapter() {
  if (!curBook || !curBook.toc || !curBook.toc.length) return;
  const ch = curBook.toc[curIdx];
  $('#rd-title').textContent = ch.name || `第 ${curIdx + 1} 章`;
  $('#rd-txt').innerHTML = '<div class="loading"><span class="spin"></span> 正在加载正文…</div>';
  window.scrollTo(0, 0);
  try {
    const r = await api('/content', { source: { bookSourceName: curBook.source }, chapterUrl: ch.url });
    curText = r.content || '';
    renderChapter();
    curBook.idx = curIdx;
    const i = BOOKS.findIndex((b) => b.bookUrl === curBook.bookUrl && b.source === curBook.source);
    if (i >= 0) { BOOKS[i].idx = curIdx; BOOKS[i].total = curBook.toc.length; store.set(LS.books, BOOKS); }
    updateProg();
  } catch (e) {
    curText = '';
    $('#rd-txt').innerHTML = `<p class="hint" style="color:var(--bad)">${esc(e.message)}</p>`;
  }
}

function updateProg() {
  const total = (curBook && curBook.toc && curBook.toc.length) || 1;
  const pct = Math.round((curIdx + 1) / total * 100);
  $('#rd-prog').style.width = pct + '%';
  $('#rd-pos').textContent = `${curIdx + 1} / ${total} 章 · ${pct}%`;
}

function goChapter(delta) {
  if (!curBook || !curBook.toc || !curBook.toc.length) return;
  const n = curIdx + delta;
  if (n < 0) return toast('已经是第一章了');
  if (n >= curBook.toc.length) return toast('已经是最后一章了');
  curIdx = n;
  renderToc();
  loadChapter();
}

$('#btn-prev').onclick = () => goChapter(-1);
$('#btn-next').onclick = () => goChapter(1);
$('#btn-read-back').onclick = () => { renderToc(); view('toc'); };

document.addEventListener('keydown', (e) => {
  const readOn = document.getElementById('v-read').classList.contains('on');
  if (!readOn) return;
  if (e.target && /input|textarea/i.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') goChapter(-1);
  else if (e.key === 'ArrowRight') goChapter(1);
});

/* ============================================================
   启动
   ============================================================ */
async function boot() {
  renderShelf();
  if (SOURCES.length) {
    try {
      const r = await api('/inspect', { sources: SOURCES });
      CAP = {};
      for (const s of r.sources) CAP[s.name] = { usable: s.usable, reason: s.reason };
      await fetch('/api/novel/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sources: SOURCES }) });
      renderShelf();
    } catch { /* ignore */ }
  }
}
boot();
</script>
